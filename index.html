<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1621">
<meta name="description" content="Ravensmoor — The Mystery Board Game. Two Victorian mysteries to learn the past perfect in English. By BROT2YOU.">
<title>Ravensmoor · The Mystery Board Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1621' stroke='%23e2bd6e' stroke-width='4'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='%23ffe3a1' font-family='Georgia'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a1621;--navy:#11283a;--panel:#132c3c;--panel2:#0e2130;--line:#a7874c;--gold:#e2bd6e;--bright:#ffe3a1;
  --cream:#f7ecce;--paper:#f6e8c8;--ink:#2a2219;--muted:#c3b496;--red:#9b3d44;--green:#3f7d5a;--shadow:0 18px 50px rgba(0,0,0,.45);
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#071119}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#21445a 0,#0c1c2b 700px,#071119 1400px) no-repeat #071119;color:var(--cream);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.cinzel{font-family:Cinzel,"Times New Roman",Georgia,serif;letter-spacing:.03em;line-height:1.2}
h1{font-size:clamp(26px,4.4vw,42px);margin:.15em 0 .3em;color:var(--bright)}
h2{font-size:clamp(20px,3vw,27px);margin:.2em 0 .5em;color:var(--bright)}
h3{font-size:18px;margin:.2em 0 .5em;color:var(--bright)}
p{margin:.4em 0 .8em}
a{color:var(--bright)}
img{max-width:100%}
button,select,input,textarea{font:inherit}
input,select,textarea{font-size:max(16px,1em)}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5d88d;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.dim{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(7,18,27,.94);border-bottom:1px solid #6f5a33;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
.brand{background:none;border:0;color:var(--bright);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.12em;padding:6px 4px;white-space:nowrap}
.brand small{display:block;font-size:9px;letter-spacing:.24em;color:var(--gold);font-family:"DM Sans",Arial,sans-serif}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:1px solid transparent;color:#ead8b0;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}
.nav button.on{border-color:var(--gold);background:#24394a;color:var(--bright)}
.nav button:hover{background:#1c3142}
.icon-btn{background:#1b3244;border:1px solid #6f5a33;color:var(--bright);border-radius:999px;min-width:40px;height:40px;padding:0 12px;white-space:nowrap}
.icon-btn[aria-pressed="true"]{background:#5b4423}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;border:1px solid var(--gold);font-weight:700;min-height:44px;text-decoration:none;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(180deg,#f2d185,#c99a45);color:#2a1d0c;border-color:#f6dc9c}
.btn-line{background:#162d3d;color:var(--bright)}
.btn-red{background:linear-gradient(180deg,#b44a52,#7f2c33);color:#fff4e0;border-color:#d27b80}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* panels */
.panel{background:linear-gradient(160deg,#16303f,#0d1e2b);border:1px solid #5d4a2b;border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.parch{background:linear-gradient(160deg,#f8ecd2,#e9d3a6);color:var(--ink);border-radius:var(--radius);padding:18px;border:1px solid #c9a76a;box-shadow:var(--shadow)}
.parch h3,.parch h2{color:#4a3210}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:8px 0 16px}
.ribbon{background:linear-gradient(90deg,#7f2c33,#a8434b);color:#ffe9c9;font-size:12px;letter-spacing:.14em;padding:7px 14px;border-radius:4px;font-weight:700;white-space:nowrap}
.back{background:none;border:0;color:var(--gold);padding:6px 0;font-weight:700}

/* home */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:min(70vh,560px);display:flex;align-items:flex-end;border:1px solid #806a3f;box-shadow:var(--shadow);
  background:#0b1822 center 35%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,12,20,.05) 30%,rgba(4,12,20,.92) 100%)}
.hero-in{position:relative;z-index:1;padding:28px;max-width:700px}
.logo{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(40px,9vw,92px);letter-spacing:.08em;color:#ffe2a0;text-shadow:0 3px 0 #5b3d12,0 8px 30px rgba(0,0,0,.8);line-height:1;margin:0}
.logo-sub{font-family:Cinzel,Georgia,serif;letter-spacing:.3em;color:#f0d79f;font-size:clamp(12px,2vw,17px);margin:.5em 0 1em}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.step{padding:16px}
.step b{display:block;font-family:Cinzel,Georgia,serif;color:var(--bright);font-size:18px}
.step span{color:var(--gold);font-size:12px;letter-spacing:.16em;font-weight:700}

/* case files */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.case-card{position:relative;overflow:hidden;border-radius:14px;border:1px solid #8a6c3a;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;background:#0b1822 center/cover no-repeat;box-shadow:var(--shadow)}
.case-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,20,.1) 20%,rgba(5,12,20,.95) 78%)}
.case-card>*{position:relative}
.case-body{padding:20px}
.badge{position:absolute;top:14px;left:14px;background:#f2d185;color:#2b1d0a;font-weight:800;font-size:12px;letter-spacing:.12em;padding:6px 10px;border-radius:4px}
.badge.done{background:#7fc29b}
.progress{height:8px;background:#0a1823;border:1px solid #4d3e25;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#c99a45,#f2d185)}

/* board */
.map{position:relative;border-radius:12px;overflow:hidden;border:2px solid #a7874c;background:#071820;aspect-ratio:1586/992}
.map img{display:block;width:100%;height:100%;object-fit:cover}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:rgba(9,23,33,.92);color:#ffe8b2;border:2px solid #edcb7b;border-radius:999px;padding:6px 11px 6px 6px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.pin i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e2bd6e;color:#2a1d0c;font-size:12px}
.pin.full{border-color:#8fe0ae}
.pin.full i{background:#8fe0ae}
.pin:hover,.pin:focus-visible{background:#5b4423}
.rooms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.room-card{background:#0f2433;border:1px solid #5d4a2b;border-radius:10px;overflow:hidden;color:var(--cream);text-align:left;padding:0}
.room-card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.room-card div{padding:9px 11px}
.room-card b{display:block;font-family:Cinzel,Georgia,serif;font-size:15px;color:var(--bright)}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1px solid #e2bd6e;display:block}
.dots i.on{background:#e2bd6e}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed #b89a63}
.checklist li:before{content:"";position:absolute;left:4px;top:10px;width:16px;height:16px;border:2px solid #8a6a35;border-radius:4px}
.checklist li.ok:before{background:#3f7d5a;border-color:#3f7d5a}
.checklist li.ok:after{content:"✓";position:absolute;left:7px;top:5px;color:#fff;font-weight:800;font-size:14px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2e4656}
.stat b{color:var(--bright)}

/* room */
.scene{position:relative;border-radius:12px;overflow:hidden;border:2px solid #a7874c;aspect-ratio:1584/993;background:#091b25}
.scene>img{display:block;width:100%;height:100%;object-fit:cover}
.scene-tag{position:absolute;left:12px;top:12px;background:rgba(8,26,38,.88);border:1px solid #f0ce88;color:#fff1ce;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.objects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.obj{position:relative;background:radial-gradient(circle at 50% 40%,#2a4253,#0d1d29);border:2px solid #7a6034;border-radius:12px;padding:10px 8px 12px;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.obj img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.obj span{font-weight:700;font-size:14px;text-align:center;line-height:1.25}
.obj.sel{border-color:#ffe39f;box-shadow:0 0 0 3px #c99a45}
.obj.found:after{content:"✓";position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#3f7d5a;color:#fff;display:grid;place-items:center;font-weight:800}
.inspect{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.inspect-img{background:radial-gradient(circle,#2f4859,#0b1a25);border-radius:12px;border:1px solid #7a6034;padding:10px;max-width:190px;width:100%;margin:0 auto}
.inspect-img img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.answer{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:2px solid #8a6a35;background:#fffaf0;color:#201a12;font-weight:600}
.answer:hover{background:#ffe9b8}
.answer.bad{background:#f6d4d4;border-color:#a9464c;animation:shake .35s}
.clue{background:#fff7e3;border-left:6px solid #3f7d5a;color:#2a2219;padding:14px 16px;border-radius:8px;font-size:17px;animation:fade .4s}
.tip{background:#173445;border:1px solid #6f8ea1;color:#e5f2fa;border-radius:8px;padding:10px 12px;font-size:14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* suspects */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(160deg,#f7e5c1,#d8b477);border:0;border-radius:12px;padding:8px 8px 12px;color:#2a2219;text-align:center;box-shadow:var(--shadow);border-top:5px solid var(--c,#a7874c)}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:8px;background:#172b39}
.card b{display:block;font-family:Cinzel,Georgia,serif;margin-top:8px;font-size:15px}
.card small{display:block;color:#5d4a2f}
.card .count{display:inline-block;margin-top:6px;background:#2a2219;color:#ffe3a1;border-radius:999px;padding:2px 10px;font-size:12px}
.card.on{outline:3px solid #ffe39f}

/* interrogation */
.talk{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.profile img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:10px;border:2px solid #a7874c}
.chat{display:flex;flex-direction:column;min-height:520px}
.msgs{flex:1;overflow-y:auto;max-height:56vh;padding:16px;display:flex;flex-direction:column;gap:10px;background:#0b1c28;border-radius:10px 10px 0 0;border:1px solid #3b4d58}
.b{max-width:85%;padding:10px 14px;border-radius:14px;animation:fade .25s}
.b.me{align-self:flex-end;background:#e7cf98;color:#2a1d0c;border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:#f8f0de;color:#26201a;border-bottom-left-radius:4px}
.b.them em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#7a5a25;margin-bottom:2px}
.b.tip{align-self:center;max-width:94%;background:#173445;color:#dcecf6;border:1px dashed #6f8ea1;font-size:14px}
.b.good{border-color:#7fc29b;color:#d9f5e3}
.b.ev{align-self:flex-end;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#2f2618;color:#ffe3a1;border:1px solid #a7874c;padding:4px 10px}
.composer{background:#11283a;border:1px solid #3b4d58;border-top:0;border-radius:0 0 10px 10px;padding:12px}
.composer .line{display:flex;gap:8px}
.composer input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid #a7874c;background:#fffaf0;color:#201a12}
.composer select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #6f5a33;background:#0b1c28;color:#ffe9be;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chips button{background:#1e3445;border:1px solid #6f5a33;color:#f2dfb4;border-radius:999px;padding:6px 11px;font-size:13px}

/* notebook */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{background:#162d3d;border:1px solid #6f5a33;color:#f2dfb4;border-radius:999px;padding:9px 15px}
.tabs button.on{background:linear-gradient(180deg,#f2d185,#c99a45);color:#2a1d0c;border-color:#f6dc9c;font-weight:700}
.ev-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ev{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:#fff8e6;color:#2a2219;border-radius:10px;padding:10px;border-left:5px solid #a7874c}
.ev img{width:72px;height:72px;object-fit:contain;background:#253c4b;border-radius:8px}
.ev b{display:block;color:#4a3210}
.ev small{color:#7a6448;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.st{background:#fff8e6;color:#2a2219;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--c,#a7874c)}
.st small{display:block;color:#7a6448;font-size:12px;font-weight:700}
textarea.note,.field{width:100%;padding:12px;border-radius:8px;border:1px solid #a7874c;background:#fffaf0;color:#201a12;line-height:1.5}
textarea.note{min-height:160px}
label.lab{display:block;font-weight:700;margin:14px 0 6px;color:#f2dfb4}

/* grid */
.dtable-wrap{overflow-x:auto;border:1px solid #6f5a33;border-radius:10px;margin:12px 0;-webkit-overflow-scrolling:touch}
.dtable{border-collapse:separate;border-spacing:0;min-width:720px;width:100%;background:#0f2433}
.dtable th,.dtable td{border-bottom:1px solid #2e4656;border-right:1px solid #2e4656;padding:6px;text-align:center;font-size:13px}
.dtable th{background:#1b3244;color:var(--bright);font-weight:700;position:sticky;top:0}
.dtable td:first-child,.dtable th:first-child{position:sticky;left:0;background:#162b3a;text-align:left;min-width:140px;z-index:1}
.cell{width:42px;height:38px;border-radius:8px;border:1px solid #6f5a33;background:#0b1c28;color:#c3b496;font-weight:800;font-size:18px}
.cell.y{background:#244d37;color:#b9f7c8;border-color:#5fae7e}
.cell.n{background:#4d2328;color:#ffd1d1;border-color:#a9464c}

/* lab */
.lesson{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.formula{font-family:Cinzel,Georgia,serif;font-size:19px;background:#2a2219;color:#ffe3a1;padding:6px 12px;border-radius:6px;display:inline-block}
.q-block{margin-bottom:16px}
.word-bank,.word-line{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:8px}
.word-line{background:#fffaf0;border:2px dashed #a7874c}
.word-bank{background:#0b1c28;border:1px solid #3b4d58}
.word{background:#f2d185;color:#2a1d0c;border:0;border-radius:6px;padding:7px 12px;font-weight:700}
.word-line .word{background:#2a2219;color:#ffe3a1}
.tl-item{display:flex;align-items:center;gap:10px;background:#fff8e6;color:#2a2219;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.tl-item span{flex:1}
.tl-item button{background:#2a2219;color:#ffe3a1;border:0;border-radius:6px;width:40px;height:40px;font-size:18px}
.ptable{width:100%;border-collapse:collapse;color:#2a2219}
.ptable td,.ptable th{border-bottom:1px solid #c9a76a;padding:5px 8px;text-align:left}
.ptable td:last-child{font-weight:800;color:#7f2c33}
.status{border-radius:8px;padding:10px 14px;margin:10px 0}
.status.ok{background:#1f4a33;border:1px solid #5fae7e;color:#d9f5e3}
.status.warn{background:#4a3a1a;border:1px solid #c99a45;color:#ffe9be}
.status.bad{background:#4d2328;border:1px solid #a9464c;color:#ffe1e1}

/* verdict */
.stars{font-size:34px;letter-spacing:6px;color:#f2d185}
.report{background:#fff8e6;color:#2a2219;border-radius:12px;padding:20px;border:1px solid #c9a76a}
.report h2,.report h3{color:#4a3210}
.report li{margin-bottom:6px}

/* station */
.station-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,9,14,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{max-width:460px;width:100%;background:#f8ecd2;color:#2a2219;border-radius:14px;padding:22px;border:2px solid #c9a76a}
.modal-box h3{color:#4a3210}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#f2d185;color:#2a1d0c;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* teacher & print */
.qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.qr-card{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:#fff;color:#1d1a16;border:2px solid #2a2219;border-radius:10px;padding:12px;break-inside:avoid;page-break-inside:avoid}
.qr-card img.portrait{width:120px;height:150px;object-fit:cover;object-position:center top;border-radius:6px}
.qr-card img.qr{width:130px;height:130px;image-rendering:pixelated}
.qr-card h3{color:#4a3210;margin:0 0 4px}
.sheet{background:#fff;color:#1d1a16;border-radius:8px;padding:28px;max-width:820px;margin:0 auto;font-size:14px}
.sheet h1,.sheet h2,.sheet h3{color:#2a2219}
.sheet h2{font-size:17px;border-bottom:2px solid #2a2219;padding-bottom:3px;margin-top:18px}
.sheet table{width:100%;border-collapse:collapse;margin:6px 0}
.sheet td,.sheet th{border:1px solid #444;padding:6px;vertical-align:top;text-align:left}
.sheet .lines div{border-bottom:1px solid #777;height:28px}
.key{background:#fff8e6;color:#2a2219;border-radius:12px;padding:20px}
.key h3{color:#4a3210}
.footer{text-align:center;color:#8f8063;font-size:12px;letter-spacing:.14em;padding:26px 10px 10px}
.footer button{background:none;border:0;color:var(--gold);text-decoration:underline;font-size:12px;letter-spacing:.1em}

@media(max-width:980px){
  .grid2,.talk{grid-template-columns:1fr}
  .profile{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
  .rooms,.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .wrap{padding:12px 10px 30px}
  .cases,.ev-list,.lesson,.qr-grid,.grid3{grid-template-columns:1fr}
  .rooms,.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inspect{grid-template-columns:1fr}
  .inspect-img{max-width:220px;margin:0 auto}
  .pin{font-size:0;padding:4px;gap:0}
  .pin i{width:26px;height:26px;font-size:12px}
  .objects{gap:8px}
  .obj{min-height:120px;padding:8px 4px}
  .obj span{font-size:12px}
  .hero-in{padding:20px}
  .brand{font-size:16px}
  .msgs{max-height:48vh}
  .chat{min-height:0}
  .qr-card{grid-template-columns:90px 1fr}
  .qr-card img.portrait{width:90px;height:120px}
  .qr-card img.qr{width:110px;height:110px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff!important;color:#000;padding:0}
  .top,.no-print,.footer,#toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{padding:0;box-shadow:none}
  .qr-grid{grid-template-columns:repeat(2,1fr);gap:8mm}
  .qr-card{border:1.5px solid #000}
  .key{background:#fff}
  @page{margin:12mm}
}
#inspect{scroll-margin-top:72px}

.badge.soon{background:#6f5a33;color:#ffe9be}
.case-card.locked{filter:saturate(.55)}
.case-card.locked h2{color:#d9c7a1}
.cases{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.case-body{text-shadow:0 1px 3px rgba(0,0,0,.9)}.case-card:before{background:linear-gradient(180deg,rgba(5,12,20,.15) 10%,rgba(5,12,20,.97) 62%)}

s"],"a":0,"t":"Past perfect continuous (had been + V-ing): an activity in progress, or its duration, up to a moment in the past.","k":false,"w":["jewellery","jewelry","box","friends again"],"img":"assets/objects/drawing-2.webp"},{"n":"Lady Voss’s handkerchief","c":"Under the handkerchief lies Mr Reed’s tea log: tea served at 9:00, 9:30 and 10:00, each time signed by Lady Voss. They had been together all that time.","q":"By ten o’clock, Mr Reed ___ tea three times.","o":["had served","had serve","has served"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["handkerchief","tea log","log","tea"],"img":"assets/objects/drawing-3.webp"}],"kitchen":[{"n":"A silver tray","c":"The tray is in the sink with Lord Ashford’s cocoa cup. Somebody had washed the jug, but not the cup. The cup smells bitter. Lord Ashford always had cocoa at ten.","q":"Somebody ___ the jug before the police arrived.","o":["had washed","had wash","had been wash"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["tray","cocoa","cup","jug","drink","chocolate"],"img":"assets/objects/kitchen-1.webp"},{"n":"The cook’s recipe book","c":"Between the pages: the staff duty notes. Mrs Potts wrote: “I had finished downstairs by ten.” Below, the maid Agnes wrote: “Mrs P. took the cocoa tray upstairs at 10:05.”","q":"Mrs Potts wrote that she ___ downstairs by ten.","o":["had finished","has finished","had been finish"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["recipe","duty","notes","agnes","maid","duty notes"],"img":"assets/objects/kitchen-2.webp"},{"n":"A small empty bottle","c":"The bottle was hidden behind the flour jars. Label: “Sleeping draught — Dr Finch. Not more than ten drops.” Somebody had emptied it.","q":"Which question asks about duration?","o":["How long had the bottle been hidden there?","How long had the bottle hidden there?","How long the bottle had been hidden?"],"a":0,"t":"Question form: Had + subject + past participle? / How long had + subject + been + V-ing?","k":true,"w":["bottle","draught","poison","drops","sleeping"],"img":"assets/objects/kitchen-3.webp"}],"garden":[{"n":"A gardening glove","c":"The glove has the initials I.B. Ivy Bramble had been repotting orchids until 9:30: the soil inside is still damp.","q":"Ivy ___ orchids until 9:30.","o":["had been repotting","had been repot","has repotting"],"a":0,"t":"Past perfect continuous (had been + V-ing): an activity in progress, or its duration, up to a moment in the past.","k":false,"w":["glove","orchid","orchids","soil"],"img":"assets/objects/garden-1.webp"},{"n":"Pruning shears","c":"Under the shears: Ivy’s work notes. “9:30 — conservatory locked. The lamp was on in the study. His Lordship was at his desk, writing.”","q":"What had Lord Ashford been doing at 9:30?","o":["He had been writing at his desk.","He had been write at his desk.","He has been writing at his desk."],"a":0,"t":"Past perfect continuous (had been + V-ing): an activity in progress, or its duration, up to a moment in the past.","k":false,"w":["shears","work notes","window","lamp","writing"],"img":"assets/objects/garden-2.webp"},{"n":"A flower pot","c":"Near the pot, white powdery footprints go from the servants’ corridor to the back staircase. It looks like flour from the kitchen.","q":"The person ___ through the kitchen before taking the back stairs.","o":["had walked","had walk","had been walk"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["footprint","footprints","flour","pot","powder"],"img":"assets/objects/garden-3.webp"}],"hall":[{"n":"Dr Finch’s umbrella and bag","c":"Dr Finch’s umbrella and medical bag are in the hall stand. He had left them there at 8:45. The bag was not locked: anybody could have opened it.","q":"When had Dr Finch left his bag in the hall?","o":["He had left it there at 8:45.","He had leaved it there at 8:45.","He has left it there at 8:45."],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["umbrella","bag","medical bag","doctor’s bag","doctor's bag"],"img":"assets/objects/hall-1.webp"},{"n":"A train ticket","c":"A ticket to London for Sunday, found in Colonel Hartley’s coat. It had been bought on Thursday, two days before the argument.","q":"Which event happened first?","o":["The Colonel bought the ticket.","The Colonel argued with his brother.","Both happened on Saturday."],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["ticket","train","london"],"img":"assets/objects/hall-2.webp"},{"n":"The hall boy’s note","c":"Tom, the hall boy, polished the canes by the main staircase from 9:15 to 10:30. His note: “Nobody had used the main staircase all that time.”","q":"Nobody ___ the main staircase between 9:15 and 10:30.","o":["had used","had use","has used"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["cane","tom","hall boy","main staircase"],"img":"assets/objects/hall-3.webp"}],"dining":[{"n":"Lord Ashford’s wine glass","c":"Dr Finch tested the glass this morning: nothing unusual. Lord Ashford had not been poisoned at dinner.","q":"So the poison ___ to him after dinner.","o":["had been given","had given","has been give"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["glass","wine"],"img":"assets/objects/dining-1.webp"},{"n":"Clara’s napkin","c":"During dinner, Clara had written on her napkin: “Uncle told Mrs P.: come to my study at ten. He looked angry.”","q":"Clara ___ the note during dinner.","o":["had written","had wrote","had been wrote"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["napkin","note on the napkin"],"img":"assets/objects/dining-2.webp"},{"n":"The dinner invitation","c":"On the back, in Mrs Potts’s handwriting, a list of tasks. The last line: “10 o’clock — cocoa for his Lordship.” It had been crossed out.","q":"The last line ___ out.","o":["had been crossed","had crossed been","has been cross"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["invitation","list","tasks","crossed"],"img":"assets/objects/dining-3.webp"}]},"suspects":{"colonel":{"hello":"Colonel Hartley. My brother is dead, detective. Ask your questions.","alibi":"From half past eight until eleven, I had been playing cards and billiards with Dr Finch. We never left the billiard room.","before":"At six, I had argued with Edmund in his study about his will. I had left the study by a quarter past six.","duration":"We had been playing for two hours when the clock struck half past ten.","motive":"Yes, Edmund had decided to give me nothing in his new will. I was furious. But anger is not murder.","witness":"Dr Finch was with me all evening. We signed the score card every half hour.","detail":"I had not gone upstairs after dinner. My knee is bad: I never climb those stairs at night.","after":"When Reed shouted at half past ten, Finch and I ran upstairs together.","victim":"Edmund and I had not been close for years. Still, he was my brother.","unknown":"I am a soldier, not a poet. Ask me something clear: where I was, what I had done, who saw me."},"doctor":{"hello":"Dr Finch, the family doctor. This is a terrible night.","alibi":"I had been with Colonel Hartley in the billiard room since half past eight. We stayed there until Reed called us.","before":"I had examined Lord Ashford at five. His heart was weak, but he was not in danger.","duration":"We had been playing cards for two hours when we heard Reed shout.","motive":"Lord Ashford had told me about his new will. I had not asked him for anything, I promise you.","witness":"The Colonel can confirm it. And the score card is signed.","detail":"My medical bag? I had left it in the hall at a quarter to nine. It was not locked. Somebody had taken my bottle of sleeping draught.","after":"I examined him at 10:35. He had been dead for about twenty minutes.","victim":"He had been my patient for fifteen years. A difficult man, but a fair one.","unknown":"Forgive me, I don’t follow. Ask me about the evening, my bag, or what I had seen."},"clara":{"hello":"Clara Ashford. I am his niece. I… I still can’t believe it.","alibi":"I had been reading in my bedroom since nine. At ten past ten, I heard footsteps in the back corridor.","before":"At dinner, my uncle had told Mrs Potts to come to his study at ten. He looked angry. I wrote it on my napkin.","duration":"I had been reading for over an hour when I heard the footsteps.","motive":"My uncle had planned to leave me money in his new will. But it had not been signed. I gained nothing tonight.","witness":"I was alone. Nobody can confirm it. But I heard someone with a tray: cups were rattling.","detail":"The footsteps came from the back staircase — the servants’ stairs — not the main staircase. They went towards the study.","after":"I came out when I heard Mr Reed shout. Everyone was running.","victim":"He had always been kind to me, even when he was angry with everyone else.","unknown":"I’m sorry, I don’t understand. Could you ask me where I was, or what I had heard?"},"reed":{"hello":"Reed, detective. I have served at Ravensmoor for twelve years.","alibi":"From nine until ten, I had been serving tea to Lady Voss in the drawing room. Then I cleared the tea things until almost half past ten.","before":"I had set every clock in the house at six, and I had cleaned the study at seven.","duration":"I had been working since six in the morning when I found his Lordship.","motive":"His Lordship and I had never had a serious disagreement. I have lost my position tonight, detective.","witness":"Lady Voss signed my tea log at nine, half past nine and ten. She stayed in the drawing room while I cleared up.","detail":"Mrs Potts usually takes his Lordship’s cocoa up at ten, by the back stairs. Tonight she told me she had stayed downstairs.","after":"At 10:30, I went up to ask if he needed anything. The door had been locked from the outside. I opened it with my own key and found him.","victim":"He was a strict master, but he had always paid me on time. Not everyone could say that.","unknown":"I beg your pardon. Perhaps you could ask about the tea, the keys or the household?"},"voss":{"hello":"Lady Voss. An old friend of the family — a very old friend.","alibi":"I had been in the drawing room with Mr Reed from nine until ten. Then I played the piano while he cleared the tea things.","before":"I had arrived on Friday. Edmund and I had talked about old times in the garden.","duration":"I had been talking to Mr Reed for nearly an hour when the clock struck ten.","motive":"Edmund and I had been engaged once, in 1870. Then he married someone else. But we had made peace long ago.","witness":"Mr Reed was with me. I signed his little tea log each time he served.","detail":"At about ten past ten, I heard someone above the drawing room, near the study. Light steps — and the sound of china.","after":"I was playing the piano when Reed shouted. I went upstairs after the gentlemen.","victim":"He had been my friend for forty years. Do you think I would hurt him?","unknown":"My dear detective, please be precise. What exactly would you like to know?"},"gardener":{"hello":"Ivy Bramble. I look after the conservatory and the gardens.","alibi":"I had been repotting orchids in the conservatory until half past nine. Then I locked up and walked to my cottage.","before":"I had been working outside since two o’clock. I had not been inside the house all day.","duration":"I had been working for seven and a half hours when I locked the conservatory.","motive":"Lord Ashford had always paid me fairly. He loved his orchids. I had no reason to hurt him.","witness":"Sam, the stable boy, saw me arrive at my cottage at a quarter to ten.","detail":"At half past nine, I looked up at the study window. The lamp was on. His Lordship had been writing at his desk — he was alive.","after":"I only heard the news this morning. I had gone to bed early.","victim":"He was a quiet man with his plants. Not so quiet with people.","unknown":"Sorry, I don’t follow. Ask me about the garden, the time, or what I had seen."},"potts":{"hello":"Mrs Potts, the housekeeper. I have so much work, detective. Be quick, please.","alibi":"I had been working in the kitchen until ten. Then I checked the rooms downstairs. Only downstairs.","before":"I had served dinner at eight. Every course, all by myself.","duration":"I had been working since five in the morning. I was very tired.","motive":"His Lordship had not paid me for six months. But I would never… I needed this job!","witness":"Agnes was with me until half past nine. After that, I had been working alone.","detail":"No! I had not gone upstairs that evening. I only checked the rooms downstairs.","after":"I was in the kitchen when I heard Mr Reed shout. I ran upstairs with everyone else.","victim":"He was a hard master. He had promised me my wages so many times…","unknown":"I don’t have time for riddles. Ask me a proper question, detective."}},"lies":["potts|detail","potts|study:0","potts|kitchen:1","potts|dining:1","potts|dining:2"],"evidence":{"potts|kitchen:1":"Agnes must be mistaken! I had not taken any tray upstairs. I stayed downstairs.","potts|kitchen:0":"I wash cups all day, detective. I don’t remember that one.","potts|kitchen:2":"That bottle? I had never seen it before. Anybody can come into my kitchen.","potts|study:0":"He wanted to see me at ten… but I didn’t go. I had too much work.","potts|study:1":"My key ring hangs in the kitchen. Anybody could have taken a key.","potts|dining:2":"I had crossed it out because his Lordship had said he didn’t want cocoa tonight.","potts|dining:1":"Yes, he had asked me to come at ten. But I had decided not to go.","potts|garden:2":"Flour? There is flour everywhere near a kitchen. That proves nothing.","potts|hall:2":"The back stairs are for the servants. Mr Reed uses them too.","potts|hall:0":"The doctor’s bag? I had not touched it. I never go into the hall.","reed|study:1":"That key comes from Mrs Potts’s ring. Mine had been in my pocket all evening.","reed|kitchen:0":"His Lordship’s cocoa cup. Mrs Potts always prepares it herself.","reed|kitchen:1":"Agnes is an honest girl. If she wrote 10:05, it was 10:05.","reed|hall:2":"If Tom says nobody had used the main staircase, I believe him. He is an honest boy.","reed|drawing:2":"That is my tea log. Lady Voss signed it three times.","reed|study:2":"When I found him at 10:30, his watch had already stopped.","reed|library:2":"I had set all the clocks myself at six. They are exact.","doctor|kitchen:2":"That is my bottle! It had been in my bag. Somebody had taken it from the hall.","doctor|hall:0":"Yes, I had left my bag in the hall at 8:45. I was careless.","doctor|dining:0":"I tested that glass myself. He had not been poisoned at dinner.","doctor|study:2":"10:12… That matches my examination. He had died about twenty minutes before I saw him.","doctor|library:1":"I knew about the will. But it had not been signed, so I gained nothing.","doctor|library:0":"A dangerous page. Twenty drops can kill a man with a weak heart.","doctor|billiard:1":"Our score card. We signed it every half hour.","doctor|kitchen:0":"That bitter smell… the sleeping draught had been mixed with the cocoa.","colonel|library:1":"So he had really done it. Nothing for me. But I was in the billiard room all night.","colonel|hall:1":"I had bought that ticket on Thursday. I had planned that trip before our argument.","colonel|billiard:1":"There, you see? Signed at 9:30, 10:00 and 10:30.","colonel|billiard:2":"Mine. I had taken them off at nine. It was hot in there.","colonel|billiard:0":"Finch had been losing all evening. He is a terrible player.","clara|dining:1":"Yes, I wrote that. My uncle had told Mrs Potts to come at ten.","clara|hall:2":"Nobody used the main stairs? Then the footsteps I heard had come up the back stairs.","clara|library:1":"I didn’t know the will had not been signed. It doesn’t matter now.","clara|kitchen:0":"Cups rattling on a tray… that is exactly what I heard at ten past ten.","voss|drawing:0":"That photograph… We had been engaged before he chose another woman. It was a long time ago.","voss|drawing:1":"His letter. We had been angry for years, but we had made peace.","voss|drawing:2":"I signed Mr Reed’s log at nine, half past nine and ten. He never left me.","voss|kitchen:0":"China on a tray! Yes, that was the sound I heard above the drawing room.","gardener|garden:0":"My glove. I had been repotting orchids until half past nine.","gardener|garden:1":"Those are my notes. At 9:30 he had been writing at his desk. He was alive.","gardener|garden:2":"That powder is flour, not soil. Somebody from the kitchen had walked through here."},"whyNot":{"colonel":"Colonel Hartley had a motive (the new will), but the score card proves that he had been in the billiard room from 9:30 to 10:30.","doctor":"The bottle was Dr Finch’s, but he had left his bag unlocked in the hall, and the score card shows he had not left the billiard room.","clara":"Clara gained nothing: the new will had not been signed. And she is the witness who heard the tray on the back stairs.","reed":"Mr Reed had been with Lady Voss in the drawing room until almost 10:30 — his tea log is signed.","voss":"Lady Voss and Lord Ashford had made peace in 1890, and she had been with Mr Reed all that time.","gardener":"Ivy Bramble had left the house at 9:30 — and she saw Lord Ashford alive at that moment."},"solution":["Mrs Potts had not been paid for six months, and Lord Ashford had decided to dismiss her (his diary).","During dinner, he told her to come to his study at ten (Clara’s napkin, and her list of tasks with the crossed-out line “cocoa for his Lordship”).","At 8:45, Dr Finch had left his unlocked medical bag in the hall. Mrs Potts took the bottle of sleeping draught and put it in the cocoa.","At 10:05, she carried the tray up the back staircase (Agnes’s duty note, the flour footprints, and Tom’s note: nobody had used the main staircase). Clara and Lady Voss heard the cups on the tray.","Lord Ashford drank the cocoa. His watch stopped at 10:12 when he fell. Mrs Potts locked the door with a key from her own ring, washed the jug, hid the empty bottle behind the flour jars and wrote that she had finished downstairs by ten.","Her lie: “I had not gone upstairs that evening.” Agnes’s note proves the opposite."]},{"id":2,"code":"002","title":"The Missing Sapphire","tagline":"A jewel vanishes. The lock is intact.","date":"Saturday, 13 December 1890","cover":"assets/rooms/dining.webp","briefing":["Lady Eleanor Ashford is giving a grand reception. At 9:00 PM, she shows her guests the famous Midnight Sapphire. At 9:15, she closes its jewellery box.","At 9:18, Mr Reed carries the box to the study. At 10:00, Lady Eleanor opens it: the sapphire has disappeared — but the lock has not been forced.","Your mission: explore the rooms, solve the English challenges, question the seven guests and staff, and find out who is lying. A motive is not a proof."],"question":"Who took the Midnight Sapphire?","culprit":"clara","victimWords":["lady eleanor","your aunt","eleanor","her ladyship","the sapphire","sapphire","jewel","stone"],"slots":["Before 9:15","9:15–9:20","9:20–9:25","9:25–9:30","After 9:30"],"timeline":[{"t":"8:45 PM","e":"Clara borrowed the duplicate key of the jewellery box."},{"t":"9:15 PM","e":"Lady Eleanor closed the jewellery box."},{"t":"9:18 PM","e":"Mr Reed carried ys she ___ it before dinner.","o":["had lost","had losed","has been losing"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":true,"w":["handkerchief","c.a."],"img":"assets/objects/drawing-3.webp"}],"hall":[{"n":"The Colonel’s umbrella","c":"The hall attendant logged Colonel Hartley leaving his umbrella at 9:17. The attendant had been watching the hall until 9:30.","q":"Which form shows duration?","o":["had been watching","had watched","has been watch"],"a":0,"t":"Past perfect continuous (had been + V-ing): an activity in progress, or its duration, up to a moment in the past.","k":false,"w":["umbrella","attendant"],"img":"assets/objects/hall-1.webp"},{"n":"A torn ticket","c":"A carriage ticket places Dr Finch’s driver at the east gate at 9:25. The doctor was inside with his nurse.","q":"The driver ___ the gate by 9:25.","o":["had reached","had reach","had been reach"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["ticket","carriage","driver"],"img":"assets/objects/hall-2.webp"},{"n":"Lady Voss’s cane","c":"Lady Voss left her cane in the hall. The porter saw her enter the dining room at 9:22.","q":"Lady Voss ___ the dining room before 9:25.","o":["had entered","had enter","has entered"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["cane","porter"],"img":"assets/objects/hall-3.webp"}],"billiard":[{"n":"A billiard cue","c":"The scorekeeper saw Colonel Hartley playing billiards from 9:19 to 9:29.","q":"At 9:29, the Colonel ___ for ten minutes.","o":["had been playing","had played been","was play"],"a":0,"t":"Past perfect continuous (had been + V-ing): an activity in progress, or its duration, up to a moment in the past.","k":false,"w":["cue","billiard","billiards","scorekeeper"],"img":"assets/objects/billiard-1.webp"},{"n":"The score card","c":"A score card signed by Colonel Hartley and the marker at 9:26 supports his alibi.","q":"Which question checks an alibi?","o":["Had you left the billiard room before 9:30?","Had you leave the billiard room before 9:30?","Did you had left the billiard room?"],"a":0,"t":"Question form: Had + subject + past participle? / How long had + subject + been + V-ing?","k":false,"w":["card","score","marker","signed"],"img":"assets/objects/billiard-2.webp"},{"n":"A cufflink","c":"Mr Reed’s cufflink was found in the study, where he had put the box at 9:18. Its presence does not prove that he took the jewel.","q":"Reed ___ the box before he left at 9:20.","o":["had put","had putted","had been put"],"a":0,"t":"Past perfect simple (had + past participle): an action completed before another moment in the past.","k":false,"w":["cufflink","cufflinks"],"img":"assets/objects/billiard-3.webp"}]},"suspects":{"reed":{"hello":"Reed, detective. The sapphire was in my care. I feel responsible.","alibi":"I carried the box to the study at 9:18. I had left the room by 9:20, and I came back at 9:30.","before":"At 9:15, Lady Eleanor had closed the box in front of everyone. Then she gave it to me.","duration":"I had been serving the guests for over two hours when the sapphire disappeared.","motive":"I have no use for a sapphire, detective. I had served this family for twelve years without a single complaint.","witness":"The hall clock and my signed service log show that I had left the study at 9:20.","detail":"The duplicate key? Miss Clara had borrowed it at 8:45. I never received it back.","after":"At 9:30 I went back to the study. Nothing looked different. At 10:00, Lady Eleanor opened the box: it was empty.","victim":"Lady Eleanor had worn that sapphire at every reception for twenty years.","unknown":"I beg your pardon. Perhaps ask me about the box, the key or the times?"},"clara":{"hello":"Clara Ashford. Is this really necessary? I am family.","alibi":"I had been in the drawing room between 9:20 and 9:30. I was talking to the guests.","before":"At 8:45, I had borrowed the duplicate key to check the clasp. I had returned it before nine.","duration":"I had been chatting with the guests for an hour. It was terribly boring.","motive":"My aunt had promised me that sapphire years ago. Then she changed her mind. But I would never steal it.","witness":"Everybody saw me. Well… I can’t remember exactly who.","detail":"The library? I hadn’t been near the library all evening.","after":"At ten, I was as surprised as everyone else.","victim":"My aunt loves that stone more than she loves me.","unknown":"What a strange question. Ask me something sensible, detective."},"voss":{"hello":"Lady Voss. What an evening!","alibi":"I had been sitting at the dining table since 9:22. The waiter served me at 9:23.","before":"I had admired the sapphire at nine, like everybody else.","duration":"I had been sitting in the dining room for a few minutes when I saw Clara.","motive":"I have my own jewels, darling. I don’t need Eleanor’s.","witness":"The waiter served me at 9:23 and wrote it down. The porter saw me come in.","detail":"At about 9:25, I saw Clara come out of the study. She walked quickly towards the library, with her embroidered handkerchief in her hand.","after":"At ten, Eleanor screamed. I had never heard her scream before.","victim":"Eleanor and I had been friends since school.","unknown":"Darling, I don’t understand. Ask me what I had seen!"},"potts":{"hello":"Mrs Potts, the housekeeper. Busy night, detective.","alibi":"From 9:18 until 9:28, the cook and I had been preparing dessert in the kitchen.","before":"I had folded all the napkins before the guests arrived.","duration":"We had been preparing dessert for ten minutes when the bell rang.","motive":"A sapphire? What would a housekeeper do with a sapphire? Everybody would know!","witness":"The cook was with me. The serving record is signed too.","detail":"I never go into the study during a reception. That is Mr Reed’s job.","after":"At ten, I heard the shouting from the kitchen.","victim":"Lady Eleanor is a generous mistress. I hope you find her jewel.","unknown":"Ask me a proper question, detective. I have dessert to serve."},"colonel":{"hello":"Colonel Hartley. Let’s make this quick.","alibi":"I had been playing billiards from 9:19 to 9:29. The marker saw me.","before":"I had left my umbrella in the hall at 9:17, then I went to the billiard room.","duration":"We had been playing for ten minutes when someone rang the bell.","motive":"I am a rich man, detective. I don’t need my sister-in-law’s jewels.","witness":"The marker. We signed the score card at 9:26.","detail":"I had not been near the study. Ask the marker.","after":"At ten, I went to the drawing room with the others.","victim":"Eleanor loves that stone. A bit too much, if you ask me.","unknown":"Speak clearly, detective. Where, when, who?"},"doctor":{"hello":"Dr Finch. I only came for the music.","alibi":"At 9:25, my nurse and I had been labelling medicine bottles in the kitchen corridor.","before":"I had arrived late, at 8:30, by carriage.","duration":"We had been labelling bottles for twenty minutes.","motive":"I don’t care about jewels. I care about my patients.","witness":"My nurse was with me. And my driver was at the east gate.","detail":"The violet liquid? Only ink, for my labels.","after":"At ten, I gave Lady Eleanor something to calm her nerves.","victim":"Lady Eleanor is my patient. She was very upset.","unknown":"I’m not sure I understand. Ask me about the times, perhaps?"},"gardener":{"hello":"Ivy Bramble, the head gardener.","alibi":"At 9:24, I had been working outside with the groundskeeper.","before":"I had put my shears back in the conservatory at 9:15.","duration":"We had been working outside for half an hour.","motive":"I prefer orchids to sapphires. Orchids grow.","witness":"The groundskeeper was with me.","detail":"Those soil marks near the pot are mine. I had left them at 9:10, before the box went to the study.","after":"At ten, I was still outside. I heard about the theft later.","victim":"Lady Eleanor never comes to the conservatory.","unknown":"Sorry, I don’t follow. Ask me about the garden or the times."}},"lies":["clara|alibi","clara|before","clara|detail","clara|study:1","clara|drawing:2","clara|library:0","clara|drawing:1"],"evidence":{"clara|study:1":"I borrowed the duplicate key at 8:45 to check the clasp. I had returned it before nine — I simply forgot to sign the register.","reed|study:1":"The register shows that Miss Clara had borrowed the duplicate at 8:45. I never received it back from her.","clara|drawing:2":"I had lost that handkerchief before dinner. I never entered the library after nine.","voss|drawing:2":"I saw Clara walking towards the library at about 9:26. I remember her embroidered handkerchief.","clara|library:0":"I had not touched that book. I was in the drawing room between 9:20 and 9:30.","voss|library:0":"I had seen Clara coming out of the study around 9:25, heading towards the library.","reed|study:2":"I left the box on the study table at 9:18. I had left the room by 9:20, and I came back at 9:30.","potts|kitchen:1":"The cook and I had been preparing dessert from 9:18 until 9:28. She can confirm that.","colonel|billiard:1":"I had been playing with the marker in the billiard room. We signed the score at 9:26.","doctor|kitchen:2":"The nurse and I had been labelling bottles at 9:25. The liquid was only violet ink.","clara|drawing:0":"That scarf belongs to me, but a photograph does not prove that I stole anything.","clara|drawing:1":"I never opened the jewellery box after my aunt showed it to us.","reed|drawing:1":"The lock had not been forced. Somebody with a key must have opened it.","voss|dining:0":"I had been sitting at the dining table at 9:23. The waiter brought me a glass.","clara|library:1":"I asked a jeweller about the sapphire, but I was only curious about its value.","clara|study:0":"A diary is private! I was angry, that’s all. Everybody writes silly things.","reed|billiard:2":"Yes, that is my cufflink. I had put the box on the table at 9:18. It must have fallen then.","gardener|garden:0":"My glove. I had been working outside with the groundskeeper.","gardener|garden:2":"Those marks are from my boots. I had left them at 9:10.","voss|hall:2":"My cane. The porter saw me go into the dining room at 9:22.","colonel|hall:0":"My umbrella. The attendant can tell you where I went.","doctor|hall:1":"My driver had been waiting at the east gate. I was inside."},"whyNot":{"reed":"Mr Reed had left the study at 9:20 (hall clock and signed service log) — and the lock was opened with the duplicate key, which he never had.","voss":"Lady Voss had been in the dining room since 9:22: the porter and the waiter saw her. She is the witness who saw Clara.","potts":"Mrs Potts had been preparing dessert with the cook from 9:18 to 9:28. The serving record is signed.","colonel":"Colonel Hartley had been playing billiards from 9:19 to 9:29. The score card was signed at 9:26.","doctor":"Dr Finch had been labelling bottles with his nurse at 9:25. The violet liquid was only ink.","gardener":"Ivy Bramble had been working outside with the groundskeeper. Her soil marks date from 9:10."},"solution":["Clara wanted the sapphire: her aunt had refused to give it to her (her diary), and a jeweller had already written to her about the price of “a large blue stone”.","At 8:45, she had borrowed the duplicate key of the jewellery box and never signed it back (key register, Mr Reed).","Mr Reed left the study at 9:20. At about 9:25, Lady Voss saw Clara come out of the study and walk towards the library with her handkerchief.","Clara opened the box with the duplicate key — the lock is intact, and a blue silk fibre from her scarf stayed in the velvet. She hid the sapphire in the hollow book in the library, where a blue silk thread was caught and her handkerchief was found.","Her lies: “I had been in the drawing room between 9:20 and 9:30”, “I had returned the key before nine” and “I hadn’t been near the library all evening.”"]},{"id":3,"code":"003","title":"The Midnight Letter","tagline":"An anonymous letter. A midnight deadline. An empty urn.","date":"Saturday, 6 June 1891","cover":"assets/rooms/garden.webp","briefing":["It is the night of the Ravensmoor summer ball. At 11:02 PM, Lord Ashford goes up to his bedroom and finds a letter on his pillow: “I KNOW YOUR SECRET. PUT £200 IN THE STONE URN IN THE CONSERVATORY BEFORE MIDNIGHT. TELL NO ONE.”","Lord Ashford obeys. At 11:30, Mr Reed puts an envelope with £200 in the urn. At midnight, everybody goes out onto the terrace for the fireworks. At 00:15, the envelope has disappeared.","Your mission: explore the rooms, solve the English challenges, question the seven guests and staff, and find out who wrote the letter and took the money. Somebody is lying. A motive is not a proof."],"question":"Who wrote the midnight letter and took the money?","culprit":"doctor","victimWords":["lord ashford","his lordship","your brother","your uncle","edmund","your master","the victim","him"],"slots":["Before 10:30","10:30–11:00","11:00–11:40","11:40–00:00","After midnight"],"timeline":[{"t":"10:20 PM","e":"Dr Finch asked Mrs Potts for a pot of flour paste."},{"t":"11:02 PM","e":"Lord Ashford found the letter on his pillow."},{"t":"11:30 PM","e":"Mr Reed put the envelope with £200 in the stone urn."},{"t":"11:40 PM","e":"Dr Finch put down his cue and left the billiard room."},{"t":"11:50 PM","e":"A gentleman with spectacles went towards the conservatory."},{"t":"00:15 AM","e":"Lord Ashford and Mr Reed found the urn empty."}],"objects":{"library":[{"n":"A cut-up medical journal","c":"On the library table: a copy of The Lancet, a journal for doctors. Several words had been cut out of page 12: “secret”, “midnight”, “tell”, “no one”.","q":"Somebody ___ words out of the journal before the letter was delivered.","o":["had cut","had cutted","had been cut"],"a":0,"t":"Past perf ven. He wouldn’t tell me why.","unknown":"Speak clearly, detective. Where, when, who?"},"doctor":{"hello":"Dr Finch. A blackmail letter? How shocking.","alibi":"I had been in the billiard room with the Colonel until midnight. Then I watched the fireworks with everybody.","before":"I had been resting in the hall with a book before the game began at 10:50.","duration":"We had been playing for… oh, a long time. I don’t remember exactly.","motive":"Money? I had never had any money problems, detective.","witness":"The Colonel, of course. And… everybody on the terrace.","detail":"The conservatory? I had not gone near the conservatory all evening.","after":"After the fireworks, I went to supper. I was a little late, that’s all.","victim":"Lord Ashford had been my patient and my friend for fifteen years.","unknown":"I’m not sure I follow, detective. Ask me something else."},"clara":{"hello":"Clara Ashford. Is it true? Somebody threatened my uncle?","alibi":"I had been dancing since half past eleven. My dance card was full!","before":"Before the ball, I had been cutting paper silhouettes in the library. It’s my hobby.","duration":"I had been dancing for an hour when the music stopped for supper.","motive":"I don’t need £200. My uncle gives me everything I ask for.","witness":"Every one of my partners signed my dance card. And the photographer took our picture.","detail":"My silhouette scissors? They are in my room. I had finished with them before dinner.","after":"After the fireworks, I danced again until supper.","victim":"My uncle had looked pale all evening, even before the letter.","unknown":"I’m sorry, I don’t understand. Ask me about the ball!"},"reed":{"hello":"Reed, detective. His Lordship asked me to help you.","alibi":"From 11:30, I had been serving drinks in the drawing room. The photographer took a picture of us at 11:55.","before":"At 11:30, on his Lordship’s orders, I had put the envelope with £200 in the stone urn.","duration":"I had been serving for over five hours by midnight.","motive":"Yes, I had needed money for my mother. But his Lordship had already given me leave and paid her doctor himself.","witness":"Lady Voss, Miss Clara and the photographer saw me.","detail":"When I put the envelope in the urn at 11:30, the conservatory was empty except for Miss Bramble.","after":"At 00:15, his Lordship and I went back to the urn. The envelope had gone.","victim":"His Lordship had shown me the letter at a quarter past eleven. His hands were shaking.","unknown":"I beg your pardon. Perhaps ask me about the envelope or the times?"},"voss":{"hello":"Lady Voss. Blackmail! At a ball! How thrilling — I mean, how dreadful.","alibi":"I had been dancing in the drawing room. I am in the photograph at 11:55.","before":"Before supper, I had been talking to Edmund about my trip to London.","duration":"I had been dancing for nearly an hour when the fireworks began.","motive":"I had owed a jeweller £200, I admit. But I had paid him in May. Ask him.","witness":"The photographer. And Clara — we watched the fireworks together.","detail":"At about ten to twelve, I saw a gentleman with spectacles hurry down the corridor towards the conservatory. I didn’t see his face.","after":"After the fireworks, Clara and I went to supper.","victim":"Poor Edmund. He had always had secrets. Who doesn’t?","unknown":"Darling, I don’t understand. Ask me what I had seen!"},"gardener":{"hello":"Ivy Bramble. Somebody used my conservatory for blackmail? Charming.","alibi":"I had been pruning in the conservatory until 11:45. Then Sam and I prepared the fireworks on the terrace.","before":"I had been working in the gardens since two o’clock.","duration":"I had been working in the conservatory for two hours when I left at 11:45.","motive":"I don’t want his money. I want a new greenhouse — and he had already promised me one.","witness":"Sam, the stable boy, was with me on the terrace from 11:45.","detail":"That white glove isn’t mine. I had been wearing leather gloves all day.","after":"After the fireworks, I tidied the terrace until one o’clock.","victim":"Lord Ashford had seemed worried. He walked past the urn twice before supper.","unknown":"Sorry, I don’t follow. Ask me about the garden or the times."},"potts":{"hello":"Mrs Potts. Ball night, detective. I have a hundred plates to wash.","alibi":"From 11:30 to a quarter past midnight, I had been serving supper in the dining room with two maids.","before":"At 10:20, Dr Finch came to my kitchen and asked for flour paste. For a bandage, he said.","duration":"I had been cooking since six o’clock this morning.","motive":"£200? I had been paid on Friday, thank you. I don’t need anybody’s money.","witness":"My two maids, Agnes and Betty.","detail":"When I went to the sink at twenty past twelve, it was wet, and somebody had left a bottle of carbolic lotion there.","after":"After supper, I started on the washing-up.","victim":"His Lordship had hardly eaten anything. He looked worried.","unknown":"Ask me a proper question, detective. I have plates to wash."}},"lies":["doctor|alibi","doctor|motive","doctor|detail","doctor|kitchen:1","doctor|billiard:0","doctor|billiard:1"],"evidence":{"doctor|kitchen:1":"Flour paste? I had not been to the kitchen. Mrs Potts is confused.","doctor|billiard:0":"I had stayed until midnight. The marker must be mistaken about the time.","doctor|billiard:1":"An old joke between friends. I had paid him back long ago.","doctor|hall:0":"Every doctor carries scissors. Those bits of paper are from… labels.","doctor|kitchen:2":"Carbolic lotion? Many people use it, detective.","doctor|library:0":"The Lancet? Of course I read it — I am a doctor. Anybody could read it.","doctor|study:0":"Yes, I had asked him for a loan. Is that a crime?","doctor|hall:2":"Many gentlemen wear spectacles, detective.","doctor|dining:0":"I had been… looking for my pipe. I missed the fireworks, that’s all.","doctor|garden:0":"A cotton glove? I have never seen it.","colonel|billiard:1":"That’s F   function room(id) { for (var i = 0; i < ROOMS.length; i++) if (ROOMS[i].id === id) return ROOMS[i]; return null; }
  function sus(id) { for (var i = 0; i < SUS.length; i++) if (SUS[i].id === id) return SUS[i]; return SUS[0]; }
  function caseData(n) { for (var i = 0; i < D.cases.length; i++) if (D.cases[i].id === n) return D.cases[i]; return D.cases[0]; }
  function obj(c, ref) { var p = ref.split(':'); var l = c.objects[p[0]]; return l ? l[+p[1]] : null; }
  function allRefs(c) { var r = []; ROOMS.forEach(function (rm) { for (var i = 0; i < 3; i++) r.push(rm.id + ':' + i); }); return r; }
  function portrait(id) { return 'assets/portraits/' + id + '.webp'; }

  /* ---------------------------------------------------------------- state */
  var SET = extend({ level: 'rookie', music: false, caseId: 1 }, load(SETTINGS_KEY, {}));
  function blankCase() {
    return { found: {}, wrong: {}, convo: {}, statements: [], grid: { rooms: {}, times: {} }, notes: '',
      lab: { mcq: {}, builder: {}, timeline: false }, good: 0, verdict: { attempts: 0, closed: false, last: null } };
  }
  var CS = {};
  function cs(n) {
    n = n || SET.caseId;
    if (!CS[n]) CS[n] = extend(blankCase(), load(CASE_KEY + n, {}));
    return CS[n];
  }
  function store() { save(SETTINGS_KEY, SET); each(CS, function (v, k) { save(CASE_KEY + k, v); }); }
  var V = { page: 'home', room: null, sel: null, suspect: null, tab: 'evidence', gtab: 'rooms', ltab: 'learn', tkey: 1,
    station: null, builder: {}, tl: null, modal: null, revealKey: false };

  function C() { return caseData(SET.caseId); }
  function foundCount(n) { return keys(cs(n).found).length; }
  function questioned(n) { var s = {}; cs(n).statements.forEach(function (x) { s[x.s] = 1; }); return keys(s).length; }
  function labDone(n) { var l = cs(n).lab; return keys(l.mcq).length + keys(l.builder).length + (l.timeline ? 1 : 0); }
  function roomFound(n, rid) { var f = cs(n).found, c = 0; for (var i = 0; i < 3; i++) if (f[rid + ':' + i]) c++; return c; }

  /* ---------------------------------------------------------------- language engine */
  var IRREG = { go: 'gone', see: 'seen', do: 'done', take: 'taken', write: 'written', speak: 'spoken', eat: 'eaten', drink: 'drunk',
    know: 'known', give: 'given', leave: 'left', hear: 'heard', find: 'found', lose: 'lost', steal: 'stolen', hide: 'hidden', wear: 'worn',
    meet: 'met', buy: 'bought', bring: 'brought', think: 'thought', tell: 'told', say: 'said', get: 'got', sit: 'sat', send: 'sent', make: 'made', break: 'broken', forget: 'forgotten' };
  var PASTS = { went: 'gone', saw: 'seen', did: 'done', took: 'taken', wrote: 'written', spoke: 'spoken', ate: 'eaten', drank: 'drunk',
    knew: 'known', gave: 'given', stole: 'stolen', hid: 'hidden', wore: 'worn', came: 'come', broke: 'broken', forgot: 'forgotten' };
  var REG = ['work', 'play', 'lock', 'open', 'clean', 'wash', 'use', 'talk', 'walk', 'wait', 'finish', 'arrive', 'stay', 'visit', 'notice',
    'ask', 'cross', 'sign', 'borrow', 'return', 'prepare', 'serve', 'call', 'watch', 'help', 'touch', 'move', 'kill', 'poison', 'argue', 'enter', 'climb', 'carry', 'drop', 'look', 'listen', 'cook', 'read'];
  var BASE_ING = ['work', 'wait', 'read', 'play', 'clean', 'prepare', 'walk', 'talk', 'watch', 'cook', 'study', 'do', 'sit', 'go', 'hear', 'look', 'serve',
    'write', 'drink', 'sleep', 'listen', 'carry', 'repot', 'label', 'fold', 'chat', 'dance', 'search', 'eat', 'stand', 'run', 'hide', 'steal', 'make', 'take', 'come', 'leave', 'see'];
  function ing(v) {
    var ex = { sit: 'sitting', run: 'running', repot: 'repotting', chat: 'chatting', dance: 'dancing', write: 'writing', prepare: 'preparing', serve: 'serving',
      hide: 'hiding', make: 'making', take: 'taking', come: 'coming', leave: 'leaving', see: 'seeing', label: 'labelling' };
    return ex[v] || (v + 'ing');
  }
  function pp(v) { if (IRREG[v]) return IRREG[v]; if (/e$/.test(v)) return v + 'd'; if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ied'; if (v === 'stop') return 'stopped'; return v + 'ed'; }

  function analyse(q) {
    var t = q.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    var low = t.toLowerCase().replace(/[’‘]/g, "'");
    var words = low.split(' ');
    var subj = '(you|he|she|they|i|we|it|anyone|anybody|somebody|someone|nobody|lord ashford|reed|clara|mrs potts|the [a-z]+)';
    var m;
    if (words.length < 3) return { ok: false, msg: 'Write a complete question (at least three words).' };
    if (/^(tell me|explain|describe|talk about)\b/.test(low)) return { ok: true, msg: 'Fine — but a detective asks real questions. Try: “What had you been doing…?” or “Had you seen…?”' };
    if (!/^(what|what's|where|when|why|how|who|whose|which|had|hadn't|did|didn't|was|were|could|would|do|does|is|are|can|have|has|and|so|but)\b/.test(low)) {
      return { ok: false, msg: 'Start with a question word (What, Where, Why, How long, Who…) or with “Had…?”' };
    }
    if (/^(where|what|when|why|how|who)\s+(you|he|she|they|it)\s+(were|was|had|did|went|saw|are|is)\b/.test(low)) {
      return { ok: false, msg: 'Word order: question word + auxiliary + subject. “Where were you…?” / “Where had you been…?”' };
    }
    m = low.match(/\bhad\b.*?\bbeen\s+([a-z]+)/);
    if (m && inArr(BASE_ING, m[1])) return { ok: false, msg: 'After “had been”, use the -ing form: had been ' + ing(m[1]) + ' (not “' + m[1] + '”).' };
    m = low.match(new RegExp('\\b(did|didn\'t)\\s+' + subj + '\\s+(went|saw|left|heard|took|wrote|spoke|came|ate|drank|knew|gave|found|stole|hid|worked|played|talked|arrived|walked|stayed|locked|opened|been)\\b'));
    if (m) return { ok: false, msg: 'After “did”, use the base form: “Did you go…?”, “Did you see…?” (not “did you ' + m[3] + '”).' };
    m = low.match(new RegExp('\\b(had|hadn\'t)\\s+' + subj + '\\s+(?:already\\s+|ever\\s+|just\\s+|not\\s+|really\\s+)?([a-z]+)'));
    if (m) {
      var v = m[3];
      if (PASTS[v]) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + PASTS[v] + ' (not “' + v + '”).' };
      if (IRREG[v]) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + IRREG[v] + ' (not “' + v + '”).' };
      if (inArr(REG, v)) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + pp(v) + ' (not “' + v + '”).' };
    }
    var tail = /\?$/.test(t) ? '' : ' Remember the question mark.';
    if (/\bhad\b[\s\S]*\bbeen\s+[a-z]+ing\b/.test(low)) return { ok: true, good: true, msg: 'Excellent — past perfect continuous: you asked about an activity in progress before that moment.' + tail };
    if (/\b(had|hadn't)\b/.test(low)) return { ok: true, good: true, msg: 'Well done — past perfect: you went further back in time.' + tail };
    if (/^(have|has)\b|\b(have|has) (you|he|she|they)\b/.test(low)) return { ok: true, msg: 'This happened that night: prefer the past perfect — “Had you…?” rather than “Have you…?”' + tail };
    return { ok: true, msg: 'Good question. Go further back in time with the past perfect: “What had you done before…?”' + tail };
  }

  var TOPIC_WORDS = [
    ['duration', ['how long', 'since when', 'for how many', 'how many hours', 'how many minutes', 'how much time']],
    ['witness', ['confirm', 'witness', 'prove', 'proof', 'who was with', 'with you', 'alone', 'anyone see you', 'anybody see you', 'someone see you', 'who saw you', 'saw you', 'seen you', 'alibi']],
    ['detail', ['conservatory', 'gone near', 'been near', 'go near', 'went near', 'upstairs', 'stairs', 'staircase', 'corridor', 'footstep', 'go up', 'gone up', 'went up', 'library', 'gone into', 'go into', 'went into', 'enter', 'entered', 'bag', 'key', 'duplicate', 'noticed', 'notice', 'hear', 'heard', 'seen anyone', 'see anyone', 'saw anyone', 'anybody', 'anyone', 'someone', 'somebody', 'see', 'saw', 'seen', 'seen anything', 'see anything', 'saw anything', 'strange', 'unusual', 'suspicious', 'window']],
    ['motive', ['why', 'motive', 'will', 'wages', 'money', 'pay', 'paid', 'angry', 'argue', 'argued', 'argument', 'quarrel', 'upset', 'hate', 'reason', 'steal', 'stole', 'stolen', 'kill', 'killed', 'murder', 'poison', 'inherit', 'dismiss', 'job', 'rich', 'need', 'want']],
    ['after', ['after', 'afterwards', 'then', 'later', 'found him', 'discover', 'discovered', '10:30', 'half past ten', 'ten thirty', 'at 10:00 the box', 'empty']],
    ['before', ['before', 'earlier', 'afternoon', 'dinner', 'what had you done', 'morning', 'that day', 'at six', 'at seven', 'at eight', '8:45', 'at five', 'arrive', 'arrived']],
    ['alibi', ['where', 'what were you doing', 'what had you been doing', 'doing at', 'at ten', 'at nine', 'at 9', 'at 10', 'that night', 'that evening', 'during', 'what time', 'when']],
    ['hello', ['hello', 'good evening', 'good morning', 'who are you', 'your name', 'introduce', 'what do you do', 'your job']]
  ];
  function has(low, w) {
    if (/^[a-z]+$/.test(w)) return new RegExp('(^|[^a-z\'])' + w + '([^a-z\']|$)').test(low);
    return low.indexOf(w) !== -1;
  }
  function detect(q, c, allowed) {
    var low = ' ' + q.toLowerCase().replace(/[’‘]/g, "'") + ' ';
    var refs = allRefs(c);
    for (var i = 0; i < refs.length; i++) {
      if (allowed && !allowed[refs[i]]) continue;
      var o = obj(c, refs[i]);
      for (var j = 0; j < o.w.length; j++) if (has(low, o.w[j].replace(/[’]/g, "'"))) return { ref: refs[i] };
    }
    for (var t = 0; t < TOPIC_WORDS.length; t++) {
      var list = TOPIC_WORDS[t][1];
      for (var k = 0; k < list.length; k++) if (has(low, list[k])) return { ref: TOPIC_WORDS[t][0] };
    }
    for (var v = 0; v < c.victimWords.length; v++) if (has(low, c.victimWords[v])) return { ref: 'victim' };
    return { ref: 'unknown' };
  }
  function evidenceReply(c, sid, ref) {
    var sp = c.evidence[sid + '|' + ref];
    if (sp) return sp;
    var o = obj(c, ref), n = lcFirst(o.n);
    var forms = ['I’m afraid I can’t tell you anything about ' + n + '.', 'I had never noticed ' + n + ' before. I can’t help you there.', 'You are showing me ' + n + '? It means nothing to me, detective.'];
    return forms[hash(sid + ref) % 3];
  }
  function isLie(c, sid, ref) { return inArr(c.lies, sid + '|' + ref); }

  /* answer one question: returns {grammar, reply, ref} and records it */
  function interrogate(n, sid, q, evRef, convo, record) {
    var c = caseData(n), st = cs(n), g = analyse(q), ref, reply;
    convo.push({ w: 'me', x: q });
    if (evRef) convo.push({ w: 'ev', x: 'Evidence shown: ' + obj(c, evRef).n });
    if (!evRef && /^(hello|hi|hey|good (evening|morning|afternoon))\b[\s!.,a-z]*$/i.test(q.replace(/^\s+|\s+$/g, '')) && q.split(/\s+/).length <= 4) {
      convo.push({ w: 'them', x: c.suspects[sid].hello, n: sus(sid).name });
      convo.push({ w: 'tip', x: 'Now ask a real question, for example: “Where had you been at ten?”' });
      return;
    }
    if (!g.ok) {
      convo.push({ w: 'them', x: 'I beg your pardon, detective? I don’t understand your question.', n: sus(sid).name });
      convo.push({ w: 'tip', x: g.msg });
      return;
    }
    if (evRef) { ref = evRef; reply = evidenceReply(c, sid, ref); }
    else {
      var allowed = record ? st.found : null;
      ref = detect(q, c, allowed).ref;
      reply = (ref.indexOf(':') > -1) ? evidenceReply(c, sid, ref) : c.suspects[sid][ref];
    }
    convo.push({ w: 'them', x: reply, n: sus(sid).name });
    if (SET.level !== 'expert' || !g.good) convo.push({ w: 'tip', x: g.msg, good: !!g.good });
    if (g.good) st.good++;
    if (record && ref !== 'unknown' && ref !== 'hello') {
      var dup = false;
      st.statements.forEach(function (s) { if (s.s === sid && s.r === ref) dup = true; });
      if (!dup) st.statements.push({ s: sid, r: ref, x: reply, q: q });
    }
  }

  /* ---------------------------------------------------------------- shell */
  function header() {
    var inCase = inArr(['board', 'room', 'suspects', 'talk', 'notebook', 'grid', 'lab', 'accuse', 'brief'], V.page);
    var nav = '';
    if (inCase) {
      var items = [['board', 'Mystery board'], ['suspects', 'Suspects'], ['notebook', 'Notebook'], ['grid', 'Deduction grid'], ['lab', 'Language lab'], ['accuse', 'Accuse']];
      nav = items.map(function (it) {
        var on = V.page === it[0] || (it[0] === 'board' && V.page === 'room') || (it[0] === 'suspects' && V.page === 'talk');
        return '<button data-go="' + it[0] + '" class="' + (on ? 'on' : '') + '">' + it[1] + '</button>';
      }).join('');
    } else if (V.page !== 'station') {
      nav = '<button data-go="cases" class="' + (V.page === 'cases' ? 'on' : '') + '">Case files</button>' +
        '<button data-go="teacher" class="' + (inArr(['teacher', 'qr', 'sheet', 'key'], V.page) ? 'on' : '') + '">Teacher’s desk</button>';

      (inCase ? 'CASE ' + C().code + ' · ' + esc(C().title.toUpperCase()) : 'THE MYSTERY BOARD GAME') + '</small></button>' +
      '<nav class="nav" aria-label="Main">' + nav + '</nav>' +
      '<button class="icon-btn" data-act="music" aria-pressed="' + (SET.music ? 'true' : 'false') + '" title="Music" aria-label="Music on or off">' + (SET.music ? '♫ On' : '♫ Off') + '</button></div></header>';
  }
  function footer() {
    if (V.page === 'station') return '<footer class="footer no-print">RAVENSMOOR · BY BROT2YOU</footer>';
    return '<footer class="footer no-print">RAVENSMOOR · LEARN ENGLISH THROUGH INVESTIGATION · BY BROT2YOU<br>' +
      '<button data-go="teacher">Teacher’s desk</button></footer>';
  }
  function shell(inner) {
    APP.innerHTML = header() + '<main class="wrap" id="main">' + inner + footer() + '</main>' + modalHtml();
  }
  function modalHtml() {
    if (!V.modal) return '';
    var m = V.modal;
    return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal-box"><h3 id="mt">' + esc(m.title) + '</h3><p>' + esc(m.text) + '</p>' +
      '<div class="row"><button class="btn btn-red" data-act="modal-ok">' + esc(m.ok) + '</button><button class="btn btn-line" data-act="modal-cancel" style="color:#ffe3a1">Cancel</button></div></div></div>';
  }
  function confirmBox(title, text, ok, fn) { V.modal = { title: title, text: text, ok: ok, fn: fn }; render(); }
  function head(eyebrow, title, sub, ribbon) {

  }

  /* ---------------------------------------------------------------- pages */
  function pHome() {
    var steps = [['01', 'Explore', 'Search eight rooms of the manor for 24 illustrated objects.'], ['02', 'Decode', 'Solve an English challenge to reveal each clue.'],
      ['03', 'Question', 'Interrogate seven witnesses in English. Show them your evidence.'], ['04', 'Accuse', 'Find the lie and justify your theory with evidence.']];
    shell('<section class="hero" style="background-image:url(assets/manor.webp)"><div class="hero-in"><span class="eyebrow">A Victorian mystery · an English adventure</span>' +
      '<h1 class="logo">RAVENSMOOR</h1><div class="logo-sub">THE MYSTERY BOARD GAME</div>' +

      '<div class="row"><button class="btn btn-gold" data-go="cases">Open the case files →</button><button class="btn btn-line" data-go="teacher">Teacher’s desk</button></div></div></section>' +

  }

        '<div class="case-body"><span class="eyebrow">File ' + c.code + ' · ' + esc(c.date) + '</span><h2>' + esc(c.title) + '</h2><p>' + esc(c.tagline) + '</p>' +
        '<div class="progress" aria-label="Clues found"><i style="width:' + Math.round(n / 24 * 100) + '%"></i></div><p class="small dim">' + n + '/24 clues · ' + questioned(c.id) + '/7 witnesses questioned</p>' +

  function pBrief() {

  function pBoard() {

      '<div class="grid2"><section><div class="map"><img src="assets/board.webp" alt="Floor plan of Ravensmoor manor">' + pins + '</div><div class="rooms">' + cards + '</div></section>' +
      '<aside class="stack"><div class="parch"><h3>Detective’s mission</h3><p>' + esc(c.question) + '</p><ul class="checklist">' +
      list.map(function (l) { return '<li class="' + (l[0] ? 'ok' : '') + '">' + l[1] + '</li>'; }).join('') + '</ul>' +
      '<div class="row" style="margin-top:12px"><button class="btn ' + (ready ? 'btn-red' : 'btn-line') + '" data-go="accuse" style="' + (ready ? '' : 'color:#4a3210;background:#efe0bd') + '">Make an accusation</button></div></div>' +

  }

  function pRoom() {
    var c = C(), n = SET.caseId, st = cs(n), r = room(V.room), list = c.objects[r.id];
