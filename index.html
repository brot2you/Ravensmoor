function board(){shell(`<div class="section-head"><div><span class="eyebrow">Case 001 · Murder at Ravensmoor</span><h1>The Mystery Board</h1><p class="dim">Choose a room. Explore the evidence. Then question the witnesses.</p></div><span class="ribbon">${S.clues.length}/7 ROOMS</span></div><div class="game-grid"><section class="panel"><div class="map-title"><span class="smallcaps">Ravensmoor Estate · Floor plan</span><span class="smallcaps">SELECT A ROOM ↓</span></div><div class="map-frame map-redesigned"><img src="assets/board-v7.webp" alt="Plan original du manoir avec sept salles, sans texte incrusté"><div class="map-hotspots">${ROOMS.map((r,i)=>`<button class="map-pin pin-${i}" data-action="room" data-id="${r.id}" aria-label="Explore ${esc(r.name)}"><span>${i+1}</span>${f(r.id)?" ✓":""}</button>`).join('')}</div></div><div class="rooms">${ROOMS.map(r=>`<button class="room ${f(r.id)?'found':''}" data-action="room" data-id="${r.id}"><span class="icon">${r.icon}</span><strong>${esc(r.name)}</strong>${f(r.id)?'<span class="findtag">✓ Evidence found</span>':''}</button>`).join('')}</div></section><aside class="right-stack"><div class="parchment"><span class="smallcaps" style="color:#8b6034">Detective's mission</span><h3 style="margin-top:12px">A question changes everything.</h3><p>Lord Ashford was found dead. Everyone claims to know where they were. But which statements can you trust?</p><ol class="mission-list"><li class="${S.clues.length>=3?'done':''}">Investigate at least three rooms.</li><li class="${new Set(S.questions.map(q=>q.suspect)).size>=2?'done':''}">Question at least two suspects.</li><li class="${S.grammar.length>=1?'done':''}">Complete a language challenge.</li><li class="${S.solved?'done':''}">Present your final theory.</li></ol></div>${statPanel()}<div class="panel panel-pad"><span class="eyebrow">Need a language clue?</span><h3 style="color:#f6d493;margin:12px 0">Detective's Language Lab</h3><p class="dim">Why <em>had left</em> and <em>had been waiting</em>? Explore meaning, not just grammar rules.</p><button class="outline-btn" data-action="go" data-id="lab">Open the lab →</button></div></aside></div>`)}
function suspects(){shell(`<div class="section-head"><div><span class="eyebrow">Witnesses and suspects</span><h1>The Suspect Gallery</h1><p class="dim">Choose a portrait to start questioning. Every witness has a story to tell.</p></div><span class="ribbon">7 PERSONS OF INTEREST</span></div><div class="suspect-grid">${SUSPECTS.map(s=>card(s)).join('')}</div><div class="panel panel-pad" style="margin-top:23px"><span class="eyebrow">Your detective level</span><h3 style="margin:11px 0;color:#ffe1aa">How much help would you like?</h3><div class="btnrow">${[['rookie','Rookie · A2 (sentence starters)'],['skilled','Skilled · A2+/B1 (hints)'],['master','Master · B1 (independent)']].map(([id,t])=>`<button class="${S.level===id?'gold-btn':'outline-btn'}" data-action="level" data-id="${id}">${t}</button>`).join('')}</div><p class="mini-note" style="margin-top:15px">All modes accept correctly formed past simple questions too, while encouraging past perfect questions when their meaning is appropriate. Questions are matched to a curated story, not to a generative chatbot.</p></div>`);applyArtwork()}
function portraitLarge(s){return `<div class="face" data-portrait="${s.legacy}"><img src="${PORTRAIT_IMAGES[s.id]}" alt="Portrait of ${esc(s.name)}"></div>`}
function interrogate(){const s=findSuspect(S.selected), conv=S.conversations[s.id]||[];shell(`<button class="backlink" data-action="go" data-id="suspects">← Back to suspect gallery</button><div class="section-head" style="margin-top:0"><div><span class="eyebrow">Interrogation room</span><h1>Question the witness</h1></div><span class="ribbon">${S.level.toUpperCase()} DETECTIVE</span></div><div class="two-col"><aside class="panel suspect-profile">${portraitLarge(s)}<div><h2>${esc(s.name)}</h2><p class="dim">${esc(s.role)}</p><p class="mini-note">Ask about an alibi, events <em>before</em> the incident, or an activity's duration.</p><button class="outline-btn" data-action="go" data-id="notebook">Review evidence</button></div></aside><section class="panel chat-panel"><div class="chat-header"><b>${esc(s.name)}</b><span class="dim" style="margin-left:10px;font-size:12px">Speak English to uncover the facts.</span></div><div id="chat-scroll" class="chat-messages">${conv.length?conv.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join(''):`<div class="bubble assistant">Good evening, detective. ${esc(s.name)} speaking. What would you like to know?</div><div class="bubble feedback">Try asking: What had you done before dinner? / How long had you been working?</div>`}</div><div class="chat-controls"><form id="question-form" class="input-row"><input id="question" required maxlength="220" autocomplete="off" spellcheck="true" aria-label="Write your question in English" placeholder="Ask ${esc(s.name)} a question in English…"><button class="gold-btn" type="submit">Ask ➤</button></form>${S.level==='rookie'?`<div class="hintchips">${TOPICS.map(t=>`<button type="button" data-action="prefill" data-id="${esc(t[1])}">${esc(t[1])}</button>`).join('')}</div>`:S.level==='skilled'?`<div class="hintchips"><button data-action="prefill" data-id="What had you done before dinner?">Before the incident?</button><button data-action="prefill" data-id="How long had you been working?">Duration?</button><button data-action="prefill" data-id="Who can confirm your alibi?">A witness?</button></div>`:''}<div class="mini-note" style="margin-top:9px">Questions can begin with What, Where, Why, How long, Had, Who… • Press Enter to ask • Grammar feedback appears in the conversation.</div></div></section></div><div class="panel panel-pad" style="margin-top:20px"><span class="eyebrow">Another suspect?</span><div class="suspect-grid" style="margin-top:13px">${SUSPECTS.map(x=>card(x,x.id===s.id)).join('')}</div></div>`);applyArtwork();const el=$('#chat-scroll');if(el)el.scrollTop=el.scrollHeight}
function questionType(q){const text=q.toLowerCase().replace(/[’]/g,"'");if(/how long|how many (hours|years)|since when|for how long/.test(text))return'duration';if(/why|motive|money|pay|wages|will|inheritance|angry|dispute/.test(text))return'motive';if(/who|confirm|witness|verify|saw you/.test(text))return'witness';if(/upstairs|corridor|study|rounds|secret|kitchen|saw|heard|footsteps/.test(text))return'detail';if(/before|earlier|already|previously|had you (done|seen|left|visited|spoken)|what had/.test(text))return'before';return'alibi'}
const BASE_VERBS=['work','wait','read','play','clean','prepare','walk','talk','watch','cook','study','do','sit','go','hear','look','serve'];
function analyseQuestion(q){const t=q.trim().replace(/\s+/g,' '),low=t.toLowerCase();if(t.split(' ').length<3)return{ok:false,hint:'Write a complete question: an auxiliary + subject + verb. Example: Had you left?'};
if(!/^(what|where|when|why|how|who|which|had|did|was|were|could|would|do|does|is|are|can)\b/i.test(t))return{ok:false,hint:'Start with a question word (What / Where / How long) or an auxiliary (Had / Did / Was).'};
if(/\bhad\b[\s\S]*\bbeen\s+([a-z]+)/i.test(t)){
 const word=low.match(/\bhad\b[\s\S]*\bbeen\s+([a-z]+)/)?.[1];
 if(word&&BASE_VERBS.includes(word))return{ok:false,hint:`After “had been”, use V-ing, not “${word}”. Try “had been ${word==='sit'?'sitting':word==='run'?'running':word==='do'?'doing':word==='go'?'going':word==='prepare'?'preparing':word+'ing'}”.`};
}
if(/\bdid\s+you\s+(went|saw|left|heard|worked|been)\b/.test(low))return{ok:false,hint:'After “did”, use the base form: Did you go…? / Did you see…?'};
if(/\bhad\s+(you|he|she|they)\s+(go|see|do|leave|speak|write|hear)\b/.test(low))return{ok:false,hint:'After “had”, use a past participle: gone / seen / done / left / spoken / written / heard.'};
if(/\bhad\s+(you|he|she|they)\b/.test(low)&&!/(been|done|left|seen|heard|gone|arrived|worked|finished|visited|spoken|written|noticed|stayed|cleaned|asked|met|taken|played|waited|read|known|had|spoken|served|found|locked|started|returned|told)/.test(low))return{ok:false,hint:'Past perfect = had + past participle. Past perfect continuous = had + been + V-ing.'};
return{ok:true,hint:(!t.endsWith('?')?'Nice question. Remember the question mark. ':'')+(low.includes('had been')?'You used the past perfect continuous to focus on duration or activity.':low.includes('had ')?'You used the past perfect simple to ask about an earlier action.':'Good question! Ask a follow-up with “had” or “had been” to practise the target language.')};}
function ask(q){const s=findSuspect(S.selected),analysis=analyseQuestion(q),msgs=S.conversations[s.id]||[];msgs.push({who:'user',text:q.trim()});if(!analysis.ok){msgs.push({who:'feedback',text:'Language tip: '+analysis.hint});S.conversations[s.id]=msgs;store();interrogate();return}
const topic=questionType(q);msgs.push({who:'assistant',text:s[topic]});msgs.push({who:'feedback',text:analysis.hint});S.conversations[s.id]=msgs;S.questions.push({suspect:s.name,question:q.trim(),answer:s[topic],topic});store();interrogate();toast(`Statement saved in your notebook: ${s.name}`)}
function room(id){
 const r=byId(ROOMS,id);if(!r)return;
 const objects=OBJECTS[id]||[];
 shell(`<button class="backlink" data-action="go" data-id="board">← Back to the mystery board</button>
 <div class="section-head"><div><span class="eyebrow">Scene examination · ${esc(r.name)}</span><h1>${esc(r.name)}</h1><p class="dim">Find an object → solve its English challenge → save the evidence → question a witness.</p></div><span class="ribbon">${(S.objectEvidence||[]).filter(k=>k.startsWith(id+':')).length}/3 OBJECTS SAVED</span></div>
 <div class="game-grid"><section class="panel panel-pad"><div class="room-hd-scene"><img src="assets/room-${r.id}-hd.webp" alt="Victorian ${esc(r.name)}" loading="eager"><div class="scene-callout">🔎 SELECT AN OBJECT BELOW</div></div>
 <div class="raven-object-grid">${objects.map((o,i)=>`<button class="raven-object-tile" type="button" data-action="scene-object" data-id="${id}" data-object="${i}" aria-label="Examine ${esc(o.name)}"><img src="${o.src||''}" alt="${esc(o.name)}" loading="lazy"><span>${esc(o.name)}</span><small>${(S.objectEvidence||[]).includes(id+':'+i)?'✓ Saved in notebook':'Examine evidence →'}</small></button>`).join('')}</div>
 <div id="raven-inspection" class="raven-inspection" aria-live="polite"><h2>Choose an object to investigate</h2><p>Each object reveals a clue and an English question. Correct answers unlock evidence for your notebook.</p></div>
 <div class="status"><strong>Room report · ${esc(r.time)}</strong><p>${esc(r.text)}</p></div>
 <div class="btnrow"><button class="outline-btn" data-action="go" data-id="notebook">📓 Detective's notebook</button><button class="outline-btn" data-action="go" data-id="suspects">Interrogate suspects →</button></div></section>
 <aside class="right-stack">${statPanel()}<div class="parchment"><h3>How to investigate</h3><p>1. Examine an object.<br>2. Solve its language challenge.<br>3. Save it in your notebook.<br>4. Question a suspect about it.<br>5. Compare the answers.<br>6. Write your theory.</p></div></aside></div>`);
}
function notebook(){const tabs=[['evidence','Evidence'],['timeline','Timeline'],['questions','My questions'],['grammar','Grammar notes'],['theory','My theory']];let inner='';if(S.tab==='evidence')inner=`<div class="evidence-list">${S.clues.length?ROOMS.filter(r=>f(r.id)).map(r=>`<article class="evidence-item"><span class="tag">${esc(r.name)} · ${esc(r.time)}</span><h3>${esc(r.clue)}</h3><p>${esc(r.text)}</p></article>`).join(''):'<p class="dim">No clues yet. Explore the mystery board to collect your first clue.</p>'}</div>`;
if(S.tab==='timeline')inner=`<p class="dim">Your working timeline. The activities in the Language Lab help you decide what happened first.</p><div class="timeline">${[['6:00 PM','Colonel Hartley had argued with Lord Ashford.'],['8:30 PM','The card game began.'],['9:30 PM','Joe Stubbs had finished in the greenhouse.'],['10:00 PM','Clara heard footsteps.'],['10:15 PM','An upstairs note was added to the duty book.']].map(x=>`<div class="time-item"><span class="time">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`;
if(S.tab==='questions')inner=S.questions.length?`<div class="evidence-list">${S.questions.slice().reverse().map(x=>`<div class="evidence-item"><span class="tag">${esc(x.suspect)}</span><h3>${esc(x.question)}</h3><p>${esc(x.answer)}</p></div>`).join('')}</div>`:'<p class="dim">Your interview questions and answers will appear here.</p>';
if(S.tab==='grammar')inner=`<div class="evidence-list"><div class="parchment"><h3>Past perfect simple</h3><p><b>had + past participle</b></p><p>“She <b>had locked</b> the door before I arrived.”</p><p>Action presented as complete before a past reference point.</p></div><div class="parchment"><h3>Past perfect continuous</h3><p><b>had + been + V-ing</b></p><p>“She <b>had been waiting</b> for an hour when I arrived.”</p><p>Focus on an activity and its duration up to a past point.</p></div></div><div class="status">Language challenges completed: ${S.grammar.length}/3. <button class="outline-btn" data-action="go" data-id="lab">Open Language Lab →</button></div>`;
if(S.tab==='theory')inner=`<p class="dim">Mark your suspicions. These are your personal hypotheses, not proof.</p><div class="suspicion">${SUSPECTS.map(s=>`<div class="select-card"><strong>${esc(s.name)}</strong><select data-status="${s.id}" aria-label="Suspect status for ${esc(s.name)}">${[['unknown','Not assessed'],['possible','Suspicious'],['cleared','Cleared']].map(([v,t])=>`<option value="${v}" ${(S.statuses[s.id]||'unknown')===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div><div class="form-row" style="margin-top:22px"><label for="theory">Write a hypothesis using evidence. Try: “I suspect… because… had…”</label><textarea id="theory" placeholder="I suspect... because...">${esc(S.theory)}</textarea></div><div class="btnrow"><button class="gold-btn" data-action="save-theory">Save my theory</button><button class="danger-btn" data-action="go" data-id="verdict">Make final accusation →</button></div>`;
shell(`<div class="section-head"><div><span class="eyebrow">Private detective's papers</span><h1>Detective's Notebook</h1><p class="dim">Keep notes. Compare statements. Draw your own conclusions.</p></div><span class="ribbon">${S.clues.length} PIECES OF EVIDENCE</span></div><div class="panel panel-pad"><div class="notebook-tabs">${tabs.map(([id,title])=>`<button class="${S.tab===id?'active':''}" data-action="notetab" data-id="${id}">${title}</button>`).join('')}</div>${inner}</div><div class="btnrow" style="margin-top:20px"><button class="outline-btn" data-action="go" data-id="board">← Back to board</button><button class="gold-btn" data-action="go" data-id="verdict">Final accusation →</button></div>`)}
const LESSONS=[
 {id:'contrast',label:'Discover the difference',q:'Compare: “She had left before the detective arrived.” / “She had been waiting for an hour.” What changes?',choices:['The first presents a completed action; the second highlights an activity and its duration.','The two forms always mean exactly the same.','The second sentence is in the future.'],answer:0,note:'Correct: past perfect simple presents a completed earlier action; continuous focuses on the activity or duration up to a past moment.'},
 {id:'choice',label:'Choose the best tense',q:'At 10 PM, Clara had already spent one hour reading. Which sentence best highlights how long she was reading?',choices:['Clara has read for one hour at ten.','Clara had been reading for an hour when she heard footsteps.','Clara had read tomorrow.'],answer:1,note:'Yes! “Had been reading” focuses on an activity continuing for an hour before she heard the footsteps.'},
 {id:'structure',label:'Build an investigation question',q:'Which question correctly asks about an activity and its duration before a past event?',choices:['How long had you been working before dinner?','How long had you been work before dinner?','How long you had working before dinner?'],answer:0,note:'Exactly. Question word + had + subject + been + V-ing.'}
];
function lab(){const section=S.labtab;let content='';if(section==='discover')content=LESSONS.map((l,i)=>`<article class="activity"><span class="eyebrow">CHALLENGE 0${i+1} · ${esc(l.label)}</span><h3 style="margin-top:12px">${esc(l.q)}</h3><div class="choice-list">${l.choices.map((v,j)=>`<button class="${S.grammar.includes(l.id)&&j===l.answer?'correct':''}" data-action="answer" data-id="${l.id}:${j}">${String.fromCharCode(65+j)}. ${esc(v)}</button>`).join('')}</div>${S.grammar.includes(l.id)?`<div class="status success">✓ ${esc(l.note)}</div>`:''}</article>`).join('');
else content=`<div class="activity"><span class="eyebrow">RECONSTRUCT THE EVENING</span><h3 style="margin-top:12px">Put the events in chronological order.</h3><p class="dim">Use the arrows to move each event. Then check the timeline.</p><div class="timeline" style="margin:20px 0">${S.timeline.map((id,i)=>{const v={t1:'At six, the Colonel argued with his brother.',t2:'At half past eight, the card game began.',t3:'At half past nine, Joe finished in the greenhouse.',t4:'At ten, Clara heard footsteps.'}[id];return `<div class="time-item" style="justify-content:space-between"><span>${esc(v)}</span><span class="btnrow"><button class="outline-btn" style="padding:4px 10px" data-action="move" data-id="${i}:up" aria-label="Move event earlier">↑</button><button class="outline-btn" style="padding:4px 10px" data-action="move" data-id="${i}:down" aria-label="Move event later">↓</button></span></div>`}).join('')}</div><button class="gold-btn" data-action="timeline-check">Check order →</button>${S.grammar.includes('timeline')?'<div class="status success">✓ Timeline reconstructed. Past perfect often helps express events that occurred before a past reference point.</div>':''}</div>`;
shell(`<div class="section-head"><div><span class="eyebrow">The language is your key</span><h1>Detective's Language Lab</h1><p class="dim">Observe, compare, think about meaning, and apply what you discover.</p></div><span class="ribbon">${S.grammar.length}/4 COMPLETED</span></div><div class="panel panel-pad"><div class="lab-tabs"><button data-action="labtab" data-id="discover" class="${section==='discover'?'active':''}">Discover & practise</button><button data-action="labtab" data-id="timeline" class="${section==='timeline'?'active':''}">The Timeline Room</button></div><div class="parchment" style="margin-bottom:20px"><h3>Two windows on the past</h3><div class="form-grid"><p><b>Past perfect simple</b><br>had + past participle<br><em>He had left before dinner.</em></p><p><b>Past perfect continuous</b><br>had been + V-ing<br><em>He had been waiting for an hour.</em></p></div><p style="font-size:13px;margin-bottom:0">En français : action présentée comme accomplie avant un repère passé / activité mise en valeur dans son déroulement ou sa durée. Les deux formes peuvent parfois être possibles avec une nuance de sens.</p></div>${content}</div>`)}
function verdict(){const interviewed=new Set(S.questions.map(q=>q.suspect)).size;const ready=S.clues.length>=3&&interviewed>=2&&S.grammar.length>=1; shell(`<div class="section-head"><div><span class="eyebrow">Case 001 · Final stage</span><h1>Make Your Accusation</h1><p class="dim">A good detective explains a theory with evidence, not just a name.</p></div><span class="ribbon">CASE REPORT</span></div><div class="game-grid"><section class="panel panel-pad"><form id="verdict-form"><div class="form-row"><label for="accused">Who is your main suspect?</label><select id="accused" required><option value="">Select one suspect…</option>${SUSPECTS.map(s=>`<option value="${s.id}" ${S.culprit===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="form-row"><label for="evidence-one">Choose two different clues that support your theory</label><select id="evidence-one" required><option value="">First piece of evidence</option>${ROOMS.filter(r=>f(r.id)).map(r=>`<option value="${r.id}">${esc(r.clue)} — ${esc(r.name)}</option>`).join('')}</select><select id="evidence-two" required><option value="">Second piece of evidence</option>${ROOMS.filter(r=>f(r.id)).map(r=>`<option value="${r.id}">${esc(r.clue)} — ${esc(r.name)}</option>`).join('')}</select></div><div class="form-row"><label for="reason">Explain your theory in English. Use past perfect simple or continuous.</label><textarea id="reason" placeholder="I suspect... because... Mrs Potts had... She had been...">${esc(S.theory)}</textarea></div>${!ready?`<div class="status warn">Before making your final accusation, collect at least 3 clues, question at least 2 different suspects, and complete 1 grammar challenge. Current: ${S.clues.length}/3 clues · ${interviewed}/2 suspects · ${S.grammar.length}/1 language challenge.</div>`:''}<button class="gold-btn" type="submit" ${ready?'':'disabled'}>Seal my final report ✦</button></form></section><aside class="right-stack"><div class="parchment"><h3>Before you accuse…</h3><p>Who had a motive? Whose testimony contradicts another source? Which actions had happened before the key moment?</p><p><strong>Detective's reminder:</strong> a suspicion is not proof.</p></div>${statPanel()}</aside></div>${S.solved?`<div class="panel panel-pad" style="margin-top:20px"><span class="ribbon">CASE REPORT REVIEWED</span><h2 style="color:#ffe3a8;margin:20px 0">The Ravensmoor case</h2><p>The key contradiction concerns <b>Mrs Potts</b>. She claimed that she had only checked rooms downstairs, but the duty book places her near the upstairs corridor at 10:15. Her unpaid wages also provide a possible motive. This is the intended solution to this <em>new classroom version</em> of the mystery.</p><p><b>Your accusation:</b> ${esc(S.culprit?findSuspect(S.culprit).name:'')}.</p><p>${S.culprit==='potts'?'You identified the intended suspect and can justify it using the evidence.':'Compare your theory with the upstairs duty-book note. What does it tell you about Mrs Potts’s statement?'}</p><div class="btnrow"><button class="outline-btn" data-action="go" data-id="notebook">Review your notebook</button><button class="outline-btn" data-action="go" data-id="teacher">Teacher materials</button></div></div>`:''}`)}

st?", "The gardener left the soil", "The reception ended"]], "drawing": [["The Old Photograph", "A family portrait shows Clara wearing a blue silk scarf with the same weave as the thread found inside the hollow book.", "Clara had worn the scarf before the photograph was taken.", "What happened first?", "Clara wore the scarf", "The photograph was taken"], ["The Jewellery Box", "The box was opened with its duplicate key; the lock is intact. Its velvet lining has a blue silk fibre.", "Someone had unlocked the box before the theft was discovered.", "What happened first?", "Someone unlocked the box", "The theft was discovered"], ["The Embroidered Handkerchief", "A handkerchief marked C.A. was found by the library shelf. Clara says she had lost it before dinner.", "Clara said she had lost it before dinner.", "What happened first in Clara’s claim?", "She lost the handkerchief", "Dinner began"]], "hall": [["The Forgotten Umbrella", "The hall attendant logged Colonel Hartley leaving his umbrella at 9:17 and remaining with him until 9:30.", "The attendant had been watching the hall for thirteen minutes.", "Which form shows duration?", "had been watching", "had watched"], ["The Torn Ticket", "A carriage ticket places Dr Finch’s driver at the east gate at 9:25; the doctor was inside with the nurse.", "The driver had reached the gate by 9:25.", "What happened first?", "The driver reached the gate", "The ticket was checked"], ["The Carved Walking Cane", "Lady Voss left her cane in the hall. The porter saw her enter the dining room at 9:22.", "Lady Voss had entered the dining room before 9:25.", "What happened first?", "Lady Voss entered the room", "9:25 arrived"]], "billiard": [["The Billiard Cue", "The scorekeeper saw Colonel Hartley playing billiards from 9:19 to 9:29.", "The Colonel had been playing for ten minutes.", "Which form indicates duration?", "had been playing", "had played"], ["The Playing Card", "A card score signed by Colonel Hartley and the marker at 9:26 supports his billiard-room alibi.", "They had signed the card before ten.", "What happened first?", "They signed the card", "Ten o’clock arrived"], ["The Cufflinks", "Mr Reed’s cufflink was found in the study, where he admits placing the box at 9:18. Its presence does not prove he took the jewel.", "Reed had placed the box before leaving at 9:20.", "What happened first?", "Reed placed the box", "Reed left the room"]]};
const SPECIAL={"clara|study:1": "I borrowed the duplicate key at 8:45 to check the clasp. I had returned it before nine, although I forgot to sign the register.", "reed|study:1": "The key register shows Clara borrowed the duplicate at 8:45. I never received it back from her.", "clara|drawing:2": "I had lost that handkerchief before dinner. I never entered the library after nine.", "voss|drawing:2": "I saw Clara walking towards the library at about 9:26. I remember her embroidered handkerchief.", "clara|library:0": "I had not touched that book. I was in the drawing room between 9:20 and 9:30.", "voss|library:0": "I had seen Clara coming out of the study around 9:25, heading towards the library.", "reed|study:2": "I left the box on the study table at 9:18. I had left the room by 9:20, and I came back at 9:30.", "potts|kitchen:1": "The cook and I had been preparing dessert from 9:18 until 9:28. She can confirm that.", "colonel|billiard:1": "I had been playing with the marker in the billiard room. We signed the score at 9:26.", "doctor|kitchen:2": "The nurse and I had been labelling bottles at 9:25. The liquid was only violet ink.", "clara|drawing:0": "That scarf belongs to me, but a photograph does not prove I stole anything.", "clara|drawing:1": "I never opened the jewellery box after my aunt showed it to us.", "reed|drawing:1": "The lock had not been forced. Someone with a key must have opened it.", "voss|dining:0": "I had been sitting at the dining table at 9:23. The waiter brought me a glass.", "clara|library:1": "I asked a jeweller about the sapphire, but I was only curious about its value."};
const SUS=[["reed", "Mr Reed"], ["clara", "Miss Clara Ashford"], ["voss", "Lady Voss"], ["potts", "Mrs Potts"], ["colonel", "Colonel Hartley"], ["doctor", "Dr Finch"], ["gardener", "Joe Stubbs"]];
const ROOMNAMES={library:'The Library',dining:'The Dining Room',study:'The Study',kitchen:'The Kitchen',garden:'The Conservatory',drawing:'The Drawing Room',hall:'The Great Hall',billiard:'The Billiard Room'};
const STORE='ravensmoor_sapphire_v16';
const blank=()=>({found:[],answers:{},records:[],grid:{rooms:{},times:{},evidence:{}},tab:'rooms',notes:'',suspect:'',reason:'',accused:false});
let C=blank(),view='intro',room='library',current='',suspect='clara',message='';
try{C={...blank(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(STORE,JSON.stringify(C));
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(r,i)=>r+':'+i;
const item=k=>{const [r,i]=k.split(':');return DATA[r]?.[Number(i)]};
const name=k=>item(k)?.[0]||k;
const btn=(label,action,cls='outline-btn')=>`<button class="${cls}" data-s16="${action}">${label}</button>`;
const bar=()=>`<div class="s16-tabs">${[['rooms','Explore rooms'],['notebook','Notebook'],['interview','Interrogate'],['board','Deduction grid'],['report','Final report']].map(([v,t])=>`<button class="${view===v?'gold-btn':'outline-btn'}" data-s16="page:${v}">${t}</button>`).join('')}${btn('← Case files','exit')}</div>`;
function show(){let content='';if(view==='intro')content=`<div class="s16-card"><span class="s16-tag">SATURDAY · 17 OCTOBER 1891</span><h2>The Missing Sapphire</h2><p>At 9:00, Lady Eleanor showed her guests the Midnight Sapphire. At 9:15, she closed its jewellery box. Mr Reed carried it to the study at 9:18. When the box was opened at 10:00, the jewel was gone. The lock was intact.</p><p><strong>Your mission:</strong> investigate the rooms, answer 24 English challenges, collect evidence, question witnesses and justify a theory. A motive alone is not proof.</p>${btn('Begin investigation →','page:rooms','gold-btn')}</div>`;
if(view==='rooms'){content=`<div class="s16-rooms">${Object.keys(DATA).map(r=>`<button class="${room===r?'gold-btn':'outline-btn'}" data-s16="room:${r}">${ROOMNAMES[r]} · ${DATA[r].filter((_,i)=>C.found.includes(key(r,i))).length}/3</button>`).join('')}</div><div class="s16-card"><h2>${ROOMNAMES[room]}</h2><div class="s16-items">${DATA[room].map((o,i)=>`<button class="s16-card s16-object" data-s16="object:${key(room,i)}"><img src="${OBJECTS[room][i].src}" alt="${e(o[0])}"><span class="s16-label">${e(o[0])} ${C.found.includes(key(room,i))?'✓':''}</span></button>`).join('')}</div></div>`;
if(current&&view==='rooms'){const o=item(current),done=C.found.includes(current);content+=`<div class="s16-card" id="s16-inspect"><span class="s16-tag">OBJECT INVESTIGATION</span><h3>${e(o[0])}</h3><p>${e(o[1])}</p><p><strong>English challenge:</strong> ${e(o[3])}</p>${done?`<p class="s16-good">✓ Evidence collected in your notebook.</p>`:`<button class="outline-btn s16-option" data-s16="answer:0">A · ${e(o[4])}</button><button class="outline-btn s16-option" data-s16="answer:1">B · ${e(o[5])}</button>`}<p class="s16-note">${e(message)}</p></div>`;}}
if(view==='notebook'){content=`<div class="s16-card"><h2>Evidence notebook · ${C.found.length}/24</h2><p>These are observations, not automatic proof of guilt.</p>${C.found.map(k=>`<div class="s16-card"><strong>${e(name(k))}</strong> · ${e(ROOMNAMES[k.split(':')[0]])}<p>${e(item(k)[1])}</p></div>`).join('')||'<p>No evidence yet.</p>'}</div><div class="s16-card"><h3>Recorded statements · ${C.records.length}</h3>${C.records.map(x=>`<p><b>${e(SUS.find(s=>s[0]===x.s)?.[1])}</b> (${e(name(x.k))}): “${e(x.text)}”</p>`).join('')||'<p>Present collected evidence to suspects.</p>'}</div>`;}
if(view==='interview'){content=`<div class="s16-card"><h2>Interrogate witnesses</h2><p>First collect an object. A suspect responds differently depending on the evidence presented. Test their claims against other witnesses.</p><label>Witness</label><select class="s16-field" id="s16-witness">${SUS.map(s=>`<option value="${s[0]}" ${suspect===s[0]?'selected':''}>${e(s[1])}</option>`).join('')}</select><label>Collected evidence</label><select class="s16-field" id="s16-proof">${C.found.map(k=>`<option value="${e(k)}">${e(name(k))}</option>`).join('')}</select><label>Write your question in English</label><input class="s16-field" id="s16-question" placeholder="What had you been doing at 9:25?">${btn('Ask about this evidence','ask','gold-btn')}<p class="s16-note">${e(message)}</p></div><div class="s16-card"><h3>Statements</h3>${C.records.map(x=>`<p><b>${e(SUS.find(s=>s[0]===x.s)?.[1])}</b> — ${e(name(x.k))}: “${e(x.text)}”</p>`).join('')||'<p>No questions asked yet.</p>'}</div>`;}
if(view==='board'){const tab=C.tab,cols=tab==='rooms'?Object.keys(DATA).map(x=>[x,ROOMNAMES[x]]):tab==='times'?[['9:15','9:15'],['9:20','9:20'],['9:25','9:25'],['9:30','9:30']]:C.found.map(k=>[k,name(k)]);content=`<div class="s16-card"><h2>Deduction grid</h2><p>Click each cell to mark ? unknown, ✓ supported or × excluded. Your choices are not checked or filled in automatically.</p><div class="s16-tabs">${[['rooms','Suspects × Rooms'],['times','Suspects × Times'],['evidence','Suspects × Evidence']].map(([k,v])=>`<button class="${tab===k?'gold-btn':'outline-btn'}" data-s16="tab:${k}">${v}</button>`).join('')}</div><div class="s16-board"><table><thead><tr><th>Suspect</th>${cols.map(c=>`<th>${e(c[1])}</th>`).join('')}</tr></thead><tbody>${SUS.map(s=>`<tr><td>${e(s[1])}</td>${cols.map(c=>{const k=s[0]+'|'+c[0],v=C.grid[tab]?.[k]||'?';return `<td><button class="outline-btn" data-v="${v==='✓'?'yes':v==='×'?'no':'unknown'}" data-s16="cell:${e(k)}">${v}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><label>Explain a contradiction in English</label><textarea class="s16-field" id="s16-notes" rows="4" placeholder="Clara said ... However, Lady Voss had seen ...">${e(C.notes)}</textarea>${btn('Save my reasoning','save','gold-btn')}</div>`;}
if(view==='report'){content=`<div class="s16-card"><h2>Final detective report</h2><p>Collect evidence, interview witnesses and write a reasoned accusation. The solution is never shown during exploration.</p><p>Progress: ${C.found.length}/24 clues · ${new Set(C.records.map(x=>x.s)).size} witnesses interviewed</p><label>Who took the sapphire?</label><select class="s16-field" id="s16-accused"><option value="">Choose a suspect…</option>${SUS.map(s=>`<option value="${s[0]}" ${C.suspect===s[0]?'selected':''}>${e(s[1])}</option>`).join('')}</select><label>Explain with at least two pieces of evidence and a contradiction</label><textarea class="s16-field" id="s16-reason" rows="5" placeholder="I suspect ... because ... The witness had said ... but ...">${e(C.reason)}</textarea>${btn('Submit my report','submit','gold-btn')}<p class="s16-note">${e(message)}</p>${C.accused?`<div class="s16-card"><h3>Case review</h3><p>The duplicate key was borrowed at 8:45 and not signed back. Reed left the study by 9:20. A witness saw Clara leave the study at about 9:25 and head towards the library. The hollow book contained a blue silk fibre, matching the scarf in the photograph. The handkerchief and contradictory statement strengthen the case. Clara had hidden the sapphire in the hollow book. Other suspects have independently supported alibis.</p><p><strong>Your report:</strong> ${e(C.reason)}</p></div>`:''}</div>`;}
shell(`<div class="s16-head"><div><span class="eyebrow">CASE FILE 02 · A RAVENSMOOR MYSTERY</span><h1>The Missing Sapphire</h1></div><span class="ribbon">${C.found.length}/24 EVIDENCE</span></div>${bar()}${content}`);const mb=document.getElementById('r15-music');if(mb){mb.textContent=musicOn?'♫ Music ON':'♫ Music OFF';mb.setAttribute('aria-pressed',String(musicOn));}}
const priorCases=cases;cases=function(){priorCases();const cards=document.querySelectorAll('.case-card');const card=cards[1];if(card){card.classList.remove('locked');const badge=card.querySelector('.badge');if(badge)badge.textContent='PLAY NOW';const b=card.querySelector('button');if(b){b.disabled=false;b.className='gold-btn';b.textContent='Start investigation →';b.dataset.action='sapphire';b.dataset.id='';}}const p=document.querySelector('.section-head p.dim');if(p)p.textContent='Two complete investigations are available. More cases are planned.';};
const priorRender=render;render=function(){if(S.page==='sapphire'){show()}else priorRender();};
window.addEventListener('click',ev=>{const b=ev.target.closest('[data-action="sapphire"], [data-s16]');if(!b)return;ev.preventDefault();ev.stopImmediatePropagation();if(b.dataset.action==='sapphire'){S.page='sapphire';view='intro';message='';show();return;}const action=b.dataset.s16;const [op,...rest]=action.split(':'),arg=rest.join(':');message='';if(op==='exit'){go('cases');return}if(op==='page'){view=arg;current='';show();return}if(op==='room'){room=arg;current='';show();return}if(op==='object'){current=arg;show();return}if(op==='answer'){if(arg==='0'){if(!C.found.includes(current))C.found.push(current);save();message='Correct! The evidence has been saved.';}else message='Try again: which action occurred first, or which form expresses duration?';show();return}if(op==='tab'){C.tab=arg;save();show();return}if(op==='cell'){const d=C.grid[C.tab],v=d[arg]||'?';d[arg]=v==='?'?'✓':v==='✓'?'×':'?';save();show();return}if(op==='save'){C.notes=document.getElementById('s16-notes')?.value||'';save();message='Reasoning saved.';show();return}if(op==='ask'){const s=document.getElementById('s16-witness')?.value,k=document.getElementById('s16-proof')?.value,q=document.getElementById('s16-question')?.value.trim()||'';if(!k){message='Collect evidence before interviewing.';show();return}if(q.split(/\s+/).length<5||!/[?]$/.test(q)){message='Write a complete English question ending in ?';show();return}suspect=s;const text=SPECIAL[s+'|'+k]||generic(s,k);if(!C.records.some(x=>x.s===s&&x.k===k))C.records.push({s,k,q,text});save();message='Statement recorded. Compare it with another witness.';show();return}if(op==='submit'){const accused=document.getElementById('s16-accused')?.value||'',reason=document.getElementById('s16-reason')?.value.trim()||'';if(C.found.length<6||new Set(C.records.map(x=>x.s)).size<2){message='Collect at least six clues and interview two different witnesses first.';show();return}if(!accused||reason.split(/\s+/).length<20){message='Choose a suspect and explain your reasoning in at least 20 English words.';show();return}C.suspect=accused;C.reason=reason;C.accused=true;save();message=accused==='clara'?'Your accusation matches the evidence. Read the case review.':'Compare your theory with the duplicate key, the witness at 9:25 and the hollow book.';show();return}},true);
function generic(s,k){const who=SUS.find(x=>x[0]===s)?.[1]||'The witness';const r=k.split(':')[0];const lines={reed:'I placed the jewellery box in the study at 9:18 and left at 9:20. I cannot identify who touched this object.',clara:'I was with the guests for most of the evening. I cannot explain why this object is important.',voss:'I was in the dining room at 9:23. I cannot confirm who handled this object.',potts:'I had been preparing dessert in the kitchen with the cook between 9:18 and 9:28.',colonel:'I had been playing billiards between 9:19 and 9:29. The marker saw me.',doctor:'I had been working with the nurse at 9:25. She can confirm it.',gardener:'I had been working outdoors with the groundskeeper at 9:24.'};return lines[s]||`${who} cannot confirm who handled the ${name(k).toLowerCase()}.`}
// Preserve the V15 manual music switch, but request autoplay immediately and retry on the first gesture.
const soundtrack=document.querySelector('audio[src*="ravensmoor-detective-theme"]');
if(soundtrack){let wanted=true;const sync=()=>{const b=document.getElementById('r15-music');if(b&&musicOn){b.textContent='♫ Music ON';b.setAttribute('aria-pressed','true')}};soundtrack.play().then(()=>{musicOn=true;sync()}).catch(()=>{});document.addEventListener('pointerdown',ev=>{if(!wanted||ev.target.closest('#r15-music'))return;if(!musicOn){soundtrack.play().then(()=>{musicOn=true;sync()}).catch(()=>{})}}, {capture:true});document.addEventListener('click',ev=>{if(ev.target.closest('#r15-music'))wanted=!musicOn;},false);}
})();
</script>
