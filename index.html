ewspaper like everybody else. I had circled nothing.","colonel|sleeper:0":"Yes, I had bought my ticket late. I like surprises.","colonel|corridor:2":"My brother’s handwriting… I had never seen this paper in my life.","colonel|corridor:1":"A tall gentleman with a cigar? The train is full of them.","colonel|corridor:0":"The cord? Probably some nervous lady.","doctor|observation:2":"My score sheet. The Colonel was away from 11:45 to 12:05 — twenty minutes for a cigar!","doctor|observation:0":"At 11:53 I saw papers flying over the snow behind us.","doctor|firstclass:1":"That smell… the Colonel’s Havana cigars. I had smelled them all evening.","potts|diner:1":"That’s right. I had heard every word from the next table.","potts|observation:2":"Yes, he left at a quarter to twelve. I had been counting my stitches.","clara|diner:0":"Our teacups. We hadn’t moved from table 5.","voss|luggage:1":"My hatbox. I had fetched my shawl at ten past eleven.","voss|engine:2":"The open window! I had felt the cold from the dining car.","reed|luggage:2":"The guard had locked us in at 11:30. Ask him.","reed|platform:0":"My label. His Lordship’s presents. I had bought them all myself.","reed|luggage:0":"The dog didn’t leave my side. Neither did I.","gardener|sleeper:2":"My mask. I had been sleeping until the train stopped.","gardener|sleeper:0":"Berth 7 — the Colonel’s. It was empty when I came out at 11:58.","potts|corridor:1":"A tall gentleman with a cigar? The Colonel smokes Havanas all day."},"whyNot":{"doctor":"Dr Finch had been playing cards in the observation car the whole time — Mrs Potts confirms it — and he gained nothing from the will.","potts":"Mrs Potts had been knitting in the observation car next to Dr Finch from 11:30. She is the one who heard the Colonel at supper.","clara":"Clara had been drinking tea with Lady Voss at table 5 from 11:30 to 12:15, and both wills gave her the same.","voss":"Lady Voss had been with Clara and the waiter in the dining car. She had visited the luggage van at 11:10, long before the theft.","reed":"Mr Reed had been locked in the luggage van with the guard from 11:30 to 12:30.","gardener":"Ivy Bramble had been asleep in her berth — the conductor checked at 11:40 — and she came out only after the stop."},"solution":["Colonel Hartley read in the evening newspaper that Mr Blackwood was taking a new will north. He circled the article and bought a berth at 9:45 PM: he had not planned to travel.","At supper, Mr Blackwood told him that the new will left him nothing (the waiter’s menu, Mrs Potts). The Colonel left before dessert.","At 11:45, he left the card game “to fetch his cigars” (Finch’s score sheet). At 11:50, the conductor saw a tall gentleman with a cigar going towards the first-class compartments.","At 11:52, he pulled the emergency cord right outside Mr Blackwood’s door. The lawyer ran out to see what was happening and dropped his spectacles. The Colonel slipped in, undid the straps of the briefcase and took the envelope, dropping his cigar-scented gloves under the seat.","He broke the seal in his berth (red wax crumbs in his toiletry case), tore up the will and threw it out of the open corridor window. A piece stayed caught in the frame: “…my brother Henry shall receive nothing…”. Dr Finch saw the papers flying over the snow.","His lies: “I had been playing cards… I never left”, “I had no idea what was in the will” and “I had not gone near the first-class corridor.”"],"compactPins":true}],"upcoming":[{"code":"006","title":"The Ravensmoor Secret","tagline":"The final mystery connects every clue.","cover":"assets/manor.webp"}],"lab":{"mcq":[{"q":"At 10 PM, Clara ___ for an hour.","o":["had been reading","had read","was read"],"a":0,"t":"Duration up to a past moment → had been + V-ing."},{"q":"When Reed arrived, Lord Ashford ___.","o":["had already died","has already died","had already die"],"a":0,"t":"Completed before another past action → had + past participle."},{"q":"Ivy was tired because she ___ all day."   function sus(id) { for (var i = 0; i < SUS.length; i++) if (SUS[i].id === id) return SUS[i]; return SUS[0]; }
  function caseData(n) { for (var i = 0; i < D.cases.length; i++) if (D.cases[i].id === n) return D.cases[i]; return D.cases[0]; }
  function obj(c, ref) { var p = ref.split(':'); var l = c.objects[p[0]]; return l ? l[+p[1]] : null; }
  function allRefs(c) { var r = []; roomsOf(c).forEach(function (rm) { for (var i = 0; i < 3; i++) r.push(rm.id + ':' + i); }); return r; }
  function portrait(id) { return 'assets/portraits/' + id + '.webp'; }

  /* ---------------------------------------------------------------- state */
  var SET = extend({ level: 'rookie', music: false, caseId: 1 }, load(SETTINGS_KEY, {}));
  function blankCase() {
    return { found: {}, wrong: {}, convo: {}, statements: [], grid: { rooms: {}, times: {} }, notes: '',
      lab: { mcq: {}, builder: {}, timeline: false }, good: 0, verdict: { attempts: 0, closed: false, last: null } };
  }
  var CS = {};
  function cs(n) {
    n = n || SET.caseId;
    if (!CS[n]) CS[n] = extend(blankCase(), load(CASE_KEY + n, {}));
    return CS[n];
  }
  function store() { save(SETTINGS_KEY, SET); each(CS, function (v, k) { save(CASE_KEY + k, v); }); }
  var V = { page: 'home', room: null, sel: null, suspect: null, tab: 'evidence', gtab: 'rooms', ltab: 'learn', tkey: 1,
    station: null, builder: {}, tl: null, modal: null, revealKey: false };

  function C() { return caseData(SET.caseId); }
  function foundCount(n) { return keys(cs(n).found).length; }
  function questioned(n) { var s = {}; cs(n).statements.forEach(function (x) { s[x.s] = 1; }); return keys(s).length; }
  function labDone(n) { var l = cs(n).lab; return keys(l.mcq).length + keys(l.builder).length + (l.timeline ? 1 : 0); }
  function roomFound(n, rid) { var f = cs(n).found, c = 0; for (var i = 0; i < 3; i++) if (f[rid + ':' + i]) c++; return c; }

  /* ---------------------------------------------------------------- language engine */
  var IRREG = { go: 'gone', see: 'seen', do: 'done', take: 'taken', write: 'written', speak: 'spoken', eat: 'eaten', drink: 'drunk',
    know: 'known', give: 'given', leave: 'left', hear: 'heard', find: 'found', lose: 'lost', steal: 'stolen', hide: 'hidden', wear: 'worn',
    meet: 'met', buy: 'bought', bring: 'brought', think: 'thought', tell: 'told', say: 'said', get: 'got', sit: 'sat', send: 'sent', make: 'made', break: 'broken', forget: 'forgotten' };
  var PASTS = { went: 'gone', saw: 'seen', did: 'done', took: 'taken', wrote: 'written', spoke: 'spoken', ate: 'eaten', drank: 'drunk',
    knew: 'known', gave: 'given', stole: 'stolen', hid: 'hidden', wore: 'worn', came: 'come', broke: 'broken', forgot: 'forgotten' };
  var REG = ['work', 'play', 'lock', 'open', 'clean', 'wash', 'use', 'talk', 'walk', 'wait', 'finish', 'arrive', 'stay', 'visit', 'notice',
    'ask', 'cross', 'sign', 'borrow', 'return', 'prepare', 'serve', 'call', 'watch', 'help', 'touch', 'move', 'kill', 'poison', 'argue', 'enter', 'climb', 'carry', 'drop', 'look', 'listen', 'cook', 'read'];
  var BASE_ING = ['work', 'wait', 'read', 'play', 'clean', 'prepare', 'walk', 'talk', 'watch', 'cook', 'study', 'do', 'sit', 'go', 'hear', 'look', 'serve',
    'write', 'drink', 'sleep', 'listen', 'carry', 'repot', 'label', 'fold', 'chat', 'dance', 'search', 'eat', 'stand', 'run', 'hide', 'steal', 'make', 'take', 'come', 'leave', 'see'];
  function ing(v) {
    var ex = { sit: 'sitting', run: 'running', repot: 'repotting', chat: 'chatting', dance: 'dancing', write: 'writing', prepare: 'preparing', serve: 'serving',
      hide: 'hiding', make: 'making', take: 'taking', come: 'coming', leave: 'leaving', see: 'seeing', label: 'labelling' };
    return ex[v] || (v + 'ing');
  }
  function pp(v) { if (IRREG[v]) return IRREG[v]; if (/e$/.test(v)) return v + 'd'; if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ied'; if (v === 'stop') return 'stopped'; return v + 'ed'; }

  function analyse(q) {
    var t = q.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    var low = t.toLowerCase().replace(/[’‘]/g, "'");
    var words = low.split(' ');
    var subj = '(you|he|she|they|i|we|it|anyone|anybody|somebody|someone|nobody|lord ashford|reed|clara|mrs potts|the [a-z]+)';
    var m;
    if (words.length < 3) return { ok: false, msg: 'Write a complete question (at least three words).' };
    if (/^(tell me|explain|describe|talk about)\b/.test(low)) return { ok: true, msg: 'Fine — but a detective asks real questions. Try: “What had you been doing…?” or “Had you seen…?”' };
    if (!/^(what|what's|where|when|why|how|who|whose|which|had|hadn't|did|didn't|was|were|could|would|do|does|is|are|can|have|has|and|so|but)\b/.test(low)) {
      return { ok: false, msg: 'Start with a question word (What, Where, Why, How long, Who…) or with “Had…?”' };
    }
    if (/^(where|what|when|why|how|who)\s+(you|he|she|they|it)\s+(were|was|had|did|went|saw|are|is)\b/.test(low)) {
      return { ok: false, msg: 'Word order: question word + auxiliary + subject. “Where were you…?” / “Where had you been…?”' };
    }
    m = low.match(/\bhad\b.*?\bbeen\s+([a-z]+)/);
    if (m && inArr(BASE_ING, m[1])) return { ok: false, msg: 'After “had been”, use the -ing form: had been ' + ing(m[1]) + ' (not “' + m[1] + '”).' };
    m = low.match(new RegExp('\\b(did|didn\'t)\\s+' + subj + '\\s+(went|saw|left|heard|took|wrote|spoke|came|ate|drank|knew|gave|found|stole|hid|worked|played|talked|arrived|walked|stayed|locked|opened|been)\\b'));
    if (m) return { ok: false, msg: 'After “did”, use the base form: “Did you go…?”, “Did you see…?” (not “did you ' + m[3] + '”).' };
    m = low.match(new RegExp('\\b(had|hadn\'t)\\s+' + subj + '\\s+(?:already\\s+|ever\\s+|just\\s+|not\\s+|really\\s+)?([a-z]+)'));
    if (m) {
      var v = m[3];
      if (PASTS[v]) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + PASTS[v] + ' (not “' + v + '”).' };
      if (IRREG[v]) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + IRREG[v] + ' (not “' + v + '”).' };
      if (inArr(REG, v)) return { ok: false, msg: 'After “had”, use the past participle: had ' + m[2] + ' ' + pp(v) + ' (not “' + v + '”).' };
    }
    var tail = /\?$/.test(t) ? '' : ' Remember the question mark.';
    if (/\bhad\b[\s\S]*\bbeen\s+[a-z]+ing\b/.test(low)) return { ok: true, good: true, msg: 'Excellent — past perfect continuous: you asked about an activity in progress before that moment.' + tail };
    if (/\b(had|hadn't)\b/.test(low)) return { ok: true, good: true, msg: 'Well done — past perfect: you went further back in time.' + tail };
    if (/^(have|has)\b|\b(have|has) (you|he|she|they)\b/.test(low)) return { ok: true, msg: 'This happened that night: prefer the past perfect — “Had you…?” rather than “Have you…?”' + tail };
    return { ok: true, msg: 'Good question. Go further back in time with the past perfect: “What had you done before…?”' + tail };
  }

  var TOPIC_WORDS = [
    ['duration', ['how long', 'since when', 'for how many', 'how many hours', 'how many minutes', 'how much time']],
    ['witness', ['confirm', 'witness', 'prove', 'proof', 'who was with', 'with you', 'alone', 'anyone see you', 'anybody see you', 'someone see you', 'who saw you', 'saw you', 'seen you', 'alibi']],
    ['detail', ['what had happened at', 'what happened at', 'who had left', 'who left', 'left the room', 'left the drawing room', 'secret', 'passage', 'hidden door', 'bookcase', 'headache', 'bedroom', 'conservatory', 'gone near', 'been near', 'go near', 'went near', 'upstairs', 'stairs', 'staircase', 'corridor', 'footstep', 'go up', 'gone up', 'went up', 'library', 'gone into', 'go into', 'went into', 'enter', 'entered', 'bag', 'key', 'duplicate', 'noticed', 'notice', 'hear', 'heard', 'seen anyone', 'see anyone', 'saw anyone', 'anybody', 'anyone', 'someone', 'somebody', 'see', 'saw', 'seen', 'seen anything', 'see anything', 'saw anything', 'strange', 'unusual', 'suspicious', 'window']],
    ['motive', ['why', 'motive', 'will', 'wages', 'money', 'pay', 'paid', 'angry', 'argue', 'argued', 'argument', 'quarrel', 'upset', 'hate', 'reason', 'steal', 'stole', 'stolen', 'kill', 'killed', 'murder', 'poison', 'inherit', 'dismiss', 'job', 'rich', 'need', 'want']],
    ['after', ['after', 'afterwards', 'then', 'later', 'found him', 'discover', 'discovered', '10:30', 'half past ten', 'ten thirty', 'at 10:00 the box', 'empty']],
    ['before', ['before', 'earlier', 'afternoon', 'dinner', 'what had you done', 'morning', 'that day', 'at six', 'at seven', 'at eight', '8:45', 'at five', 'arrive', 'arrived']],
    ['alibi', ['where', 'what were you doing', 'what had you been doing', 'doing at', 'at ten', 'at nine', 'at 9', 'at 10', 'at 2', 'at 3', 'at 4', 'at 11', 'at midnight', 'at that time', 'between', 'that night', 'that evening', 'during', 'what time', 'when']],
    ['hello', ['hello', 'good evening', 'good morning', 'who are you', 'your name', 'introduce', 'what do you do', 'your job']]
  ];
  function has(low, w) {
    if (/^[a-z]+$/.test(w)) return new RegExp('(^|[^a-z\'])' + w + '([^a-z\']|$)').test(low);
    return low.indexOf(w) !== -1;
  }
  function detect(q, c, allowed) {
    var low = ' ' + q.toLowerCase().replace(/[’‘]/g, "'") + ' ';
    var refs = allRefs(c);
    for (var i = 0; i < refs.length; i++) {
      if (allowed && !allowed[refs[i]]) continue;
      var o = obj(c, refs[i]);
      for (var j = 0; j < o.w.length; j++) if (has(low, o.w[j].replace(/[’]/g, "'"))) return { ref: refs[i] };
    }
    for (var t = 0; t < TOPIC_WORDS.length; t++) {
      var list = TOPIC_WORDS[t][1];
      for (var k = 0; k < list.length; k++) if (has(low, list[k])) return { ref: TOPIC_WORDS[t][0] };
    }
    for (var v = 0; v < c.victimWords.length; v++) if (has(low, c.victimWords[v])) return { ref: 'victim' };
    return { ref: 'unknown' };
  }
  function evidenceReply(c, sid, ref) {
    var sp = c.evidence[sid + '|' + ref];
    if (sp) return sp;
    var o = obj(c, ref), n = lcFirst(o.n);
    var forms = ['I’m afraid I can’t tell you anything about ' + n + '.', 'I had never noticed ' + n + ' before. I can’t help you there.', 'You are showing me ' + n + '? It means nothing to me, detective.'];
    return forms[hash(sid + ref) % 3];
  }
  function isLie(c, sid, ref) { return inArr(c.lies, sid + '|' + ref); }

  /* answer one question: returns {grammar, reply, ref} and records it */
  function interrogate(n, sid, q, evRef, convo, record) {
    var c = caseData(n), st = cs(n), g = analyse(q), ref, reply;
    convo.push({ w: 'me', x: q });
    if (evRef) convo.push({ w: 'ev', x: 'Evidence shown: ' + obj(c, evRef).n });
    if (!evRef && /^(hello|hi|hey|good (evening|morning|afternoon))\b[\s!.,a-z]*$/i.test(q.replace(/^\s+|\s+$/g, '')) && q.split(/\s+/).length <= 4) {
      convo.push({ w: 'them', x: c.suspects[sid].hello, n: sus(sid).name });
      convo.push({ w: 'tip', x: 'Now ask a real question, for example: “Where had you been at ten?”' });
      return;
    }
    if (!g.ok) {
      convo.push({ w: 'them', x: 'I beg your pardon, detective? I don’t understand your question.', n: sus(sid).name });
      convo.push({ w: 'tip', x: g.msg });
      return;
    }
    if (evRef) { ref = evRef; reply = evidenceReply(c, sid, ref); }
    else {
      var allowed = record ? st.found : null;
      ref = detect(q, c, allowed).ref;
      reply = (ref.indexOf(':') > -1) ? evidenceReply(c, sid, ref) : c.suspects[sid][ref];
    }
    convo.push({ w: 'them', x: reply, n: sus(sid).name });
    if (SET.level !== 'expert' || !g.good) convo.push({ w: 'tip', x: g.msg, good: !!g.good });
    if (g.good) st.good++;
    if (record && ref !== 'unknown' && ref !== 'hello') {
      var dup = false;
      st.statements.forEach(function (s) { if (s.s === sid && s.r === ref) dup = true; });
      if (!dup) st.statements.push({ s: sid, r: ref, x: reply, q: q });
    }
  }

  /* ---------------------------------------------------------------- shell */
  function header() {
    var inCase = inArr(['board', 'room', 'suspects', 'talk', 'notebook', 'grid', 'lab', 'accuse', 'brief'], V.page);
    var nav = '';

      '<div class="grid2"><section><div class="map"><img src="' + (c.board || 'assets/board.webp') + '" alt="' + esc(c.boardAlt || 'Floor plan of Ravensmoor manor') + '">' + pins + '</div><div class="rooms">' + cards + '</div></section>' +
      '<aside class="stack"><div class="parch"><h3>Detective’s mission</h3><p>' + esc(c.question) + '</p><ul class="checklist">' +
      list.map(function (l) { return '<li class="' + (l[0] ? 'ok' : '') + '">' + l[1] + '</li>'; }).join('') + '</ul>' +
      '<div class="row" style="margin-top:12px"><button class="btn ' + (ready ? 'btn-red' : 'btn-line') + '" data-go="accuse" style="' + (ready ? '' : 'color:#4a3210;background:#efe0bd') + '">Make an accusation</button></div></div>' +
      statPanel() + '<div class="row"><button class="btn btn-line" data-go="brief">Reread the briefing</button></div></aside></div>');
  }

  function pRoom() {
    var c = C(), n = SET.caseId, st = cs(n), r = room(V.room), list = c.objects[r.id];
    var tiles = list.map(function (o, i) {
      var ref = r.id + ':' + i;
      return '<button class="obj ' + (st.found[ref] ? 'found ' : '') + (V.sel === ref ? 'sel' : '') + '" data-act="pick" data-id="' + ref + '" aria-label="Examine: ' + esc(o.n) + '"><img src="' + o.img + '" alt="" loading="lazy"><span>' + esc(st.found[ref] ? o.n : imageName(r.id, i)) + '</span></button>';
    }).join('');
    var panel = '<div class="panel pad" id="inspect"><h3>Choose an object to examine</h3><p class="dim">Each object hides a clue. Solve its English challenge to reveal it.</p></div>';
    if (V.sel && V.sel.split(':')[0] === r.id) panel = inspectPanel(c, n, V.sel);
    var others = roomsOf(c).filter(function (x) { return x.id !== r.id; }).map(function (x) { return '<button class="btn btn-line" data-act="room" data-id="' + x.id + '">' + esc(x.name.replace('The ', '')) + ' · ' + roomFound(n, x.id) + '/3</button>'; }).join('');
    shell('<button class="back" data-go="board">← Back to the mystery board</button>' + head('Scene examination', esc(r.name), '', roomFound(n, r.id) + '/3 CLUES') +
      '<div class="grid2"><section><div class="scene"><img src="' + r.img + '" alt="' + esc(r.name) + '"><span class="scene-tag">🔎 3 objects to examine</span></div>' +
      '<div class="objects">' + tiles + '</div></section><aside class="stack">' + panel + '</aside></div>' +
      '<div class="panel pad" style="margin-top:18px"><span class="eyebrow">Go somewhere else</span><div class="row" style="margin-top:10px">' + others + '</div></div>');
  }
  function imageName(rid, i) { return room(rid).names[i]; }

  function inspectPanel(c, n, ref) {
    var st = cs(n), o = obj(c, ref), p = ref.split(':');
    var top = '<div class="inspect"><div class="inspect-img"><img src="' + o.img + '" alt=""></div><div>';
    if (st.found[ref]) {
      return '<div class="panel pad" id="inspect">' + top + '<span class="eyebrow">Clue revealed</span><h3>' + esc(o.n) + '</h3><div class="clue">' + esc(o.c) + '</div>' +
        '<p class="small dim" style="margin-top:10px">Saved in your notebook ✓</p><div class="row"><button class="btn btn-line" data-go="suspects">Question a witness</button><button class="btn btn-line" data-go="notebook">Notebook</button></div></div></div></div>';
    }
    var w = st.wrong[ref] || 0, ord = order(3, 'c' + n + ref);
    var hintAt = SET.level === 'rookie' ? 1 : (SET.level === 'skilled' ? 2 : 99);
    var opts = ord.map(function (i) { return '<button class="answer" data-act="answer" data-id="' + ref + '" data-i="' + i + '">' + esc(o.o[i]) + '</button>'; }).join('');
    return '<div class="panel pad" id="inspect">' + top + '<span class="eyebrow">English challenge</span><h3>' + esc(imageName(p[0], +p[1])) + '</h3><p><b>' + esc(o.q) + '</b></p>' + opts +
      '<div id="ans-msg" aria-live="polite">' + (w ? '<div class="status bad">Not quite. Read the three options again.</div>' : '') + (w >= hintAt ? '<div class="tip">💡 ' + esc(o.t) + '</div>' : '') + '</div></div></div></div>';
  }

  function pSuspects() {
    var n = SET.caseId, st = cs(n);
    var cards = SUS.map(function (s) {
      var k = 0; st.statements.forEach(function (x) { if (x.s === s.id) k++; });
      return '<button class="card" style="--c:' + s.color + '" data-act="talk" data-id="' + s.id + '"><img src="' + portrait(s.id) + '" alt="" loading="lazy"><b>' + esc(s.name) + '</b><small>' + esc(s.role) + '</small><span class="count">' + k + ' statement' + (k === 1 ? '' : 's') + '</span></button>';
    }).join('');
    shell(head('Witnesses and suspects', 'The Suspect Gallery', 'Choose someone to interrogate. Ask your questions in English, and show the evidence you have found.', '7 WITNESSES') + '<div class="gallery">' + cards + '</div>');
  }

  var CHIPS = ['Where had you been at ten?', 'What had you done before dinner?', 'How long had you been working?', 'Who can confirm your alibi?', 'Had you gone upstairs?', 'Why had you argued?', 'What had you heard?', 'What happened after that?'];
  function chips(level) {
    var list = level === 'rookie' ? CHIPS : (level === 'skilled' ? CHIPS.slice(0, 3) : []);
    if (!list.length) return '';
    return '<div class="chips">' + list.map(function (q) { return '<button type="button" data-act="chip" data-id="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div>';
  }
  function msgsHtml(convo, sid, c) {
    var hello = '<div class="b them"><em>' + esc(sus(sid).name) + '</em>' + esc(c.suspects[sid].hello) + '</div>';
    return hello + convo.map(function (m) {
      if (m.w === 'them') return '<div class="b them"><em>' + esc(m.n) + '</em>' + esc(m.x) + '</div>';
      if (m.w === 'tip') return '<div class="b tip ' + (m.good ? 'good' : '') + '">✎ ' + esc(m.x) + '</div>';
      if (m.w === 'ev') return '<div class="b ev">🔎 ' + esc(m.x) + '</div>';
      return '<div class="b me">' + esc(m.x) + '</div>';
    }).join('');
  }
  function evidenceSelect(c, refs, sel) {
    return '<select id="ev-pick" aria-label="Show a piece of evidence (optional)"><option value="">— No evidence shown —</option>' + refs.map(function (ref) {
      var rm = room(ref.split(':')[0]);
      return '<option value="' + ref + '" ' + (sel === ref ? 'selected' : '') + '>Show: ' + esc(obj(c, ref).n) + ' (' + esc(rm.name.replace('The ', '')) + ')</option>';
    }).join('') + '</select>';
  }
  function pTalk() {
    var c = C(), n = SET.caseId, st = cs(n), s = sus(V.suspect), convo = st.convo[s.id] || [];
    var refs = allRefs(c).filter(function (r) { return st.found[r]; });
    shell('<button class="back" data-go="suspects">← Back to the gallery</button>' + head('Interrogation room', esc(s.name), esc(s.role), SET.level.toUpperCase() + ' DETECTIVE') +
      '<div class="talk"><aside class="panel pad profile"><img src="' + portrait(s.id) + '" alt="Portrait of ' + esc(s.name) + '"><div><p class="small dim" style="margin-top:10px">Ask about an alibi, what had happened <em>before</em>, how long an activity had lasted, or show a piece of evidence.</p>' +
      '<div class="row"><button class="btn btn-line" data-go="notebook">My notebook</button></div></div></aside>' +
      '<section class="chat"><div class="msgs" id="msgs" aria-live="polite">' + msgsHtml(convo, s.id, c) + '</div><form class="composer" id="ask-form" autocomplete="off">' +
      (refs.length ? evidenceSelect(c, refs, '') : '<p class="small dim" style="margin:0 0 8px">Reveal clues in the rooms to be able to show evidence.</p>') +
      '<div class="line"><input id="ask" maxlength="220" spellcheck="true" aria-label="Your question in English" placeholder="Ask ' + esc(s.name) + ' a question in English…"><button class="btn btn-gold" type="submit">Ask</button></div>' + chips(SET.level) + '</form></section></div>' +
      '<div class="panel pad" style="margin-top:20px"><span class="eyebrow">Question someone else</span><div class="gallery" style="margin-top:12px;grid-template-columns:repeat(7,minmax(0,1fr))">' +
      SUS.map(function (x) { return '<button class="card ' + (x.id === s.id ? 'on' : '') + '" style="--c:' + x.color + ';padding:5px" data-act="talk" data-id="' + x.id + '"><img src="' + portrait(x.id) + '" alt="' + esc(x.name) + '" loading="lazy"></button>'; }).join('') + '</div></div>');
    scrollChat();
  }
  function scrollChat() { var m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }

  function pNotebook() {
    var c = C(), n = SET.caseId, st = cs(n), tabs = [['evidence', 'Evidence'], ['statements', 'Statements'], ['notes', 'My notes']], inner = '';
    if (V.tab === 'evidence') {
      var refs = allRefs(c).filter(function (r) { return st.found[r]; });
      inner = refs.length ? '<div class="ev-list">' + refs.map(function (r) {
        var o = obj(c, r);
        return '<div class="ev"><img src="' + o.img + '" alt=""><div><small>' + esc(room(r.split(':')[0]).name) + '</small><b>' + esc(o.n) + '</b>' + esc(o.c) + '</div></div>';
      }).join('') + '</div>' : '<p>No clue yet. Explore the rooms and solve the English challenges.</p>';
    } else if (V.tab === 'statements') {
      inner = st.statements.length ? SUS.map(function (s) {
        var list = st.statements.filter(function (x) { return x.s === s.id; });
        if (!list.length) return '';
        return '<h3>' + esc(s.name) + '</h3>' + list.map(function (x) {
          var about = x.r.indexOf(':') > -1 ? 'About the evidence: ' + obj(c, x.r).n : 'Your question: ' + x.q;
          return '<div class="st" style="--c:' + s.color + '"><small>' + esc(about) + '</small>“' + esc(x.x) + '”</div>';
        }).join('');
      }).join('') : '<p>No statement yet. Question the witnesses: every answer is recorded here.</p>';
    } else {
      inner = '<label class="lab" for="notes">My working theory (in English)</label><textarea class="note" id="notes" placeholder="I think… because… had… / had been…">' + esc(st.notes) + '</textarea><div class="row" style="margin-top:10px"><button class="btn btn-gold" data-act="save-notes">Save my notes</button></div>';
    }
    shell(head('Private papers', 'Detective’s Notebook', 'Compare the clues with what the witnesses say. A statement is a claim, not necessarily the truth.', foundCount(n) + ' CLUES · ' + st.statements.length + ' STATEMENTS') +
      '<div class="tabs">' + tabs.map(function (t) { return '<button data-act="tab" data-id="' + t[0] + '" class="' + (V.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div class="panel pad">' + inner + '</div>');
  }

  function pGrid() {
    var c = C(), st = cs(), type = V.gtab;
    var cols = type === 'rooms' ? roomsOf(c).map(function (r) { return [r.id, r.name.replace('The ', '')]; }) : c.slots.map(function (s, i) { return ['t' + i, s]; });
    var data = st.grid[type] || (st.grid[type] = {});
    var table = '<div class="dtable-wrap"><table class="dtable"><thead><tr><th>Suspect</th>' + cols.map(function (x) { return '<th>' + esc(x[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      SUS.map(function (s) {
        return '<tr><td>' + esc(s.name) + '</td>' + cols.map(function (x) {
          var k = s.id + '|' + x[0], v = data[k] || '';
          var lbl = v === 'y' ? '✓' : (v === 'n' ? '×' : '?');
          return '<td><button class="cell ' + v + '" data-act="cell" data-id="' + k + '" aria-label="' + esc(s.name + ' — ' + x[1]) + ': ' + (v === 'y' ? 'possible' : v === 'n' ? 'ruled out' : 'unknown') + '">' + lbl + '</button></td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    shell(head('Detective reasoning', 'The Deduction Grid', 'Nothing is filled in for you, and nothing is checked automatically. Tap a cell: ? → ✓ possible → × ruled out.', 'YOUR DEDUCTIONS') +
      '<div class="tabs"><button data-act="gtab" data-id="rooms" class="' + (type === 'rooms' ? 'on' : '') + '">Who was where?</button><button data-act="gtab" data-id="times" class="' + (type === 'times' ? 'on' : '') + '">Who was free when?</button></div>' +
      '<div class="panel pad">' + table + '<p class="small dim">Tip: a ✓ in “Who was free when?” means the person had <b>no confirmed alibi</b> at that time.</p></div>');
  }

  function pLab() {
    var c = C(), st = cs(), tabs = [['learn', 'Learn'], ['practise', 'Practise'], ['build', 'Build questions'], ['timeline', 'Reconstruct the evening']], inner = '';
    if (V.ltab === 'learn') {
      inner = '<div class="lesson"><div class="parch"><h3>Past perfect simple</h3><p class="formula">had + past participle</p><p>An action <b>completed before</b> another moment in the past.</p><p>“When Reed arrived, the watch <b>had stopped</b>.”<br>“She <b>had left</b> before dinner.”</p></div>' +
        '<div class="parch"><h3>Past perfect continuous</h3><p class="formula">had been + V-ing</p><p>An activity <b>in progress</b> up to a moment in the past, or <b>how long</b> it had lasted.</p><p>“At ten, Clara <b>had been reading</b> for an hour.”<br>“They <b>had been playing</b> since 8:30.”</p></div>' +
        '<div class="parch"><h3>Asking questions</h3><p>“<b>Had</b> you <b>seen</b> the key before nine?”<br>“What <b>had</b> you <b>been doing</b> at ten?”<br>“How long <b>had</b> you <b>been waiting</b>?”<br>“Who <b>had taken</b> the bottle?”</p></div>' +
        '<div class="parch"><h3>Irregular participles</h3><table class="ptable"><tr><th>base</th><th>past</th><th>participle</th></tr>' +
        D.lab.participles.map(function (p) { return '<tr><td>' + p[0] + '</td><td>' + p[1] + '</td><td>' + p[2] + '</td></tr>'; }).join('') + '</table></div></div>';
    } else if (V.ltab === 'practise') {
      inner = D.lab.mcq.map(function (q, i) {
        var done = st.lab.mcq[i], ord = order(3, 'lab' + i);
        return '<div class="parch q-block"><span class="eyebrow" style="color:#7f2c33">Challenge ' + (i + 1) + '</span><p><b>' + esc(q.q) + '</b></p>' +
          (done ? '<div class="status ok">✓ ' + esc(q.o[q.a]) + ' — ' + esc(q.t) + '</div>' : ord.map(function (k) { return '<button class="answer" data-act="mcq" data-id="' + i + '" data-i="' + k + '">' + esc(q.o[k]) + '</button>'; }).join('')) + '</div>';
      }).join('');
    } else if (V.ltab === 'build') {
      inner = D.lab.builder.map(function (words, i) {
        if (st.lab.builder[i]) return '<div class="parch q-block"><span class="eyebrow" style="color:#7f2c33">Question ' + (i + 1) + '</span><div class="status ok">✓ ' + esc(words.join(' ').replace(' ?', '?')) + '</div></div>';
        var cur = V.builder[i] || [], ord = order(words.length, 'b' + i);
        var bank = ord.filter(function (k) { return !inArr(cur, k); }).map(function (k) { return '<button class="word" data-act="w-add" data-id="' + i + '" data-i="' + k + '">' + esc(words[k]) + '</button>'; }).join('');
        var line = cur.map(function (k, pos) { return '<button class="word" data-act="w-del" data-id="' + i + '" data-i="' + pos + '">' + esc(words[k]) + '</button>'; }).join('');
        return '<div class="parch q-block"><span class="eyebrow" style="color:#7f2c33">Question ' + (i + 1) + '</span><p>Put the words in order to make a detective question.</p><div class="word-line">' + (line || '<span class="small" style="color:#7a6448">Tap the words below…</span>') + '</div>' +
          '<div class="word-bank" style="margin-top:8px">' + bank + '</div>' + (cur.length === words.length ? '<div class="row" style="margin-top:8px"><button class="btn btn-gold" data-act="w-check" data-id="' + i + '">Check</button><button class="btn btn-line" data-act="w-reset" data-id="' + i + '" style="color:#ffe3a1">Start again</button></div>' : '') + '</div>';
      }).join('');
    } else {
      var tl = c.timeline;
      if (!V.tl || V.tl.c !== c.id) V.tl = { c: c.id, o: order(tl.length, 'tl' + c.id) };
      if (st.lab.timeline) inner = '<div class="status ok">✓ Timeline reconstructed.</div>' + tl.map(function (e) { return '<div class="tl-item"><b>' + esc(e.t) + '</b><span>' + esc(e.e) + '</span></div>'; }).join('') +
        '<p class="small">Now write it with the past perfect: “Before Reed found him, the watch <b>had stopped</b>…”</p>';
      else inner = '<p>Put these events in chronological order. Use the clues in your notebook. (No times are given!)</p>' +
        V.tl.o.map(function (k, pos) { return '<div class="tl-item"><b>' + (pos + 1) + '</b><span>' + esc(tl[k].e) + '</span><button data-act="tl-up" data-i="' + pos + '" aria-label="Move up">↑</button><button data-act="tl-down" data-i="' + pos + '" aria-label="Move down">↓</button></div>'; }).join('') +
        '<div class="row"><button class="btn btn-gold" data-act="tl-check">Check my timeline</button></div><div id="tl-msg" aria-live="polite"></div>';
    }
    shell(head('The language is your key', 'Detective’s Language Lab', 'Understand the past perfect — then use it to break the alibis.', labDone(SET.caseId) + '/16 DONE') +
      '<div class="tabs">' + tabs.map(function (t) { return '<button data-act="ltab" data-id="' + t[0] + '" class="' + (V.ltab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div class="panel pad">' + inner + '</div>');
  }

  function pAccuse() {
    var c = C(), n = SET.caseId, st = cs(n), v = st.verdict;
    var ready = foundCount(n) >= 6 && questioned(n) >= 3;
    if (v.closed) return pClosed();
    var refs = allRefs(c).filter(function (r) { return st.found[r]; });
    var evOpts = '<option value="">Choose a clue…</option>' + refs.map(function (r) { return '<option value="' + r + '">' + esc(obj(c, r).n) + '</option>'; }).join('');
    var stOpts = '<option value="">Choose a statement…</option>' + st.statements.map(function (x, i) { return '<option value="' + i + '">' + esc(sus(x.s).name) + ': “' + esc(x.x.length > 90 ? x.x.slice(0, 88) + '…' : x.x) + '”</option>'; }).join('');
    var last = v.last && !v.closed ? '<div class="status bad"><b>Your accusation does not hold.</b> ' + esc(c.whyNot[v.last] || '') + ' Attempts left: ' + (3 - v.attempts) + '.</div>' : '';
    shell(head('Case ' + c.code + ' · Final stage', 'Make your accusation', 'A good detective explains a theory with evidence — not just a name.', 'FINAL REPORT') + last +
      '<div class="grid2"><section class="panel pad">' + (!ready ? '<div class="status warn">Before you accuse, reveal at least 6 clues and question at least 3 witnesses. Now: ' + foundCount(n) + '/6 clues · ' + questioned(n) + '/3 witnesses.</div>' : '') +
      '<form id="accuse-form"><label class="lab" for="acc-s">' + esc(c.question) + '</label><select class="field" id="acc-s"><option value="">Choose a suspect…</option>' + SUS.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
      '<label class="lab">Choose three clues that support your theory</label><select class="field" id="acc-e1">' + evOpts + '</select><select class="field" id="acc-e2" style="margin-top:8px">' + evOpts + '</select><select class="field" id="acc-e3" style="margin-top:8px">' + evOpts + '</select>' +
      '<label class="lab" for="acc-l">Which statement is a lie?</label><select class="field" id="acc-l">' + stOpts + '</select>' +
      '<label class="lab" for="acc-r">Explain your theory in English. Use the past perfect.</label><textarea class="note" id="acc-r" placeholder="I accuse… because… She had… She had been…">' + esc(st.notes) + '</textarea>' +
      '<div class="row" style="margin-top:14px"><button class="btn btn-red" type="submit" ' + (ready ? '' : 'disabled') + '>Seal my final report ✦</button></div><div id="acc-msg" aria-live="polite"></div></form></section>' +
      '<aside class="stack"><div class="parch"><h3>Before you accuse…</h3><p>Who had a motive? Who had a confirmed alibi? Which statement contradicts a clue?</p><p><b>Remember:</b> a motive is not a proof. You have three attempts.</p></div>' + statPanel() + '</aside></div>');
  }
  function pClosed() {
    var c = C(), st = cs(), v = st.verdict, sc = v.score || 0, max = 10;
    var stars = sc >= 9 ? 3 : (sc >= 6 ? 2 : 1);
    var rank = v.correct ? (sc >= 9 ? 'Master Detective' : sc >= 7 ? 'Inspector' : sc >= 5 ? 'Sergeant' : 'Constable') : 'Case closed by Scotland Yard';
    var starStr = ''; for (var i = 0; i < 3; i++) starStr += i < stars && v.correct ? '★' : '☆';
    shell(head('Case ' + c.code + ' · Case closed', esc(c.title), '', 'CASE REPORT') +
      '<div class="grid2"><section class="report"><span class="eyebrow" style="color:#7f2c33">Your rank</span><h2>' + rank + '</h2><div class="stars" aria-label="' + stars + ' stars">' + starStr + '</div>' +
      '<p><b>Score: ' + sc + '/' + max + '</b> — ' + (v.correct ? 'you found the culprit' : 'you did not find the culprit') + (v.keyHits !== undefined ? ', ' + v.keyHits + '/3 key clues' : '') + (v.lie ? ', you spotted the lie' : '') + (v.ppUsed ? ', past perfect used' : '') + '.</p>' +
      '<h3>What really happened</h3><ol>' + c.solution.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>' +
      (v.text ? '<h3>Your report</h3><p><em>' + esc(v.text) + '</em></p>' : '') + '</section>' +
      '<aside class="stack"><div class="panel pad"><h3>The other suspects</h3>' + keys(c.whyNot).map(function (k) { return '<p class="small">' + esc(c.whyNot[k]) + '</p>'; }).join('') + '</div>' +
      '<div class="row"><button class="btn btn-gold" data-go="cases">Back to the case files</button><button class="btn btn-line" data-act="reset-case">Replay this case</button></div></aside></div>');
  }

  /* --------------------------------------------- station (QR code: one suspect only) */
  function pStation() {
    var n = V.station.c, c = caseData(n), sid = V.station.s, s = sus(sid);
    var key = STATION_KEY + n + '-' + sid, convo = load(key, []);
    shell('<div class="station-head">' + head('Interrogation station · Case ' + c.code, esc(s.name), esc(s.role) + ' — ' + esc(c.title), 'SCAN · ASK · NOTE') + '</div>' +
      '<div class="talk"><aside class="panel pad profile"><img src="' + portrait(sid) + '" alt="Portrait of ' + esc(s.name) + '"><div><p class="small dim" style="margin-top:10px">Write your questions in English. If you have found a clue, choose it in the list to show it to ' + esc(s.name) + '. Note the answers on your worksheet.</p>' +
      '<div class="row"><button class="btn btn-line" data-act="station-clear">New detective (clear)</button></div></div></aside>' +
      '<section class="chat"><div class="msgs" id="msgs" aria-live="polite">' + msgsHtml(convo, sid, c) + '</div><form class="composer" id="station-form" autocomplete="off">' +
      evidenceSelect(c, allRefs(c), '') +
      '<div class="line"><input id="ask" maxlength="220" spellcheck="true" aria-label="Your question in English" placeholder="Ask ' + esc(s.name) + ' a question in English…"><button class="btn btn-gold" type="submit">Ask</button></div>' + chips('skilled') + '</form></section></div>' +
      '<p class="center small" style="margin-top:22px"><button class="back" data-act="station-exit">Exit the station (teacher)</button></p>');
    scrollChat();
  }

  /* --------------------------------------------- teacher (in French) */
  function pTeacher() {
    shell(head('Classroom companion', 'Teacher’s desk', 'Espace enseignant — tout fonctionne sans compte, sans serveur et sans IA en ligne.', 'POUR L’ENSEIGNANT') +
      '<div class="grid2"><section class="stack"><div class="parch"><h2>Principe</h2><p>' + FR_NUMS[D.cases.length] + ' enquêtes indépendantes dans l’univers de Ravensmoor (8 lieux par enquête — le manoir ou le train de nuit —, 24 objets illustrés, 7 témoins). Chaque objet cache un indice qui ne se révèle qu’après un défi de langue (past perfect simple / continu). Les élèves interrogent les témoins par écrit, en anglais : l’appli reconnaît le sujet de la question (alibi, avant, durée, mobile, témoin, détails, après, objets) et commente la forme de la question. Chaque enquête contient <b>un menteur</b> : il faut repérer la déclaration contredite par un indice.</p>' +
      '<p><b>Niveau visé :</b> 3e, A2+/B1. <b>Points de langue :</b> past perfect simple et continu, questions au passé, participes irréguliers.</p></div>' +
      '<div class="parch"><h2>Déroulé suggéré (3 à 4 séances)</h2><ol><li><b>Briefing & exploration</b> (binômes) : lecture du briefing, exploration de 3–4 pièces, relevé des indices sur la fiche.</li><li><b>Interrogatoires</b> : stations QR (un suspect par QR collé en classe) ou interrogatoires libres sur l’appli. Les élèves notent les réponses et les contradictions.</li><li><b>Language Lab</b> : simple vs continu, construction de questions, reconstitution de la chronologie.</li><li><b>Accusation</b> : choix du suspect, de 3 indices, de la déclaration mensongère, paragraphe argumenté → score et rang de détective. Prolongement : quiz récapitulatif, ou rapport oral « Ladies and gentlemen, the culprit is… ».</li></ol></div>' +
      '<div class="parch"><h2>Bon à savoir</h2><ul><li>La progression est enregistrée <b>sur chaque appareil</b> (navigateur), séparément pour chaque enquête.</li><li>Le niveau Rookie / Skilled / Expert règle l’aide (suggestions de questions, indices après erreur).</li><li>Mode station : un QR ouvre directement l’interrogatoire d’un seul suspect, avec la liste de tous les objets de l’enquête (l’élève montre l’indice qu’il a trouvé). Le bouton « New detective » efface la conversation pour l’élève suivant.</li><li>Les QR de l’enquête 01 restent compatibles avec les cartes déjà imprimées (adresses <code>?suspect=…</code>) ; enquêtes suivantes : <code>?case=2&amp;suspect=…</code>, <code>?case=3&amp;suspect=…</code>, <code>?case=4&amp;suspect=…</code>, <code>?case=5&amp;suspect=…</code>.</li></ul></div></section>' +
      '<aside class="stack">' + D.cases.map(function (cc) { var k = cc.id;
        var c = caseData(k);
        return '<div class="panel pad"><span class="eyebrow">Enquête ' + c.code + '</span><h3>' + esc(c.title) + '</h3><div class="row"><button class="btn btn-line" data-act="t-qr" data-id="' + k + '">Cartes QR</button><button class="btn btn-line" data-act="t-sheet" data-id="' + k + '">Fiche élève</button><button class="btn btn-red" data-act="t-key" data-id="' + k + '">Corrigé</button></div></div>';
      }).join('') +
      '<div class="panel pad"><h3>Réinitialiser cet appareil</h3><p class="small dim">Efface la progression de toutes les enquêtes sur ce navigateur (utile pour un appareil partagé).</p><button class="btn btn-line" data-act="reset-all">Tout effacer</button></div></aside></div>');
  }
  function pQR() {
    var c = caseData(V.tkey);
    shell('<div class="row no-print" style="margin-bottom:14px"><button class="back" data-go="teacher">← Teacher’s desk</button><button class="btn btn-gold" data-act="print">Imprimer les cartes</button></div>' +
      '<div class="no-print">' + head('Cartes QR · Enquête ' + c.code, esc(c.title), 'Une carte par suspect : chaque QR ouvre l’interrogatoire de ce seul suspect.', '') + '</div>' +
      '<div class="qr-grid">' + SUS.map(function (s) {
        return '<div class="qr-card"><img class="portrait" src="' + portrait(s.id) + '" alt=""><div><span class="eyebrow" style="color:#7f2c33">Ravensmoor · Case ' + c.code + '</span><h3>' + esc(s.name) + '</h3><p style="margin:0 0 6px;font-size:13px">' + esc(s.role) + '</p>' +
          '<img class="qr" src="assets/qr/c' + c.id + '-' + s.id + '.png" alt="QR code"><p style="margin:4px 0 0;font-size:11px">Scan &amp; ask your questions in English</p></div></div>';
      }).join('') + '</div>');
  }
  function pSheet() {
    var c = caseData(V.tkey), lines = function (k) { var h = '<div class="lines">'; for (var i = 0; i < k; i++) h += '<div></div>'; return h + '</div>'; };
    var times = c.timeline.map(function (e) { return '<tr><td style="width:90px"><b>' + esc(e.t) + '</b></td><td style="height:32px"></td></tr>'; }).join('');
    shell('<div class="row no-print" style="margin-bottom:14px"><button class="back" data-go="teacher">← Teacher’s desk</button><button class="btn btn-gold" data-act="print">Imprimer la fiche</button></div>' +
      '<article class="sheet"><p style="margin:0;font-size:11px;letter-spacing:.2em">RAVENSMOOR · DETECTIVE WORKSHEET · CASE ' + c.code + '</p><h1 style="font-size:26px;margin:4px 0">' + esc(c.title) + '</h1>' +
      '<p>Name: ______________________ Class: ________ Date: ____________</p><p><em>' + esc(c.question) + '</em> — Use the <b>past perfect simple</b> (had + participle) and the <b>past perfect continuous</b> (had been + V-ing).</p>' +
      '<h2>1 · Evidence log</h2><table><tr><th style="width:24%">Room</th><th style="width:26%">Object</th><th>What had happened? (past perfect)</th></tr>' + [1, 2, 3, 4, 5, 6].map(function () { return '<tr><td style="height:34px"></td><td></td><td></td></tr>'; }).join('') + '</table>' +
      '<h2>2 · Interrogations</h2><table><tr><th style="width:22%">Witness</th><th style="width:38%">My question</th><th>The answer</th></tr>' + [1, 2, 3, 4].map(function () { return '<tr><td style="height:40px"></td><td></td><td></td></tr>'; }).join('') + '</table>' +
      '<h2>3 · Reconstruct the evening</h2><p>What had happened at these times?</p><table>' + times + '</table>' +
      '<h2>4 · Spot the lie</h2><p>Who lied? What did he/she say? Which clue proves it is false?</p>' + lines(3) +
      '<h2>5 · My accusation</h2><p>I accuse… because… (three clues + one past perfect simple + one past perfect continuous)</p>' + lines(5) + '</article>');
  }
  function pKey() {
    var c = caseData(V.tkey);
    var keyEv = allRefs(c).filter(function (r) { return obj(c, r).k; }).map(function (r) { return '<li><b>' + esc(obj(c, r).n) + '</b> (' + esc(room(r.split(':')[0]).name) + ') — ' + esc(obj(c, r).c) + '</li>'; }).join('');
    var lies = c.lies.map(function (l) { var p = l.split('|'); var txt = p[1].indexOf(':') > -1 ? c.evidence[l] : c.suspects[p[0]][p[1]]; return '<li>“' + esc(txt) + '”' + (p[1].indexOf(':') > -1 ? ' <span class="small">(quand on lui montre : ' + esc(obj(c, p[1]).n) + ')</span>' : '') + '</li>'; }).join('');
    shell('<div class="row no-print" style="margin-bottom:14px"><button class="back" data-go="teacher">← Teacher’s desk</button><button class="btn btn-gold" data-act="print">Imprimer le corrigé</button></div>' +
      '<article class="key"><span class="eyebrow" style="color:#7f2c33">Corrigé enseignant · Enquête ' + c.code + '</span><h2>' + esc(c.title) + ' — coupable : ' + esc(sus(c.culprit).name) + '</h2>' +
      '<h3>Solution</h3><ol>' + c.solution.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>' +
      '<h3>Chronologie</h3><ul>' + c.timeline.map(function (e) { return '<li><b>' + esc(e.t) + '</b> — ' + esc(e.e) + '</li>'; }).join('') + '</ul>' +
      '<h3>Indices clés (1 point chacun, 3 maximum)</h3><ul>' + keyEv + '</ul>' +
      '<h3>Déclarations mensongères (2 points)</h3><ul>' + lies + '</ul>' +
      '<h3>Fausses pistes</h3><ul>' + keys(c.whyNot).map(function (k) { return '<li>' + esc(c.whyNot[k]) + '</li>'; }).join('') + '</ul>' +
      '<h3>Barème de l’accusation (/10)</h3><p>Bon coupable : 4 · indices clés : 1 par indice (3 max) · déclaration mensongère identifiée : 2 · past perfect utilisé dans l’explication : 1. Trois tentatives ; une mauvaise accusation affiche pourquoi le suspect est innocenté. Rangs : Master Detective (9–10), Inspector (7–8), Sergeant (5–6), Constable (&lt;5).</p></article>');
  }

  /* ---------------------------------------------------------------- render */
  var PAGES = { home: pHome, cases: pCases, brief: pBrief, board: pBoard, room: pRoom, suspects: pSuspects, talk: pTalk, notebook: pNotebook, grid: pGrid, lab: pLab, accuse: pAccuse,
    teacher: pTeacher, qr: pQR, sheet: pSheet, key: pKey, station: pStation };
  var TITLES = { home: 'Welcome', cases: 'Case files', brief: 'Briefing', board: 'Mystery board', room: 'Room', suspects: 'Suspects', talk: 'Interrogation', notebook: 'Notebook',
    grid: 'Deduction grid', lab: 'Language lab', accuse: 'Accusation', teacher: 'Teacher’s desk', qr: 'QR cards', sheet: 'Worksheet', key: 'Answer key', station: 'Interrogation station' };
  function render() {
    (PAGES[V.page] || pHome)();
    document.title = 'Ravensmoor · ' + (TITLES[V.page] || '');
  }
  function go(p) {
    if (V.page === 'notebook') saveNotes(true);
    V.page = p; V.modal = null; render();
    try { window.scrollTo(0, 0); } catch (e) { }
  }
  function saveNotes(silent) { var t = $('#notes'); if (t) { cs().notes = t.value; store(); if (!silent) toast('Notes saved.'); } }

  /* ---------------------------------------------------------------- music */
  var audio = null;
  function music(on) {
    if (!audio) { audio = new Audio('assets/theme.mp3'); audio.loop = true; audio.volume = 0.3; }
    if (on) { var p = audio.play(); if (p && p['catch']) p['catch'](function () { SET.music = false; store(); render(); }); } else audio.pause();
  }

  /* ---------------------------------------------------------------- events */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-go],[data-act]') : null;
    if (!el || el.disabled) return;
    var goTo = el.getAttribute('data-go');
    if (goTo) { e.preventDefault(); go(goTo); return; }
    var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), idx = +el.getAttribute('data-i');
    var st = cs(), c = C();
    switch (a) {
      case 'open-case': SET.caseId = +id; store(); go(foundCount(+id) ? 'board' : 'brief'); break;
      case 'level': SET.level = el.value; store(); render(); break;
      case 'room': V.room = id; V.sel = null; go('room'); break;
      case 'pick': V.sel = id; render(); var ip = $('#inspect'); if (ip && window.innerWidth < 980 && ip.scrollIntoView) ip.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'answer':
        var o = obj(c, id);
        if (idx === o.a) { st.found[id] = true; store(); render(); toast('Clue revealed and saved in your notebook!'); }
        else { st.wrong[id] = (st.wrong[id] || 0) + 1; store(); render(); var b = document.querySelector('[data-act="answer"][data-i="' + idx + '"]'); if (b) b.className += ' bad'; }
        break;
      case 'talk': V.suspect = id; go('talk'); break;
      case 'chip': var inp = $('#ask'); if (inp) { inp.value = id; inp.focus(); } break;
      case 'tab': saveNotes(true); V.tab = id; render(); break;
      case 'save-notes': saveNotes(false); break;
      case 'gtab': V.gtab = id; render(); break;
      case 'cell':
        var g = st.grid[V.gtab] || (st.grid[V.gtab] = {}), cur = g[id] || '';
        g[id] = cur === '' ? 'y' : (cur === 'y' ? 'n' : ''); store();
        el.className = 'cell ' + g[id]; el.textContent = g[id] === 'y' ? '✓' : (g[id] === 'n' ? '×' : '?');
        break;
      case 'ltab': V.ltab = id; render(); break;
      case 'mcq':
        var q = D.lab.mcq[+id];
        if (idx === q.a) { st.lab.mcq[id] = true; store(); render(); toast('Correct!'); } else { el.className += ' bad'; toast('Not quite — think about the meaning.'); }
        break;
      case 'w-add': (V.builder[id] = V.builder[id] || []).push(idx); render(); break;
      case 'w-del': V.builder[id].splice(idx, 1); render(); break;
      case 'w-reset': V.builder[id] = []; render(); break;
      case 'w-check':
        var words = D.lab.builder[+id], ans = V.builder[id].map(function (k) { return words[k]; }).join(' ');
        if (ans === words.join(' ')) { st.lab.builder[id] = true; store(); render(); toast('Perfect question!'); } else { toast('Not yet — check the word order: question word + had + subject…'); }
        break;
      case 'tl-up': case 'tl-down':
        var arr = V.tl.o, to = a === 'tl-up' ? idx - 1 : idx + 1;
        if (to >= 0 && to < arr.length) { var t = arr[idx]; arr[idx] = arr[to]; arr[to] = t; render(); }
        break;
      case 'tl-check':
        var okTl = true; V.tl.o.forEach(function (k, pos) { if (k !== pos) okTl = false; });
        if (okTl) { st.lab.timeline = true; store(); render(); toast('Timeline reconstructed!'); }
        else { var right = 0; V.tl.o.forEach(function (k, pos) { if (k === pos) right++; }); $('#tl-msg').innerHTML = '<div class="status warn">' + right + '/' + V.tl.o.length + ' events are in the right place. Check the times in your clues.</div>'; }
        break;
      case 'music': SET.music = !SET.music; store(); music(SET.music); el.setAttribute('aria-pressed', SET.music ? 'true' : 'false'); el.textContent = SET.music ? '♫ On' : '♫ Off'; break;
      case 'reset-case':
        confirmBox('Replay this case?', 'All your clues, statements and notes for this case will be deleted on this device.', 'Delete and replay', function () { CS[SET.caseId] = blankCase(); store(); go('brief'); });
        break;
      case 'reset-all':
        confirmBox('Tout effacer ?', 'La progression de toutes les enquêtes sera supprimée sur ce navigateur. Cette action est définitive.', 'Tout effacer', function () { D.cases.forEach(function (cc) { CS[cc.id] = blankCase(); }); store(); go('teacher'); toast('Progression effacée.'); });
        break;
      case 'modal-ok': var fn = V.modal && V.modal.fn; V.modal = null; if (fn) fn(); else render(); break;
      case 'modal-cancel': V.modal = null; render(); break;
      case 't-qr': V.tkey = +id; go('qr'); break;
      case 't-sheet': V.tkey = +id; go('sheet'); break;
      case 't-key': V.tkey = +id; confirmBox('Afficher le corrigé ?', 'Cette page révèle le coupable et la solution complète. À ne pas montrer aux élèves !', 'Afficher', function () { go('key'); }); break;
      case 'print': window.print(); break;
      case 'station-clear': save(STATION_KEY + V.station.c + '-' + V.station.s, []); render(); toast('Conversation cleared. Next detective!'); break;
      case 'station-exit':
        confirmBox('Exit the station?', 'This is for the teacher. Students should stay on this suspect.', 'Exit', function () {
          V.station = null; try { history.replaceState(null, '', location.pathname); } catch (er) { } go('home');
        });
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target, inp = $('#ask'), sel = $('#ev-pick');
    if (f.id === 'ask-form' || f.id === 'station-form') {
      e.preventDefault();
      var q = inp.value.replace(/^\s+|\s+$/g, '');
      if (!q) { inp.focus(); return; }
      var ev = sel ? sel.value : '';
      if (f.id === 'ask-form') {
        var st = cs(), convo = st.convo[V.suspect] || (st.convo[V.suspect] = []);
        interrogate(SET.caseId, V.suspect, q, ev, convo, true);
        store(); render();
      } else {
        var key = STATION_KEY + V.station.c + '-' + V.station.s, conv = load(key, []);
        interrogate(V.station.c, V.station.s, q, ev, conv, false);
        save(key, conv); render();
      }
      var ni = $('#ask'); if (ni && window.innerWidth > 700) ni.focus();
    }
    if (f.id === 'accuse-form') { e.preventDefault(); submitAccusation(); }
  });

  function submitAccusation() {
    var c = C(), st = cs(), v = st.verdict, msg = $('#acc-msg');
    var s = $('#acc-s').value, e1 = $('#acc-e1').value, e2 = $('#acc-e2').value, e3 = $('#acc-e3').value, li = $('#acc-l').value, text = $('#acc-r').value.replace(/^\s+|\s+$/g, '');
    var evs = [e1, e2, e3];
    if (!s || !e1 || !e2 || !e3 || li === '') { msg.innerHTML = '<div class="status warn">Choose a suspect, three clues and one statement.</div>'; return; }
    if (e1 === e2 || e1 === e3 || e2 === e3) { msg.innerHTML = '<div class="status warn">Choose three <b>different</b> clues.</div>'; return; }
    if (text.split(/\s+/).length < 15) { msg.innerHTML = '<div class="status warn">Your explanation is too short: write at least 15 words.</div>'; return; }
    st.notes = text;
    var stt = st.statements[+li];
    var keyHits = evs.filter(function (r) { return obj(c, r).k; }).length;
    var lie = stt && isLie(c, stt.s, stt.r);
    var ppUsed = /\bhad\s+been\s+[a-z]+ing\b|\bhad\s+(not\s+)?[a-z]+(ed|en|t|wn|ne|ung|ought|ept|ade|ost|old|ound|eard)\b/i.test(text);
    v.attempts++;
    if (s !== c.culprit && v.attempts < 3) { v.last = s; store(); render(); try { window.scrollTo(0, 0); } catch (er) { } return; }
    var correct = s === c.culprit;
    v.closed = true; v.correct = correct; v.keyHits = keyHits; v.lie = !!lie; v.ppUsed = ppUsed; v.text = text; v.accused = s;
    v.score = correct ? 4 + keyHits + (lie ? 2 : 0) + (ppUsed ? 1 : 0) : 0;
    store(); render(); try { window.scrollTo(0, 0); } catch (er2) { }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && V.modal) { V.modal = null; render(); }
  });

  /* ---------------------------------------------------------------- start */
  (function boot() {
    var params = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (p) { if (!p) return; var kv = p.split('='); params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); });
    var sid = params.suspect, cn = parseInt(params['case'], 10) || 1;
    var okCase = false; D.cases.forEach(function (cc) { if (cc.id === cn) okCase = true; }); if (!okCase) cn = 1;
    var valid = false; SUS.forEach(function (s) { if (s.id === sid) valid = true; });
    if (valid) { V.station = { c: cn, s: sid }; V.page = 'station'; }
    render();
    if (SET.music) { SET.music = false; store(); render(); } /* browsers block autoplay: music starts only on tap */
  })();
})();

</script>
</body>
</html>
