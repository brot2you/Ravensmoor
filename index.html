function board(){shell(`<div class="section-head"><div><span class="eyebrow">Case 001 · Murder at Ravensmoor</span><h1>The Mystery Board</h1><p class="dim">Choose a room. Explore the evidence. Then question the witnesses.</p></div><span class="ribbon">${S.clues.length}/8 CLUES</span></div><div class="game-grid"><section class="panel"><div class="map-title"><span class="smallcaps">Ravensmoor Estate · Floor plan</span><span class="smallcaps">SELECT A ROOM ↓</span></div><div class="map-frame map-redesigned"><img src="assets/board-v7.webp" alt="Plan original du manoir avec sept salles, sans texte incrusté"><div class="map-hotspots">${ROOMS.map((r,i)=>`<button class="map-pin pin-${i}" data-action="room" data-id="${r.id}" aria-label="Explore ${esc(r.name)}"><span>${i+1}</span>${f(r.id)?" ✓":""}</button>`).join('')}</div></div><div class="rooms">${ROOMS.map(r=>`<button class="room ${f(r.id)?'found':''}" data-action="room" data-id="${r.id}"><span class="icon">${r.icon}</span><strong>${esc(r.name)}</strong>${f(r.id)?'<span class="findtag">✓ Evidence found</span>':''}</button>`).join('')}</div></section><aside class="right-stack"><div class="parchment"><span class="smallcaps" style="color:#8b6034">Detective's mission</span><h3 style="margin-top:12px">A question changes everything.</h3><p>Lord Ashford was found dead. Everyone claims to know where they were. But which statements can you trust?</p><ol class="mission-list"><li class="${S.clues.length>=3?'done':''}">Investigate at least three rooms.</li><li class="${new Set(S.questions.map(q=>q.suspect)).size>=2?'done':''}">Question at least two suspects.</li><li class="${S.grammar.length>=1?'done':''}">Complete a language challenge.</li><li class="${S.solved?'done':''}">Present your final theory.</li></ol></div>${statPanel()}<div class="panel panel-pad"><span class="eyebrow">Need a language clue?</span><h3 style="color:#f6d493;margin:12px 0">Detective's Language Lab</h3><p class="dim">Why <em>had left</em> and <em>had been waiting</em>? Explore meaning, not just grammar rules.</p><button class="outline-btn" data-action="go" data-id="lab">Open the lab →</button></div></aside></div>`)}
function suspects(){shell(`<div class="section-head"><div><span class="eyebrow">Witnesses and suspects</span><h1>The Suspect Gallery</h1><p class="dim">Choose a portrait to start questioning. Every witness has a story to tell.</p></div><span class="ribbon">7 PERSONS OF INTEREST</span></div><div class="suspect-grid">${SUSPECTS.map(s=>card(s)).join('')}</div><div class="panel panel-pad" style="margin-top:23px"><span class="eyebrow">Your detective level</span><h3 style="margin:11px 0;color:#ffe1aa">How much help would you like?</h3><div class="btnrow">${[['rookie','Rookie · A2 (sentence starters)'],['skilled','Skilled · A2+/B1 (hints)'],['master','Master · B1 (independent)']].map(([id,t])=>`<button class="${S.level===id?'gold-btn':'outline-btn'}" data-action="level" data-id="${id}">${t}</button>`).join('')}</div><p class="mini-note" style="margin-top:15px">All modes accept correctly formed past simple questions too, while encouraging past perfect questions when their meaning is appropriate. Questions are matched to a curated story, not to a generative chatbot.</p></div>`);applyArtwork()}
function portraitLarge(s){return `<div class="face" data-portrait="${s.legacy}"><img src="${PORTRAIT_IMAGES[s.id]}" alt="Portrait of ${esc(s.name)}"></div>`}
function interrogate(){const s=findSuspect(S.selected), conv=S.conversations[s.id]||[];shell(`<button class="backlink" data-action="go" data-id="suspects">← Back to suspect gallery</button><div class="section-head" style="margin-top:0"><div><span class="eyebrow">Interrogation room</span><h1>Question the witness</h1></div><span class="ribbon">${S.level.toUpperCase()} DETECTIVE</span></div><div class="two-col"><aside class="panel suspect-profile">${portraitLarge(s)}<div><h2>${esc(s.name)}</h2><p class="dim">${esc(s.role)}</p><p class="mini-note">Ask about an alibi, events <em>before</em> the incident, or an activity's duration.</p><button class="outline-btn" data-action="go" data-id="notebook">Review evidence</button></div></aside><section class="panel chat-panel"><div class="chat-header"><b>${esc(s.name)}</b><span class="dim" style="margin-left:10px;font-size:12px">Speak English to uncover the facts.</span></div><div id="chat-scroll" class="chat-messages">${conv.length?conv.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join(''):`<div class="bubble assistant">Good evening, detective. ${esc(s.name)} speaking. What would you like to know?</div><div class="bubble feedback">Try asking: What had you done before dinner? / How long had you been working?</div>`}</div><div class="chat-controls"><form id="question-form" class="input-row"><input id="question" required maxlength="220" autocomplete="off" spellcheck="true" aria-label="Write your question in English" placeholder="Ask ${esc(s.name)} a question in English…"><button class="gold-btn" type="submit">Ask ➤</button></form>${S.level==='rookie'?`<div class="hintchips">${TOPICS.map(t=>`<button type="button" data-action="prefill" data-id="${esc(t[1])}">${esc(t[1])}</button>`).join('')}</div>`:S.level==='skilled'?`<div class="hintchips"><button data-action="prefill" data-id="What had you done before dinner?">Before the incident?</button><button data-action="prefill" data-id="How long had you been working?">Duration?</button><button data-action="prefill" data-id="Who can confirm your alibi?">A witness?</button></div>`:''}<div class="mini-note" style="margin-top:9px">Questions can begin with What, Where, Why, How long, Had, Who… • Press Enter to ask • Grammar feedback appears in the conversation.</div></div></section></div><div class="panel panel-pad" style="margin-top:20px"><span class="eyebrow">Another suspect?</span><div class="suspect-grid" style="margin-top:13px">${SUSPECTS.map(x=>card(x,x.id===s.id)).join('')}</div></div>`);applyArtwork();const el=$('#chat-scroll');if(el)el.scrollTop=el.scrollHeight}
function questionType(q){const text=q.toLowerCase().replace(/[’]/g,"'");if(/how long|how many (hours|years)|since when|for how long/.test(text))return'duration';if(/why|motive|money|pay|wages|will|inheritance|angry|dispute/.test(text))return'motive';if(/who|confirm|witness|verify|saw you/.test(text))return'witness';if(/upstairs|corridor|study|rounds|secret|kitchen|saw|heard|footsteps/.test(text))return'detail';if(/before|earlier|already|previously|had you (done|seen|left|visited|spoken)|what had/.test(text))return'before';return'alibi'}
const BASE_VERBS=['work','wait','read','play','clean','prepare','walk','talk','watch','cook','study','do','sit','go','hear','look','serve'];
function analyseQuestion(q){const t=q.trim().replace(/\s+/g,' '),low=t.toLowerCase();if(t.split(' ').length<3)return{ok:false,hint:'Write a complete question: an auxiliary + subject + verb. Example: Had you left?'};
if(!/^(what|where|when|why|how|who|which|had|did|was|were|could|would|do|does|is|are|can)\b/i.test(t))return{ok:false,hint:'Start with a question word (What / Where / How long) or an auxiliary (Had / Did / Was).'};
if(/\bhad\b[\s\S]*\bbeen\s+([a-z]+)/i.test(t)){
 const word=low.match(/\bhad\b[\s\S]*\bbeen\s+([a-z]+)/)?.[1];
 if(word&&BASE_VERBS.includes(word))return{ok:false,hint:`After “had been”, use V-ing, not “${word}”. Try “had been ${word==='sit'?'sitting':word==='run'?'running':word==='do'?'doing':word==='go'?'going':word==='prepare'?'preparing':word+'ing'}”.`};
}
if(/\bdid\s+you\s+(went|saw|left|heard|worked|been)\b/.test(low))return{ok:false,hint:'After “did”, use the base form: Did you go…? / Did you see…?'};
if(/\bhad\s+(you|he|she|they)\s+(go|see|do|leave|speak|write|hear)\b/.test(low))return{ok:false,hint:'After “had”, use a past participle: gone / seen / done / left / spoken / written / heard.'};
if(/\bhad\s+(you|he|she|they)\b/.test(low)&&!/(been|done|left|seen|heard|gone|arrived|worked|finished|visited|spoken|written|noticed|stayed|cleaned|asked|met|taken|played|waited|read|known|had|spoken|served|found|locked|started|returned|told)/.test(low))return{ok:false,hint:'Past perfect = had + past participle. Past perfect continuous = had + been + V-ing.'};
return{ok:true,hint:(!t.endsWith('?')?'Nice question. Remember the question mark. ':'')+(low.includes('had been')?'You used the past perfect continuous to focus on duration or activity.':low.includes('had ')?'You used the past perfect simple to ask about an earlier action.':'Good question! Ask a follow-up with “had” or “had been” to practise the target language.')};}
function ask(q){const s=findSuspect(S.selected),analysis=analyseQuestion(q),msgs=S.conversations[s.id]||[];msgs.push({who:'user',text:q.trim()});if(!analysis.ok){msgs.push({who:'feedback',text:'Language tip: '+analysis.hint});S.conversations[s.id]=msgs;store();interrogate();return}
const topic=questionType(q);msgs.push({who:'assistant',text:s[topic]});msgs.push({who:'feedback',text:analysis.hint});S.conversations[s.id]=msgs;S.questions.push({suspect:s.name,question:q.trim(),answer:s[topic],topic});store();interrogate();toast(`Statement saved in your notebook: ${s.name}`)}
function room(id){const r=byId(ROOMS,id);if(!r)return;const found=f(id);shell(`<button class="backlink" data-action="go" data-id="board">← Back to the mystery board</button><div class="section-head" style="margin-top:0"><div><span class="eyebrow">Scene examination</span><h1>${r.icon} ${esc(r.name)}</h1><p class="dim">${esc(r.place)}</p></div><span class="ribbon">${found?'EVIDENCE COLLECTED':'UNEXPLORED'}</span></div><div class="game-grid"><section class="panel panel-pad"><div class="room-hd-scene"><img src="assets/room-${r.id}-hd.webp" alt="Victorian ${esc(r.name)} illustrated scene" loading="eager"><div class="scene-callout">🔎 TAP AN OBJECT TO INVESTIGATE</div><div class="scene-interact">${(OBJECTS[r.id]||[]).map((o,i)=>`<button class="scene-hotspot object-pin" data-action="scene-object" data-id="${r.id}" data-object="${i}" style="left:${[23,50,77][i]}%;top:${[72,50,72][i]}%" aria-label="Examine ${esc(o.name)}">${o.src?`<img class="scene-object-art" src="${o.src}" alt="" loading="lazy">`:`<span class="object-pin-symbol">🔎</span>`}<span class="object-label">${esc(o.name)}</span></button>`).join('')}</div></div><div id="object-preview" class="object-preview" aria-live="polite"><p>Tap an evidence icon above to reveal its clue and English challenge. Missing illustrations are shown with a magnifying glass.</p></div><div class="scene-feedback" id="scene-feedback" role="status" aria-live="polite">🔎 TAP AN OBJECT ABOVE — its clue and English challenge will appear here.</div><span class="eyebrow">Found at ${esc(r.time)}</span><h2 style="color:#f3d18c;margin:10px 0">${esc(r.clue)}</h2><div class="parchment"><p style="font-size:19px;line-height:1.9">${esc(r.text)}</p></div><div class="status"><strong>Language lens</strong><p style="margin:7px 0 0">${esc(r.tip)}</p></div>${found?`<div class="status success">✓ Saved in your detective's notebook.</div>`:`<button class="gold-btn" data-action="collect" data-id="${id}">✦ Collect this evidence</button>`}<div class="btnrow" style="margin-top:18px"><button class="outline-btn" data-action="go" data-id="suspects">Interrogate suspects →</button><button class="outline-btn" data-action="go" data-id="lab">Investigate the grammar →</button></div></section><aside class="right-stack">${statPanel()}<div class="parchment"><h3>Detective's reflection</h3><p><b>Before</b> the moment in this clue, what <em>had happened</em>? What <em>had been happening</em>? Which information could challenge an alibi?</p><p class="mini-note" style="color:#67563c">Explore another room if you need more information.</p></div></aside></div>`)}
function notebook(){const tabs=[['evidence','Evidence'],['timeline','Timeline'],['questions','My questions'],['grammar','Grammar notes'],['theory','My theory']];let inner='';if(S.tab==='evidence')inner=`<div class="evidence-list">${S.clues.length?ROOMS.filter(r=>f(r.id)).map(r=>`<article class="evidence-item"><span class="tag">${esc(r.name)} · ${esc(r.time)}</span><h3>${esc(r.clue)}</h3><p>${esc(r.text)}</p></article>`).join(''):'<p class="dim">No clues yet. Explore the mystery board to collect your first clue.</p>'}</div>`;
if(S.tab==='timeline')inner=`<p class="dim">Your working timeline. The activities in the Language Lab help you decide what happened first.</p><div class="timeline">${[['6:00 PM','Colonel Hartley had argued with Lord Ashford.'],['8:30 PM','The card game began.'],['9:30 PM','Joe Stubbs had finished in the greenhouse.'],['10:00 PM','Clara heard footsteps.'],['10:15 PM','An upstairs note was added to the duty book.']].map(x=>`<div class="time-item"><span class="time">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`;
if(S.tab==='questions')inner=S.questions.length?`<div class="evidence-list">${S.questions.slice().reverse().map(x=>`<div class="evidence-item"><span class="tag">${esc(x.suspect)}</span><h3>${esc(x.question)}</h3><p>${esc(x.answer)}</p></div>`).join('')}</div>`:'<p class="dim">Your interview questions and answers will appear here.</p>';
if(S.tab==='grammar')inner=`<div class="evidence-list"><div class="parchment"><h3>Past perfect simple</h3><p><b>had + past participle</b></p><p>“She <b>had locked</b> the door before I arrived.”</p><p>Action presented as complete before a past reference point.</p></div><div class="parchment"><h3>Past perfect continuous</h3><p><b>had + been + V-ing</b></p><p>“She <b>had been waiting</b> for an hour when I arrived.”</p><p>Focus on an activity and its duration up to a past point.</p></div></div><div class="status">Language challenges completed: ${S.grammar.length}/3. <button class="outline-btn" data-action="go" data-id="lab">Open Language Lab →</button></div>`;
if(S.tab==='theory')inner=`<p class="dim">Mark your suspicions. These are your personal hypotheses, not proof.</p><div class="suspicion">${SUSPECTS.map(s=>`<div class="select-card"><strong>${esc(s.name)}</strong><select data-status="${s.id}" aria-label="Suspect status for ${esc(s.name)}">${[['unknown','Not assessed'],['possible','Suspicious'],['cleared','Cleared']].map(([v,t])=>`<option value="${v}" ${(S.statuses[s.id]||'unknown')===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div><div class="form-row" style="margin-top:22px"><label for="theory">Write a hypothesis using evidence. Try: “I suspect… because… had…”</label><textarea id="theory" placeholder="I suspect... because...">${esc(S.theory)}</textarea></div><div class="btnrow"><button class="gold-btn" data-action="save-theory">Save my theory</button><button class="danger-btn" data-action="go" data-id="verdict">Make final accusation →</button></div>`;
shell(`<div class="section-head"><div><span class="eyebrow">Private detective's papers</span><h1>Detective's Notebook</h1><p class="dim">Keep notes. Compare statements. Draw your own conclusions.</p></div><span class="ribbon">${S.clues.length} PIECES OF EVIDENCE</span></div><div class="panel panel-pad"><div class="notebook-tabs">${tabs.map(([id,title])=>`<button class="${S.tab===id?'active':''}" data-action="notetab" data-id="${id}">${title}</button>`).join('')}</div>${inner}</div><div class="btnrow" style="margin-top:20px"><button class="outline-btn" data-action="go" data-id="board">← Back to board</button><button class="gold-btn" data-action="go" data-id="verdict">Final accusation →</button></div>`)}
const LESSONS=[
 {id:'contrast',label:'Discover the difference',q:'Compare: “She had left before the detective arrived.” / “She had been waiting for an hour.” What changes?',choices:['The first presents a completed action; the second highlights an activity and its duration.','The two forms always mean exactly the same.','The second sentence is in the future.'],answer:0,note:'Correct: past perfect simple presents a completed earlier action; continuous focuses on the activity or duration up to a past moment.'},
 {id:'choice',label:'Choose the best tense',q:'At 10 PM, Clara had already spent one hour reading. Which sentence best highlights how long she was reading?',choices:['Clara has read for one hour at ten.','Clara had been reading for an hour when she heard footsteps.','Clara had read tomorrow.'],answer:1,note:'Yes! “Had been reading” focuses on an activity continuing for an hour before she heard the footsteps.'},
 {id:'structure',label:'Build an investigation question',q:'Which question correctly asks about an activity and its duration before a past event?',choices:['How long had you been working before dinner?','How long had you been work before dinner?','How long you had working before dinner?'],answer:0,note:'Exactly. Question word + had + subject + been + V-ing.'}
];
function lab(){const section=S.labtab;let content='';if(section==='discover')content=LESSONS.map((l,i)=>`<article class="activity"><span class="eyebrow">CHALLENGE 0${i+1} · ${esc(l.label)}</span><h3 style="margin-top:12px">${esc(l.q)}</h3><div class="choice-list">${l.choices.map((v,j)=>`<button class="${S.grammar.includes(l.id)&&j===l.answer?'correct':''}" data-action="answer" data-id="${l.id}:${j}">${String.fromCharCode(65+j)}. ${esc(v)}</button>`).join('')}</div>${S.grammar.includes(l.id)?`<div class="status success">✓ ${esc(l.note)}</div>`:''}</article>`).join('');
else content=`<div class="activity"><span class="eyebrow">RECONSTRUCT THE EVENING</span><h3 style="margin-top:12px">Put the events in chronological order.</h3><p class="dim">Use the arrows to move each event. Then check the timeline.</p><div class="timeline" style="margin:20px 0">${S.timeline.map((id,i)=>{const v={t1:'At six, the Colonel argued with his brother.',t2:'At half past eight, the card game began.',t3:'At half past nine, Joe finished in the greenhouse.',t4:'At ten, Clara heard footsteps.'}[id];return `<div class="time-item" style="justify-content:space-between"><span>${esc(v)}</span><span class="btnrow"><button class="outline-btn" style="padding:4px 10px" data-action="move" data-id="${i}:up" aria-label="Move event earlier">↑</button><button class="outline-btn" style="padding:4px 10px" data-action="move" data-id="${i}:down" aria-label="Move event later">↓</button></span></div>`}).join('')}</div><button class="gold-btn" data-action="timeline-check">Check order →</button>${S.grammar.includes('timeline')?'<div class="status success">✓ Timeline reconstructed. Past perfect often helps express events that occurred before a past reference point.</div>':''}</div>`;
shell(`<div class="section-head"><div><span class="eyebrow">The language is your key</span><h1>Detective's Language Lab</h1><p class="dim">Observe, compare, think about meaning, and apply what you discover.</p></div><span class="ribbon">${S.grammar.length}/4 COMPLETED</span></div><div class="panel panel-pad"><div class="lab-tabs"><button data-action="labtab" data-id="discover" class="${section==='discover'?'active':''}">Discover & practise</button><button data-action="labtab" data-id="timeline" class="${section==='timeline'?'active':''}">The Timeline Room</button></div><div class="parchment" style="margin-bottom:20px"><h3>Two windows on the past</h3><div class="form-grid"><p><b>Past perfect simple</b><br>had + past participle<br><em>He had left before dinner.</em></p><p><b>Past perfect continuous</b><br>had been + V-ing<br><em>He had been waiting for an hour.</em></p></div><p style="font-size:13px;margin-bottom:0">En français : action présentée comme accomplie avant un repère passé / activité mise en valeur dans son déroulement ou sa durée. Les deux formes peuvent parfois être possibles avec une nuance de sens.</p></div>${content}</div>`)}
function verdict(){const interviewed=new Set(S.questions.map(q=>q.suspect)).size;const ready=S.clues.length>=3&&interviewed>=2&&S.grammar.length>=1; shell(`<div class="section-head"><div><span class="eyebrow">Case 001 · Final stage</span><h1>Make Your Accusation</h1><p class="dim">A good detective explains a theory with evidence, not just a name.</p></div><span class="ribbon">CASE REPORT</span></div><div class="game-grid"><section class="panel panel-pad"><form id="verdict-form"><div class="form-row"><label for="accused">Who is your main suspect?</label><select id="accused" required><option value="">Select one suspect…</option>${SUSPECTS.map(s=>`<option value="${s.id}" ${S.culprit===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="form-row"><label for="evidence-one">Choose two different clues that support your theory</label><select id="evidence-one" required><option value="">First piece of evidence</option>${ROOMS.filter(r=>f(r.id)).map(r=>`<option value="${r.id}">${esc(r.clue)} — ${esc(r.name)}</option>`).join('')}</select><select id="evidence-two" required><option value="">Second piece of evidence</option>${ROOMS.filter(r=>f(r.id)).map(r=>`<option value="${r.id}">${esc(r.clue)} — ${esc(r.name)}</option>`).join('')}</select></div><div class="form-row"><label for="reason">Explain your theory in English. Use past perfect simple or continuous.</label><textarea id="reason" placeholder="I suspect... because... Mrs Potts had... She had been...">${esc(S.theory)}</textarea></div>${!ready?`<div class="status warn">Before making your final accusation, collect at least 3 clues, question at least 2 different suspects, and complete 1 grammar challenge. Current: ${S.clues.length}/3 clues · ${interviewed}/2 suspects · ${S.grammar.length}/1 language challenge.</div>`:''}<button class="gold-btn" type="submit" ${ready?'':'disabled'}>Seal my final report ✦</button></form></section><aside class="right-stack"><div class="parchment"><h3>Before you accuse…</h3><p>Who had a motive? Whose testimony contradicts another source? Which actions had happened before the key moment?</p><p><strong>Detective's reminder:</strong> a suspicion is not proof.</p></div>${statPanel()}</aside></div>${S.solved?`<div class="panel panel-pad" style="margin-top:20px"><span class="ribbon">CASE REPORT REVIEWED</span><h2 style="color:#ffe3a8;margin:20px 0">The Ravensmoor case</h2><p>The key contradiction concerns <b>Mrs Potts</b>. She claimed that she had only checked rooms downstairs, but the duty book places her near the upstairs corridor at 10:15. Her unpaid wages also provide a possible motive. This is the intended solution to this <em>new classroom version</em> of the mystery.</p><p><b>Your accusation:</b> ${esc(S.culprit?findSuspect(S.culprit).name:'')}.</p><p>${S.culprit==='potts'?'You identified the intended suspect and can justify it using the evidence.':'Compare your theory with the upstairs duty-book note. What does it tell you about Mrs Potts’s statement?'}</p><div class="btnrow"><button class="outline-btn" data-action="go" data-id="notebook">Review your notebook</button><button class="outline-btn" data-action="go" data-id="teacher">Teacher materials</button></div></div>`:''}`)}
function teacher(){shell(`<div class="section-head no-print"><div><span class="eyebrow">Classroom companion</span><h1>Teacher's Desk</h1><p class="dim">Print suspect cards for groupwork. Each code opens that suspect's questioning room.</p></div><div class="btnrow"><button class="outline-btn" data-action="go" data-id="worksheet">Student worksheet</button><button class="gold-btn" data-action="print">Print QR cards</button></div></div><div class="panel panel-pad no-print"><h3 style="color:#ffe0a5">Suggested lesson sequence · 3e / B1</h3><p class="dim">① Investigation & reading → ② Question formation & interviews → ③ Language Lab (simple vs continuous) → ④ Compare contradictions → ⑤ Present a justified accusation. No accounts or online AI services needed.</p><p class="mini-note">The QR codes point to <b>https://brot2you.github.io/Ravensmoor/</b>. If you change the site URL, regenerate the QR images. Questions and progress are stored separately on each device/browser.</p></div><div class="teacher-cards" style="margin-top:18px">${SUSPECTS.map(s=>`<div class="teacher-card"><span style="display:block;font-size:11px;letter-spacing:.12em">RAVENSMOOR — CASE 001</span><h3>${esc(s.name)}</h3><p style="font-size:11px">${esc(s.role)}</p><img class="qrcode" src="${QR_IMAGES[s.id]}" alt="QR code for ${esc(s.name)}"><strong>INTERROGATION</strong><small>Scan & ask questions in English</small></div>`).join('')}</div><div class="btnrow no-print" style="margin-top:20px"><button class="gold-btn" data-action="print">Print these seven cards</button><button class="outline-btn" data-action="go" data-id="worksheet">Open printable worksheet →</button></div>`)}
function worksheet(){shell(`<div class="btnrow no-print" style="margin-bottom:18px"><button class="outline-btn" data-action="go" data-id="teacher">← Teacher desk</button><button class="gold-btn" data-action="print">Print worksheet</button></div><div class="worksheet"><p class="center smallcaps" style="color:#745b31">RAVENSMOOR · DETECTIVE WORKSHEET</p><h1 class="center">Murder at Ravensmoor</h1><p class="center">English · Past perfect simple & continuous · Classroom investigation</p><p>Name: ____________________________________ Class: __________ Date: __________</p><h2>01 · Observe and collect evidence</h2><p>Which rooms have you explored? Note your strongest two clues.</p>${Array.from({length:4},()=>'<div class="write-line"></div>').join('')}<h2>02 · Ask real questions</h2><p>Write two questions using the past perfect (simple or continuous). Then note the answers.</p>${Array.from({length:6},()=>'<div class="write-line"></div>').join('')}<h2>03 · Think about language</h2><p>Compare: <b>He had left.</b> / <b>He had been waiting.</b> Explain the difference in meaning.</p>${Array.from({length:3},()=>'<div class="write-line"></div>').join('')}<h2>04 · Spot a contradiction</h2><p>Which two statements do not seem to agree? Why?</p>${Array.from({length:4},()=>'<div class="write-line"></div>').join('')}<h2>05 · Final theory</h2><p>Who do you suspect? Use at least two pieces of evidence and one past perfect construction.</p>${Array.from({length:5},()=>'<div class="write-line"></div>').join('')}</div>`)}
function render(){document.title='Ravensmoor · '+({home:'Welcome',cases:'Case Files',board:'Mystery Board',suspects:'Suspect Gallery',interrogate:'Interrogation',notebook:'Notebook',lab:'Language Lab',verdict:'Final Accusation',teacher:'Teacher',worksheet:'Worksheet',room:'Explore a room'}[S.page]||'Mystery Game');switch(S.page){case'cases':cases();break;case'board':board();break;case'suspects':suspects();break;case'interrogate':interrogate();break;case'notebook':notebook();break;case'lab':lab();break;case'room':room(S.currentRoom||'study');break;case'verdict':verdict();break;case'teacher':teacher();break;case'worksheet':worksheet();break;default:home()}}
function markAnswer(id,index){const lesson=LESSONS.find(l=>l.id===id);if(!lesson)return;if(lesson.answer===index){if(!S.grammar.includes(id))S.grammar.push(id);store();lab();toast('Well done! You have unlocked a language clue.')}else toast('Try again. Look at the meaning and the verb form.')}
function checkTimeline(){if(S.timeline.join(',')==='t1,t2,t3,t4'){if(!S.grammar.includes('timeline'))S.grammar.push('timeline');store();lab();toast('Timeline solved!')}else toast('Not yet. Pay attention to the times: six → half past eight → half past nine → ten.')}
function submitVerdict(){const suspect=$('#accused').value,a=$('#evidence-one').value,b=$('#evidence-two').value,reason=$('#reason').value.trim();if(!suspect||!a||!b||a===b){toast('Select a suspect and two different pieces of evidence.');return}if(reason.split(/\s+/).length<15){toast('Explain your theory in at least 15 words using the evidence.');return}if(!/\bhad\b/i.test(reason)){toast('Use the past perfect simple or continuous at least once (had … / had been …).');return}S.culprit=suspect;S.selectedClues=[a,b];S.theory=reason;S.solved=true;store();verdict();toast('Final case report submitted!')}
// Optional legacy artwork migration. When a current legacy.html is present, parse its owned data URI illustrations.
// Otherwise, after updating GitHub Pages, try the preceding public Git commit of index.html.
async function loadLegacyArtwork(){let old='';try{const r=await fetch('legacy.html',{cache:'force-cache'});if(r.ok)old=await r.text()}catch(e){}
if(!old.includes('const HERO_SRC')){try{const r=await fetch('https://api.github.com/repos/brot2you/Ravensmoor/commits?path=index.html&per_page=8');if(r.ok){const history=await r.json();for(const c of history.slice(0,5)){const raw=await fetch('https://raw.githubusercontent.com/brot2you/Ravensmoor/'+c.sha+'/index.html');if(!raw.ok)continue;const txt=await raw.text();if(txt.includes('const HERO_SRC')&&txt.includes('const PORTRAITS')){old=txt;break}}}}catch(e){}}
if(!old.includes('const HERO_SRC'))return;
try{let start=old.indexOf('const HERO_SRC'),end=old.indexOf('const SUSPECTS');if(start<0||end<start)return;const snippet=old.slice(start,end);
// Evaluate only the two known image constants from the user's existing public HTML, no other scripts.
const at=snippet.lastIndexOf('const PORTRAITS');if(at<0)return;
const vars=(new Function('"use strict";'+snippet+'; return {hero: typeof HERO_SRC!=="undefined"?HERO_SRC:null,portraits: typeof PORTRAITS!=="undefined"?PORTRAITS:{}}'))();
if(vars.hero?.startsWith('data:image/'))artworks.hero=vars.hero;
for(const [key,val] of Object.entries(vars.portraits||{})){if(val?.face?.startsWith('data:image/'))artworks.portraits[key]=val.face}
}catch(e){/* bundled art remains fully usable */}}
function applyArtwork(){return; if(artworks.hero&&$('#hero-panel')){$('#hero-panel').style.backgroundImage=`linear-gradient(180deg,rgba(3,17,31,.08),rgba(2,13,23,.35) 54%,#0a1928),url("${artworks.hero}")`;const title=$('#hero-panel .hero-inner');if(title)title.style.display='none'}
for(const box of document.querySelectorAll('[data-portrait]')){const url=artworks.portraits[box.dataset.portrait];if(url){box.textContent='';let im=document.createElement('img');im.src=url;im.alt='Victorian portrait';im.style.width='100%';im.style.height='100%';im.style.objectFit='cover';im.style.objectPosition='center top';box.append(im)}}}
// Event delegation: every control has one accessible, reliable click route.
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,id=btn.dataset.id||'';
switch(action){case'go':go(id);break;case'interrogate':S.selected=id;go('interrogate');break;case'room':S.currentRoom=id;go('room');break;case'collect':if(!f(id))S.clues.push(id);store();room(id);toast('Evidence added to notebook!');break;case'level':S.level=id;store();suspects();break;case'prefill':if($('#question')){$('#question').value=id;$('#question').focus()}break;case'notetab':S.tab=id;store();notebook();break;case'labtab':S.labtab=id;store();lab();break;case'answer':{const parts=id.split(':');markAnswer(parts[0],+parts[1]);break}case'move':{const [k,dir]=id.split(':'),i=+k,j=i+(dir==='up'?-1:1);if(j>=0&&j<S.timeline.length){[S.timeline[i],S.timeline[j]]=[S.timeline[j],S.timeline[i]];store();lab()}break}case'timeline-check':checkTimeline();break;case'save-theory':S.theory=$('#theory')?.value||'';store();toast('Theory saved in this browser.');break;case'print':window.print();break;default:break}});
document.addEventListener('submit',e=>{if(e.target.id==='question-form'){e.preventDefault();const val=$('#question').value.trim();if(val)ask(val)}else if(e.target.id==='verdict-form'){e.preventDefault();submitVerdict()}});
document.addEventListener('change',e=>{if(e.target.dataset.status){S.statuses[e.target.dataset.status]=e.target.value;store()}});
const params=new URLSearchParams(location.search);const assigned=params.get('suspect');if(SUSPECTS.some(s=>s.id===assigned)){S.selected=assigned;S.page='interrogate'}render();

</script>

<script>
// V11: fixed scene coordinates; no scrollIntoView, no transforms on selection.
const RAVENSMOOR_TASKS = [
 {prompt:'Choose the correct question to establish what happened first.',options:['Had someone opened it before the guests arrived?','Did someone had opened it?','Had someone been open it?'],answer:0,why:'Had + subject + past participle asks about a completed earlier action.'},
 {prompt:'Which sentence describes an activity continuing before another past event?',options:['Someone had been waiting for an hour before dinner began.','Someone has waited before dinner began.','Someone had waiting before dinner began.'],answer:0,why:'Had been + -ing highlights the duration of an earlier activity.'},
 {prompt:'Choose the most useful detective question about an earlier action.',options:['What had happened before the clock stopped?','What has happen before the clock stopped?','What had been happen before the clock stopped?'],answer:0,why:'What had happened? uses the past perfect simple for an earlier event.'}
];
const RAVEN_OBJECT_CLUES={"library": ["The book had been moved before the librarian returned.", "The envelope had already been sealed when the guests arrived.", "The clock had stopped before the housekeeper entered."], "dining": ["Someone had been drinking from this glass before dinner ended.", "The napkin had been embroidered long before the party.", "The invitation had been delivered before the guests arrived."], "study": ["The diary had been hidden before the detective entered.", "Someone had taken the key before the study was locked.", "The watch had stopped before the final witness arrived."], "kitchen": ["The tray had been polished before the last course was served.", "The cook had been preparing dinner for hours.", "The bottle had been moved before the kitchen was closed."], "garden": ["The gardener had been wearing these gloves before leaving the greenhouse.", "Someone had been trimming the roses before the storm began.", "The plant had been watered before the gardener returned."], "drawing": ["The photograph had been taken years before the murder.", "The jewellery box had been opened before the guests entered.", "Someone had been carrying the handkerchief before tea."], "hall": ["The umbrella had been left here before the rain began.", "Someone had torn the ticket before arriving at the manor.", "The cane had been standing by the door all evening."], "billiard": ["The players had been practising before the match began.", "Someone had placed the card on the table before the lights went out.", "The cufflinks had fallen before the players left."]};
let ravenSelected = null;
document.addEventListener('click', function(ev){
 const btn=ev.target.closest('[data-action="scene-object"]');
 if(btn){
  ev.preventDefault();ev.stopImmediatePropagation();
  const id=btn.dataset.id, i=Number(btn.dataset.object),r=ROOMS.find(x=>x.id===id),o=(OBJECTS[id]||[])[i];if(!r||!o)return;
  ravenSelected={id,i};
  document.querySelectorAll('.scene-hotspot.object-pin').forEach(el=>{el.classList.toggle('is-selected',el===btn);el.setAttribute('aria-pressed',String(el===btn));});
  const task=RAVENSMOOR_TASKS[i%3],preview=document.getElementById('object-preview'),feedback=document.getElementById('scene-feedback');
  if(preview){preview.replaceChildren();if(o.src){const im=document.createElement('img');im.src=o.src;im.alt=o.name;preview.append(im);}const wrap=document.createElement('div');const title=document.createElement('strong');title.textContent=o.name;const clue=document.createElement('p');clue.textContent=RAVEN_OBJECT_CLUES[id]?.[i]||r.text;wrap.append(title,clue);preview.append(wrap);}
  if(feedback){feedback.replaceChildren();const h=document.createElement('strong');h.textContent='🔎 EVIDENCE DISCOVERED · '+o.name;const q=document.createElement('p');q.textContent=task.prompt;feedback.append(h,q);task.options.forEach((choice,n)=>{const answer=document.createElement('button');answer.type='button';answer.className='raven-answer';answer.textContent=choice;answer.dataset.answer=String(n);feedback.append(answer);});const result=document.createElement('p');result.id='raven-result';result.setAttribute('role','status');feedback.append(result);}
  return;
 }
 const answer=ev.target.closest('.raven-answer');if(answer&&ravenSelected){ev.preventDefault();const task=RAVENSMOOR_TASKS[ravenSelected.i%3],correct=Number(answer.dataset.answer)===task.answer;const result=document.getElementById('raven-result');if(result)result.textContent=(correct?'✓ Correct! ':'Not quite. ')+task.why;}
},true);
</script>
